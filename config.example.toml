# S:P:L:I:N:E:D example configuration
# Copy to config/config.toml and adjust paths/settings for the installation.

config_version = 4
mode = "read"
verbosity = "info"

[scan]
scan_mode = true
library_scan = false
scan_mode_timeout = 24
cache_dir = "_cache"
scan_library_dir = ""

[library]
music_library = ""
ignored_subs = []

[samples]
sample_write = true

[credentials]
credential_dir = "credentials"

[fanarttv]
credential_file = "fanarttv.json"

[lastfm]
credential_file = "lastfm.json"

[discogs]
credential_file = "discogs.json"

[musicbrainz]
oauth = false
client_id = ""
callback_uri = "urn:ietf:wg:oauth:2.0:oob"
scope = "profile"
token_file = "musicbrainz.json"
retry_max = 2
mb_min_delay = 1.05
mb_recording_timeout = 7.0

[splineai]
enabled = false
endpoint = ""

[output]
preserve_file = true
file_formats = ["jpeg", "png", "webp"]
file_name = "cover"
square = false
square_mode = "off"
square_round_to = 0
upscale_below_ideal = false
evaluate_final_image = true

[range]
min = 1200
ideal = 1800
max = 2400
ladder = 3600

[sources]
cover_sources = ["deezer", "itunes", "fanarttv", "lastfm", "coverartarchive", "discogs"]
exclude_cover_sources = []

# Docker deployments normally use container paths instead of the relative
# portable defaults above, for example:
#
# [scan]
# cache_dir = "/_cache"
#
# [library]
# music_library = "/music"
#
# [credentials]
# credential_dir = "/credentials"
