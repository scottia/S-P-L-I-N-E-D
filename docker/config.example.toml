# S:P:L:I:N:E:D Config v5 example
# Python/Docker Config v5 example. Paths are container-specific; schema and
# source-policy behavior match the other supported implementations.

config_version = 5
mode = "read"
# Runtime log threshold: debug | info | warning | error
verbosity = "info"

[library]
music_library = "/music"
ignored_subs = []

[scan]
scan_library_dir = "/music"
scan_mode = true
library_scan = false
scan_mode_timeout = 24
# Python/Docker stores the persistent Select Media index at /_cache/splined.db.
# Candidate downloads and samples beside it remain disposable.
cache_dir = "/_cache"
# Set true only when this exact splined.db is also opened through another OS/share.
# Shared mode uses a rollback journal plus a busy timeout instead of WAL.
sqlite_shared = false
# Current-run log is created under log_dir/run and replaced next invocation.
log_dir = "/_logs"
history_dir = "/_logs/_history"

[output]
file_name = "cover"
file_formats = ["jpeg", "png", "webp"]
preserve_file = true
square = true
square_mode = "crop"
square_round_to = 16
upscale_below_ideal = false
evaluate_final_image = true

[range]
min = 1200
ideal = 1800
max = 2400
ladder = 3600

[sources]
cover_sources = ["deezer", "itunes", "fanarttv", "lastfm", "musicbrainz", "coverartarchive", "discogs", "amazon"]
exclude_cover_sources = []

# Source Override activates the source-specific artwork policy. With it off,
# the source uses the global [range] policy while retaining these saved values.
[source_policies.deezer]
enabled = true
source_override = false
minimum_range_type = "LowerRange"
allow_below_minimum_fallback = false
primary_image_only = true

[source_policies.itunes]
enabled = true
source_override = false
minimum_range_type = "LowerRange"
allow_below_minimum_fallback = false
primary_image_only = true

[source_policies.fanarttv]
enabled = true
source_override = false
minimum_range_type = "LowerRange"
allow_below_minimum_fallback = false
primary_image_only = true

[source_policies.lastfm]
enabled = true
source_override = false
minimum_range_type = "LowerRange"
allow_below_minimum_fallback = false
primary_image_only = true

[source_policies.coverartarchive]
enabled = true
source_override = false
minimum_range_type = "LowerRange"
allow_below_minimum_fallback = false
primary_image_only = true

[source_policies.discogs]
enabled = true
source_override = false
minimum_range_type = "LowerRange"
allow_below_minimum_fallback = false
primary_image_only = true

# MusicBrainz selects the release; Cover Art Archive supplies the image bytes.
# This priority is independent from exact-release Cover Art Archive discovery.
[source_policies.musicbrainz]
enabled = true
source_override = false
minimum_range_type = "LowerRange"
allow_below_minimum_fallback = false
primary_image_only = true

[source_policies.amazon]
# Amazon Store search is credential-free, best effort, and opt-in.
enabled = false
source_override = false
minimum_range_type = "LowerRange"
allow_below_minimum_fallback = false
primary_image_only = true

[samples]
sample_write = true

[credentials]
credential_dir = "/credentials"

[logging]
retention_days = 14

[history]
enabled = true
retention_days = 0 # 0 keeps history forever

# Reserved A:I:S:P:L:I:N:E:D companion boundary; no AI processing is enabled.
[aisplined]
enabled = false
endpoint = ""
minimum_short_side = 600
allow_below_minimum_override = false
