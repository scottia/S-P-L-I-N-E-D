name: SPLINED (All OS) and GHCR

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Release platform"
        required: true
        default: "Windows"
        type: choice
        options:
          - "Windows"
          - "Ubuntu"
          - "macOS"
          - "All"
      extended_windows_validation:
        description: "Run the full Rust and WinForms GUI regression suite before Windows packaging"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: splined-release-next-patch
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  WINDOWS_TARGET: "x86_64-pc-windows-msvc"

jobs:
  prepare-release:
    name: Create next patch tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Require main branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: Run this release workflow from the main branch."
            echo "Received: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Provision release metadata and push tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          BASE_MAIN_SHA=$(git rev-parse HEAD)

          RELEASE_VERSION=$(python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          tags = subprocess.check_output(
              ["git", "tag", "--list"],
              text=True,
          ).splitlines()
          versions = []
          for tag in tags:
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          cargo_path = Path("Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8-sig")
          source_match = re.search(
              r'(?ms)^\[package\].*?^version\s*=\s*"(\d+\.\d+\.\d+)"',
              cargo,
          )
          if not source_match:
              raise SystemExit("Cargo.toml package version was not found")

          source_version = tuple(map(int, source_match.group(1).split(".")))

          windows_cargo_path = Path("windows/Cargo.toml")
          windows_cargo = windows_cargo_path.read_text(encoding="utf-8")
          windows_source_match = re.search(
              r'(?ms)^\[package\].*?^version\s*=\s*"(\d+\.\d+\.\d+)"',
              windows_cargo,
          )
          if not windows_source_match:
              raise SystemExit("windows/Cargo.toml package version was not found")
          windows_source_version = tuple(
              map(int, windows_source_match.group(1).split("."))
          )
          if windows_source_version != source_version:
              raise SystemExit(
                  "Root and Windows package versions must match before release provisioning"
              )

          compatible_versions = [
              version for version in versions
              if version[:2] == source_version[:2]
          ]
          baseline = max([source_version, *compatible_versions])
          release_version = f"{baseline[0]}.{baseline[1]}.{baseline[2] + 1}"
          if release_version in tags or f"v{release_version}" in tags:
              raise SystemExit(f"Release tag already exists: {release_version}")

          cargo, cargo_count = re.subn(
              r'(?ms)(^\[package\].*?^version\s*=\s*")[^"]+("\s*$)',
              rf'\g<1>{release_version}\g<2>',
              cargo,
              count=1,
          )
          if cargo_count != 1:
              raise SystemExit("Cargo.toml package version was not updated")
          cargo_path.write_text(cargo, encoding="utf-8")

          lock_path = Path("Cargo.lock")
          lock = lock_path.read_text(encoding="utf-8")
          lock, lock_count = re.subn(
              r'(?m)(^name = "splined"\r?\nversion = ")[^"]+("$)',
              rf'\g<1>{release_version}\g<2>',
              lock,
              count=1,
          )
          if lock_count != 1:
              raise SystemExit("Cargo.lock SPLINED package version was not updated")
          lock_path.write_text(lock, encoding="utf-8")

          windows_cargo, windows_cargo_count = re.subn(
              r'(?ms)(^\[package\].*?^version\s*=\s*")[^"]+("\s*$)',
              rf'\g<1>{release_version}\g<2>',
              windows_cargo,
              count=1,
          )
          if windows_cargo_count != 1:
              raise SystemExit("windows/Cargo.toml package version was not updated")
          windows_cargo_path.write_text(windows_cargo, encoding="utf-8")

          windows_lock_path = Path("windows/Cargo.lock")
          windows_lock = windows_lock_path.read_text(encoding="utf-8")
          windows_lock, windows_lock_count = re.subn(
              r'(?m)(^name = "splined-windows"\r?\nversion = ")[^"]+("$)',
              rf'\g<1>{release_version}\g<2>',
              windows_lock,
              count=1,
          )
          if windows_lock_count != 1:
              raise SystemExit("windows/Cargo.lock package version was not updated")
          windows_lock_path.write_text(windows_lock, encoding="utf-8")

          release_info_path = Path("windows/gui/ReleaseInfo.cs")
          release_info = release_info_path.read_text(encoding="utf-8-sig")
          for field in ("NumericVersion", "SemanticVersion"):
              release_info, count = re.subn(
                  rf'(public const string {field} = ")[^"]+(";)',
                  rf'\g<1>{release_version}\g<2>',
                  release_info,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Windows {field} was not updated")
          release_info, count = re.subn(
              r'(public const string PackageName = "SPLINED-Windows-)[^"]+(";)',
              rf'\g<1>{release_version}\g<2>',
              release_info,
              count=1,
          )
          if count != 1:
              raise SystemExit("Windows package name was not updated")
          release_info_path.write_text(release_info, encoding="utf-8")

          assembly_path = Path("windows/gui/AssemblyInfo.cs")
          assembly = assembly_path.read_text(encoding="utf-8-sig")
          assembly = re.sub(
              r'(native Windows interface - v)[^ ]+( Stable)',
              rf'\g<1>{release_version}\g<2>',
              assembly,
              count=1,
          )
          for attribute in ("AssemblyVersion", "AssemblyFileVersion"):
              assembly, count = re.subn(
                  rf'(\[assembly: {attribute}\(")[^"]+("\)\])',
                  rf'\g<1>{release_version}.0\g<2>',
                  assembly,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Windows {attribute} was not updated")
          assembly_path.write_text(assembly, encoding="utf-8")

          app_manifest_path = Path("windows/gui/app.manifest")
          app_manifest = app_manifest_path.read_text(encoding="utf-8-sig")
          app_manifest, count = re.subn(
              r'(<assemblyIdentity version=")[^"]+(" name="SPLINED\.Windows\.GUI"/>)',
              rf'\g<1>{release_version}.0\g<2>',
              app_manifest,
              count=1,
          )
          if count != 1:
              raise SystemExit("Windows executable manifest version was not updated")
          app_manifest_path.write_text(app_manifest, encoding="utf-8")

          for package_path in (
              Path("windows/package/Package.appxmanifest"),
              Path("windows/package/SPLINED.appinstaller.template"),
          ):
              package = package_path.read_text(encoding="utf-8-sig")
              package, count = re.subn(
                  r'(Version=")[0-9]+\.[0-9]+\.[0-9]+\.0(")',
                  rf'\g<1>{release_version}.0\g<2>',
                  package,
              )
              if count < 1:
                  raise SystemExit(f"Package version was not updated in {package_path}")
              package_path.write_text(package, encoding="utf-8")

          python_path = Path("python/splined.py")
          source = python_path.read_text(encoding="utf-8")
          source, version_count = re.subn(
              r'^VERSION = "[^"]+"$',
              f'VERSION = "{release_version}"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          source, agent_count = re.subn(
              r'^USER_AGENT = "SPLINED/[^ ]+ \(https://github\.com/scottia/S-P-L-I-N-E-D\)"$',
              f'USER_AGENT = "SPLINED/{release_version} '
              '(https://github.com/scottia/S-P-L-I-N-E-D)"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if version_count != 1 or agent_count != 1:
              raise SystemExit("Python release metadata was not updated")
          python_path.write_text(source, encoding="utf-8")

          print(release_version)
          PY
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=("Cargo.lock" "Cargo.toml" "python/splined.py" "windows/Cargo.lock" "windows/Cargo.toml" "windows/gui/AssemblyInfo.cs" "windows/gui/ReleaseInfo.cs" "windows/gui/app.manifest" "windows/package/Package.appxmanifest" "windows/package/SPLINED.appinstaller.template")
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo "ERROR: Release provisioning changed unexpected files."
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi

          git add Cargo.toml Cargo.lock python/splined.py windows/Cargo.toml windows/Cargo.lock windows/gui/AssemblyInfo.cs windows/gui/ReleaseInfo.cs windows/gui/app.manifest windows/package/Package.appxmanifest windows/package/SPLINED.appinstaller.template
          git commit -m "release: prepare ${RELEASE_VERSION}"

          RELEASE_COMMIT=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN_SHA"

          git fetch --force origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_MAIN_SHA" ]; then
            echo "ERROR: main changed while the release tag was being prepared; run again."
            exit 1
          fi

          git tag -a "$RELEASE_VERSION" -m "S:P:L:I:N:E:D ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Created release tag $RELEASE_VERSION at $RELEASE_COMMIT"

  build-windows:
    name: Build Release — Windows
    needs: prepare-release
    if: ${{ inputs.platform == 'Windows' || inputs.platform == 'All' }}
    runs-on: windows-latest

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$WINDOWS_TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Install Rust quality components
        if: ${{ inputs.extended_windows_validation }}
        shell: bash
        run: rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"

      - name: Calculate Windows dependency cache key
        id: windows-dependency-cache-key
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content -Raw -LiteralPath windows/Cargo.lock
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "splined-windows"\r?\n)version = "[^"]+"'
          $normalized = [regex]::Replace($lock, $pattern, '${1}version = "<release>"')
          if ($normalized -eq $lock) {
            throw "Unable to normalize the release-only Windows package version for the dependency cache key."
          }
          $bytes = [Text.Encoding]::UTF8.GetBytes($normalized)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "hash=$hash" | Add-Content $env:GITHUB_OUTPUT

      - name: Restore Cargo dependency cache
        id: rust-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-${{ steps.windows-dependency-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-

      - name: Install pinned upstream WinAppCli
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $installRoot = Join-Path $env:RUNNER_TEMP "splined-winappcli"
          npm install --prefix $installRoot --no-save --no-audit --no-fund "@microsoft/winappcli@0.7.1"
          $commandDirectory = Join-Path $installRoot "node_modules\.bin"
          $commandDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $reportedVersion = (& (Join-Path $commandDirectory "winapp.cmd") --version) -join "`n"
          if ($reportedVersion -notmatch '0\.7\.1') {
            throw "The pinned WinAppCli installation did not report version 0.7.1."
          }

      - name: Run extended Windows regression suite
        if: ${{ inputs.extended_windows_validation }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path windows/Cargo.toml -- --check
          cargo clippy --locked --manifest-path windows/Cargo.toml --all-targets --target $env:WINDOWS_TARGET -- -D warnings
          cargo test --locked --manifest-path windows/Cargo.toml --lib --target $env:WINDOWS_TARGET
          Push-Location windows/gui
          try { cmd /d /c RUN-GUI-QA.cmd } finally { Pop-Location }

      - name: Build clean x64 WinForms and Rust DLL pair
        id: windows-build
        shell: pwsh
        env:
          SPLINED_BUILD_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "windows/target/$env:WINDOWS_TARGET/release"
          if (Test-Path -LiteralPath $releaseRoot) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }
          $env:SPLINED_BUILD_GUI = "1"
          $started = Get-Date
          cargo build --locked --release --manifest-path windows/Cargo.toml --target $env:WINDOWS_TARGET
          "elapsed_seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Stage and audit portable Windows release
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "windows/target/$env:WINDOWS_TARGET/release"
          $portableRoot = "release-package/SPLINED"
          New-Item -ItemType Directory -Force -Path "$portableRoot/runtime", release-assets | Out-Null
          Copy-Item "$releaseRoot/splined.exe" "$portableRoot/splined.exe"
          Copy-Item "$releaseRoot/splined_core.dll" "$portableRoot/runtime/splined-core.dll"
          Copy-Item release/README-WINDOWS.txt "$portableRoot/README-WINDOWS.txt"

          function Assert-Amd64Pe([string]$path) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path).Path)
            if ($bytes.Length -lt 64) { throw "PE image is truncated: $path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) { throw "PE header is invalid: $path" }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw "PE signature is invalid: $path" }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) { throw ("Expected AMD64 PE Machine 0x8664 for {0}; found 0x{1:X4}." -f $path, $machine) }
          }
          Assert-Amd64Pe "$portableRoot/splined.exe"
          Assert-Amd64Pe "$portableRoot/runtime/splined-core.dll"

          $version = (Get-Item -LiteralPath "$portableRoot/splined.exe").VersionInfo.FileVersion
          if ($version -ne "$env:RELEASE_VERSION.0") { throw "The Windows executable version does not match the release tag." }
          $assembly = [Reflection.Assembly]::LoadFile((Resolve-Path -LiteralPath "$portableRoot/splined.exe").Path)
          $buildInfo = $assembly.GetType("Splined.WindowsGui.BuildInfo", $true)
          $commitField = $buildInfo.GetField("Commit", [Reflection.BindingFlags] "Static,Public,NonPublic")
          if ($commitField.GetValue($null) -ne $env:RELEASE_COMMIT) { throw "The Windows executable commit does not match the release commit." }

          $files = @(Get-ChildItem -LiteralPath $portableRoot -Recurse -File | ForEach-Object {
            $_.FullName.Substring((Resolve-Path $portableRoot).Path.Length + 1).Replace('\', '/')
          } | Sort-Object)
          $expected = @("README-WINDOWS.txt", "runtime/splined-core.dll", "splined.exe")
          if (Compare-Object $files $expected) { throw "Portable package contents do not match the release allowlist." }
          if (Test-Path -LiteralPath "$portableRoot/data") { throw "A fresh portable package must not contain data/." }

          $smoke = Start-Process -FilePath (Resolve-Path "$portableRoot/splined.exe") -ArgumentList "--native-smoke" -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "The clean portable WinForms-to-Rust DLL smoke test failed." }

          Compress-Archive -Path $portableRoot -DestinationPath "release-assets/splined-windows-x86_64.zip" -Force
          $archiveEntries = @(tar -tf release-assets/splined-windows-x86_64.zip | Where-Object { -not $_.EndsWith('/') } | Sort-Object)
          $expectedEntries = @("SPLINED/README-WINDOWS.txt", "SPLINED/runtime/splined-core.dll", "SPLINED/splined.exe")
          if (Compare-Object $archiveEntries $expectedEntries) { throw "Portable archive contents do not match the release allowlist." }

          $manifest = [ordered]@{
            schema = 2
            channel = "stable"
            version = $env:RELEASE_VERSION
            commit = $env:RELEASE_COMMIT
            short_commit = $env:RELEASE_COMMIT.Substring(0, 7)
            published_at = [DateTime]::UtcNow.ToString("o")
            release_url = "https://github.com/scottia/S-P-L-I-N-E-D/releases/tag/$env:RELEASE_VERSION"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 release-assets/windows-update.json

      - name: Build Store-ready unsigned x64 MSIX with WinAppCli
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $layout = "msix-layout"
          New-Item -ItemType Directory -Force -Path "$layout/runtime" | Out-Null
          Copy-Item release-package/SPLINED/splined.exe "$layout/splined.exe"
          Copy-Item release-package/SPLINED/runtime/splined-core.dll "$layout/runtime/splined-core.dll"
          Copy-Item windows/package/Package.appxmanifest "$layout/Package.appxmanifest"
          winapp manifest update-assets windows/gui/splined-app-icon.png --manifest "$layout/Package.appxmanifest"
          winapp create-debug-identity "$layout/splined.exe" --manifest "$layout/Package.appxmanifest" --no-install
          winapp pack $layout --manifest "$layout/Package.appxmanifest" --executable splined.exe --output release-assets/SPLINED-x64.msix --no-sign
          winapp tool makeappx unpack /p release-assets/SPLINED-x64.msix /d unpacked-msix /o
          $packageManifest = [xml](Get-Content -Raw unpacked-msix/AppxManifest.xml)
          if ($packageManifest.Package.Identity.ProcessorArchitecture -ne "x64") { throw "The MSIX package architecture is not x64." }
          if ($packageManifest.OuterXml -notmatch '<uap:FileType>\.spl</uap:FileType>') { throw "The MSIX package does not declare the .spl association." }

      - name: Development-sign, install, launch, identify, and uninstall MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $password = [Guid]::NewGuid().ToString("N")
          $pfx = Join-Path $env:RUNNER_TEMP "splined-development.pfx"
          $cer = [IO.Path]::ChangeExtension($pfx, ".cer")
          $devPackage = Join-Path $env:RUNNER_TEMP "SPLINED-x64-development.msix"
          $thumbprint = $null
          try {
            winapp cert generate --manifest msix-layout/Package.appxmanifest --output $pfx --password $password --export-cer
            $thumbprint = (Get-PfxCertificate -FilePath $cer).Thumbprint
            winapp cert install $cer
            winapp pack msix-layout --manifest msix-layout/Package.appxmanifest --executable splined.exe --output $devPackage --cert $pfx --cert-password $password
            Add-AppxPackage -Path $devPackage
            $package = Get-AppxPackage -Name SPLINED
            if (-not $package -or $package.Architecture -ne "X64") { throw "The development MSIX did not install with x64 package identity." }
            $installedManifest = $package | Get-AppxPackageManifest
            if ($installedManifest.Package.Applications.Application.Id -ne "SPLINED") { throw "The installed package identity is invalid." }
            if ($installedManifest.OuterXml -notmatch '<uap:FileType>\.spl</uap:FileType>') { throw "The installed package lost its .spl association." }
            $smokePath = Join-Path $env:LOCALAPPDATA "Packages\$($package.PackageFamilyName)\LocalState\SPLINED\package-identity-smoke.ok"
            Remove-Item -LiteralPath $smokePath -Force -ErrorAction SilentlyContinue
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public enum SplinedActivateOptions
          {
              None = 0,
              DesignMode = 1,
              NoErrorUI = 2,
              NoSplashScreen = 4
          }

          [ComImport]
          [Guid("2e941141-7f97-4756-ba1d-9decde894a3d")]
          [InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
          public interface ISplinedApplicationActivationManager
          {
              int ActivateApplication(
                  [MarshalAs(UnmanagedType.LPWStr)] string appUserModelId,
                  [MarshalAs(UnmanagedType.LPWStr)] string arguments,
                  SplinedActivateOptions options,
                  out uint processId);
              int ActivateForFile(
                  [MarshalAs(UnmanagedType.LPWStr)] string appUserModelId,
                  IntPtr itemArray,
                  [MarshalAs(UnmanagedType.LPWStr)] string verb,
                  out uint processId);
              int ActivateForProtocol(
                  [MarshalAs(UnmanagedType.LPWStr)] string appUserModelId,
                  IntPtr itemArray,
                  out uint processId);
          }

          [ComImport]
          [Guid("45BA127D-10A8-46EA-8AB7-56EA9078943C")]
          public class SplinedApplicationActivationManager {}

          public static class SplinedPackageActivator
          {
              public static uint Activate(string appUserModelId, string arguments)
              {
                  uint processId;
                  var manager = (ISplinedApplicationActivationManager)new SplinedApplicationActivationManager();
                  int result = manager.ActivateApplication(
                      appUserModelId,
                      arguments,
                      SplinedActivateOptions.NoErrorUI,
                      out processId);
                  if (result < 0) Marshal.ThrowExceptionForHR(result);
                  return processId;
              }
          }
          '@
            $applicationUserModelId = "$($package.PackageFamilyName)!SPLINED"
            $processId = [SplinedPackageActivator]::Activate($applicationUserModelId, "--package-identity-smoke")
            Wait-Process -Id $processId -Timeout 30 -ErrorAction Stop
            if (-not (Test-Path -LiteralPath $smokePath)) {
              throw "The installed SPLINED process did not confirm package identity and native DLL initialization."
            }
          }
          finally {
            Get-AppxPackage -Name SPLINED | Remove-AppxPackage -ErrorAction SilentlyContinue
            if ($thumbprint) {
              certutil -delstore TrustedPeople $thumbprint | Out-Null
            }
            Remove-Item -LiteralPath $pfx, $cer, $devPackage -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-windows-x86_64
          path: |
            release-assets/splined-windows-x86_64.zip
            release-assets/SPLINED-x64.msix
            release-assets/windows-update.json
          if-no-files-found: error

      - name: Report Windows build cache
        shell: pwsh
        run: |
          @"
          ## Windows release build

          - Cargo dependency cache exact hit: ``${{ steps.rust-cache.outputs.cache-hit }}``
          - Rust toolchain: ``${{ env.RUST_TOOLCHAIN }}``
          - Cargo build: ``${{ steps.windows-build.outputs.elapsed_seconds }} seconds``
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  build-ubuntu:
    name: Build Release — Ubuntu
    needs: prepare-release
    if: ${{ inputs.platform == 'Ubuntu' || inputs.platform == 'All' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build Ubuntu release
        shell: bash
        run: cargo build --locked --release

      - name: Package Ubuntu release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package release-assets
          cp target/release/splined release-package/splined
          cp release/README-LINUX.txt release-package/README-LINUX.txt
          chmod +x release-package/splined
          tar -czf release-assets/splined-linux-x86_64.tar.gz -C release-package splined README-LINUX.txt

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-linux-x86_64
          path: release-assets/splined-linux-x86_64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build Release — macOS
    needs: prepare-release
    if: ${{ inputs.platform == 'macOS' || inputs.platform == 'All' }}
    runs-on: macos-latest

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build macOS release
        shell: bash
        run: cargo build --locked --release

      - name: Package macOS release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package release-assets
          cp target/release/splined release-package/splined
          cp release/README-MACOS.txt release-package/README-MACOS.txt
          chmod +x release-package/splined
          tar -czf release-assets/splined-macos.tar.gz -C release-package splined README-MACOS.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-macos
          path: release-assets/splined-macos.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build-windows
      - build-ubuntu
      - build-macos
    if: >-
      ${{
        always() &&
        needs.prepare-release.result == 'success' &&
        (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
        (needs.build-ubuntu.result == 'success' || needs.build-ubuntu.result == 'skipped') &&
        (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download selected OS archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          pattern: splined-*
          merge-multiple: true

      - name: Create checksums and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t archives < <(find . -maxdepth 1 -type f \( -name 'splined-*.zip' -o -name 'splined-*.tar.gz' \) -printf '%f\n' | sort)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: No selected OS archive was produced."
            exit 1
          fi
          release_files=("${archives[@]}")
          for metadata in windows-update.json SPLINED-x64.msix; do
            if [ -f "$metadata" ]; then release_files+=("$metadata"); fi
          done
          sha256sum "${release_files[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_VERSION" \
            "${release_files[@]}" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "S:P:L:I:N:E:D $RELEASE_VERSION" \
            --generate-notes

  publish-ghcr:
    name: Publish GHCR
    needs:
      - prepare-release
      - publish-release
    if: ${{ always() && needs.prepare-release.result == 'success' && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/scottia/splined
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}

      - name: Build GHCR image
        shell: bash
        run: |
          set -euo pipefail
          VERSION_TAG="v${RELEASE_VERSION}"
          docker build --pull \
            --build-arg SPLINED_BUILD_CHANNEL=release \
            --label "org.opencontainers.image.source=https://github.com/scottia/S-P-L-I-N-E-D" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=${{ needs.prepare-release.outputs.commit }}" \
            --tag "$IMAGE_NAME:$VERSION_TAG" \
            --tag "$IMAGE_NAME:latest" \
            ./python

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push version and latest image tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:v${RELEASE_VERSION}"
          docker push "$IMAGE_NAME:latest"

  release-summary:
    name: Release summary
    needs:
      - prepare-release
      - publish-release
      - publish-ghcr
    if: ${{ always() && needs.publish-release.result == 'success' && needs.publish-ghcr.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Report published outputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          {
            echo "## SPLINED release complete"
            echo
            echo "- Version and Git tag: \`$RELEASE_VERSION\`"
            echo "- Selected platform: \`${{ inputs.platform }}\`"
            echo "- GitHub Release: published"
            echo "- GHCR: \`ghcr.io/scottia/splined:v$RELEASE_VERSION\`"
            echo "- GHCR latest: \`ghcr.io/scottia/splined:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
