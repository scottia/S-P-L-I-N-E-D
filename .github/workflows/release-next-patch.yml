name: SPLINED (All OS) and GHCR

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Release platform"
        required: true
        default: "Windows"
        type: choice
        options:
          - "Windows"
          - "Ubuntu"
          - "macOS"
          - "All"

permissions:
  contents: read

concurrency:
  group: splined-release-next-patch
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  release-preflight:
    name: Validate release prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Require Windows signing material before creating a tag
        if: ${{ inputs.platform == 'Windows' || inputs.platform == 'All' }}
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PUBLISHER: ${{ secrets.WINDOWS_CERTIFICATE_PUBLISHER }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in WINDOWS_CERTIFICATE_BASE64 WINDOWS_CERTIFICATE_PASSWORD WINDOWS_CERTIFICATE_PUBLISHER TAURI_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Windows release signing material is unavailable: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

  prepare-release:
    name: Create next patch tag
    needs: release-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Require main branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: Run this release workflow from the main branch."
            echo "Received: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Provision release metadata and push tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          BASE_MAIN_SHA=$(git rev-parse HEAD)

          RELEASE_VERSION=$(python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          tags = subprocess.check_output(
              ["git", "tag", "--list"],
              text=True,
          ).splitlines()
          versions = []
          for tag in tags:
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          cargo_path = Path("Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8-sig")
          source_match = re.search(
              r'(?ms)^\[package\].*?^version\s*=\s*"(\d+\.\d+\.\d+)"',
              cargo,
          )
          if not source_match:
              raise SystemExit("Cargo.toml package version was not found")

          source_version = tuple(map(int, source_match.group(1).split(".")))

          windows_cargo_path = Path("windows/Cargo.toml")
          windows_cargo = windows_cargo_path.read_text(encoding="utf-8")
          windows_source_match = re.search(
              r'(?ms)^\[package\].*?^version\s*=\s*"(\d+\.\d+\.\d+)"',
              windows_cargo,
          )
          if not windows_source_match:
              raise SystemExit("windows/Cargo.toml package version was not found")
          windows_source_version = tuple(
              map(int, windows_source_match.group(1).split("."))
          )
          if windows_source_version != source_version:
              raise SystemExit(
                  "Root and Windows package versions must match before release provisioning"
              )

          compatible_versions = [
              version for version in versions
              if version[:2] == source_version[:2]
          ]
          baseline = max([source_version, *compatible_versions])
          release_version = f"{baseline[0]}.{baseline[1]}.{baseline[2] + 1}"
          if release_version in tags or f"v{release_version}" in tags:
              raise SystemExit(f"Release tag already exists: {release_version}")

          cargo, cargo_count = re.subn(
              r'(?ms)(^\[package\].*?^version\s*=\s*")[^"]+("\s*$)',
              rf'\g<1>{release_version}\g<2>',
              cargo,
              count=1,
          )
          if cargo_count != 1:
              raise SystemExit("Cargo.toml package version was not updated")
          cargo_path.write_text(cargo, encoding="utf-8")

          lock_path = Path("Cargo.lock")
          lock = lock_path.read_text(encoding="utf-8")
          lock, lock_count = re.subn(
              r'(?m)(^name = "splined"\r?\nversion = ")[^"]+("$)',
              rf'\g<1>{release_version}\g<2>',
              lock,
              count=1,
          )
          if lock_count != 1:
              raise SystemExit("Cargo.lock SPLINED package version was not updated")
          lock_path.write_text(lock, encoding="utf-8")

          windows_cargo, windows_cargo_count = re.subn(
              r'(?ms)(^\[package\].*?^version\s*=\s*")[^"]+("\s*$)',
              rf'\g<1>{release_version}\g<2>',
              windows_cargo,
              count=1,
          )
          if windows_cargo_count != 1:
              raise SystemExit("windows/Cargo.toml package version was not updated")
          windows_cargo_path.write_text(windows_cargo, encoding="utf-8")

          windows_lock_path = Path("windows/Cargo.lock")
          windows_lock = windows_lock_path.read_text(encoding="utf-8")
          windows_lock, windows_lock_count = re.subn(
              r'(?m)(^name = "splined-windows"\r?\nversion = ")[^"]+("$)',
              rf'\g<1>{release_version}\g<2>',
              windows_lock,
              count=1,
          )
          if windows_lock_count != 1:
              raise SystemExit("windows/Cargo.lock package version was not updated")
          windows_lock_path.write_text(windows_lock, encoding="utf-8")

          tauri_path = Path("windows/tauri.conf.json")
          tauri = tauri_path.read_text(encoding="utf-8")
          tauri, tauri_count = re.subn(
              r'("version"\s*:\s*")[^"]+("\s*,)',
              rf'\g<1>{release_version}\g<2>',
              tauri,
              count=1,
          )
          if tauri_count != 1:
              raise SystemExit("windows/tauri.conf.json version was not updated")
          tauri_path.write_text(tauri, encoding="utf-8")

          python_path = Path("python/splined.py")
          source = python_path.read_text(encoding="utf-8")
          source, version_count = re.subn(
              r'^VERSION = "[^"]+"$',
              f'VERSION = "{release_version}"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          source, agent_count = re.subn(
              r'^USER_AGENT = "SPLINED/[^ ]+ \(https://github\.com/scottia/S-P-L-I-N-E-D\)"$',
              f'USER_AGENT = "SPLINED/{release_version} '
              '(https://github.com/scottia/S-P-L-I-N-E-D)"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if version_count != 1 or agent_count != 1:
              raise SystemExit("Python release metadata was not updated")
          python_path.write_text(source, encoding="utf-8")

          print(release_version)
          PY
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=("Cargo.lock" "Cargo.toml" "python/splined.py" "windows/Cargo.lock" "windows/Cargo.toml" "windows/tauri.conf.json")
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo "ERROR: Release provisioning changed unexpected files."
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi

          git add Cargo.toml Cargo.lock python/splined.py windows/Cargo.toml windows/Cargo.lock windows/tauri.conf.json
          git commit -m "release: prepare ${RELEASE_VERSION}"

          RELEASE_COMMIT=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN_SHA"

          git fetch --force origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_MAIN_SHA" ]; then
            echo "ERROR: main changed while the release tag was being prepared; run again."
            exit 1
          fi

          git tag -a "$RELEASE_VERSION" -m "S:P:L:I:N:E:D ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Created release tag $RELEASE_VERSION at $RELEASE_COMMIT"

  build-windows:
    name: Build Release — Windows
    needs: prepare-release
    if: ${{ inputs.platform == 'Windows' || inputs.platform == 'All' }}
    runs-on: windows-latest

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: ${{ runner.os }}-splined-windows-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-${{ env.RUST_TOOLCHAIN }}-
            ${{ runner.os }}-splined-windows-

      - name: Require Windows signing material
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PUBLISHER: ${{ secrets.WINDOWS_CERTIFICATE_PUBLISHER }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("WINDOWS_CERTIFICATE_BASE64", "WINDOWS_CERTIFICATE_PASSWORD", "WINDOWS_CERTIFICATE_PUBLISHER", "TAURI_UPDATER_PUBLIC_KEY", "TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD")) {
            if ([String]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Required Windows release signing material is unavailable: $name" }
          }

      - name: Install official Tauri v2 build tool
        shell: bash
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Import publisher certificate and configure signed build
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PUBLISHER: ${{ secrets.WINDOWS_CERTIFICATE_PUBLISHER }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "splined-release-certificate.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable
          if (-not $certificate.HasPrivateKey) { throw "The Windows release certificate has no private key." }
          $configuration = [ordered]@{
            bundle = [ordered]@{
              publisher = $env:WINDOWS_CERTIFICATE_PUBLISHER
              windows = [ordered]@{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
            plugins = [ordered]@{
              updater = [ordered]@{ pubkey = $env:TAURI_UPDATER_PUBLIC_KEY }
            }
          }
          $configuration | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 windows/tauri.release.conf.json

      - name: Build signed Windows release and updater package
        id: windows-build
        shell: pwsh
        env:
          SPLINED_BUILD_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          SPLINED_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $started = Get-Date
          Push-Location windows
          try { cargo tauri build --config tauri.release.conf.json } finally { Pop-Location }
          "elapsed_seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Package Windows release
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-package, release-assets | Out-Null
          Copy-Item windows/target/release/splined.exe release-package/splined.exe
          Copy-Item release/README-WINDOWS.txt release-package/README-WINDOWS.txt
          $packageFiles = Get-ChildItem -LiteralPath release-package -File
          if ($packageFiles.Count -ne 2 -or @($packageFiles | Where-Object Extension -eq ".exe").Count -ne 1) { throw "Portable Windows package must contain exactly splined.exe and README-WINDOWS.txt." }
          Compress-Archive -Path "release-package/*" -DestinationPath "release-assets/splined-windows-x86_64.zip" -Force
          $installer = Get-ChildItem windows/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer -or -not (Test-Path "$($installer.FullName).sig")) { throw "The signed Windows installer/update artifacts were not produced." }
          Copy-Item $installer.FullName release-assets/splined-windows-x86_64-installer.exe
          Copy-Item "$($installer.FullName).sig" release-assets/splined-windows-x86_64-installer.exe.sig
          $archive = Get-Item release-assets/splined-windows-x86_64.zip
          $gui = Get-Item release-package/splined.exe
          $manifest = [ordered]@{
            schema = 2
            channel = "stable"
            version = $env:RELEASE_VERSION
            commit = $env:RELEASE_COMMIT
            short_commit = $env:RELEASE_COMMIT.Substring(0, 7)
            published_at = [DateTime]::UtcNow.ToString("o")
            release_url = "https://github.com/scottia/S-P-L-I-N-E-D/releases/tag/$env:RELEASE_VERSION"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 release-assets/windows-update.json
          $latest = [ordered]@{
            version = $env:RELEASE_VERSION
            notes = "Signed SPLINED Windows update $env:RELEASE_VERSION"
            pub_date = [DateTime]::UtcNow.ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content -Raw release-assets/splined-windows-x86_64-installer.exe.sig).Trim()
                url = "https://github.com/scottia/S-P-L-I-N-E-D/releases/download/$env:RELEASE_VERSION/splined-windows-x86_64-installer.exe"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 release-assets/latest.json

      - name: Validate Windows trust chain and package boundaries
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PUBLISHER: ${{ secrets.WINDOWS_CERTIFICATE_PUBLISHER }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("release-package/splined.exe", "release-assets/splined-windows-x86_64-installer.exe")) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") { throw "Authenticode validation failed for $path: $($signature.Status)" }
            if ($signature.SignerCertificate.Subject -notlike "*$env:WINDOWS_CERTIFICATE_PUBLISHER*") { throw "Unexpected Windows publisher for $path." }
            if (-not $signature.TimeStamperCertificate) { throw "The Windows signature is not timestamped: $path" }
          }
          if (-not (Test-Path release-assets/splined-windows-x86_64-installer.exe.sig)) { throw "Cryptographic updater-package signature is missing." }
          $archiveEntries = tar -tf release-assets/splined-windows-x86_64.zip
          if (@($archiveEntries | Where-Object { $_ -match '\.exe$' }).Count -ne 1) { throw "Portable archive contains more than one executable." }
          foreach ($forbidden in @("splined-core.exe", "splined-update.exe", "data/config.toml", "data/ui.toml", "splined.db")) {
            if ($archiveEntries -contains $forbidden) { throw "Portable archive contains forbidden state or executable: $forbidden" }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-windows-x86_64
          path: |
            release-assets/splined-windows-x86_64.zip
            release-assets/splined-windows-x86_64-installer.exe
            release-assets/splined-windows-x86_64-installer.exe.sig
            release-assets/latest.json
            release-assets/windows-update.json
          if-no-files-found: error

      - name: Report Windows build cache
        shell: pwsh
        run: |
          @"
          ## Windows release build

          - Rust cache exact hit: ``${{ steps.rust-cache.outputs.cache-hit }}``
          - Rust toolchain: ``${{ env.RUST_TOOLCHAIN }}``
          - Cargo build: ``${{ steps.windows-build.outputs.elapsed_seconds }} seconds``
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  build-ubuntu:
    name: Build Release — Ubuntu
    needs: prepare-release
    if: ${{ inputs.platform == 'Ubuntu' || inputs.platform == 'All' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build Ubuntu release
        shell: bash
        run: cargo build --locked --release

      - name: Package Ubuntu release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package release-assets
          cp target/release/splined release-package/splined
          cp release/README-LINUX.txt release-package/README-LINUX.txt
          chmod +x release-package/splined
          tar -czf release-assets/splined-linux-x86_64.tar.gz -C release-package splined README-LINUX.txt

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-linux-x86_64
          path: release-assets/splined-linux-x86_64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build Release — macOS
    needs: prepare-release
    if: ${{ inputs.platform == 'macOS' || inputs.platform == 'All' }}
    runs-on: macos-latest

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build macOS release
        shell: bash
        run: cargo build --locked --release

      - name: Package macOS release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package release-assets
          cp target/release/splined release-package/splined
          cp release/README-MACOS.txt release-package/README-MACOS.txt
          chmod +x release-package/splined
          tar -czf release-assets/splined-macos.tar.gz -C release-package splined README-MACOS.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-macos
          path: release-assets/splined-macos.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build-windows
      - build-ubuntu
      - build-macos
    if: >-
      ${{
        always() &&
        needs.prepare-release.result == 'success' &&
        (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
        (needs.build-ubuntu.result == 'success' || needs.build-ubuntu.result == 'skipped') &&
        (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download selected OS archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          pattern: splined-*
          merge-multiple: true

      - name: Create checksums and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t archives < <(find . -maxdepth 1 -type f \( -name 'splined-*.zip' -o -name 'splined-*.tar.gz' \) -printf '%f\n' | sort)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: No selected OS archive was produced."
            exit 1
          fi
          release_files=("${archives[@]}")
          for metadata in windows-update.json latest.json splined-windows-x86_64-installer.exe splined-windows-x86_64.nsis.zip splined-windows-x86_64.nsis.zip.sig; do
            if [ -f "$metadata" ]; then release_files+=("$metadata"); fi
          done
          sha256sum "${release_files[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_VERSION" \
            "${release_files[@]}" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "S:P:L:I:N:E:D $RELEASE_VERSION" \
            --generate-notes

  publish-ghcr:
    name: Publish GHCR
    needs:
      - prepare-release
      - publish-release
    if: ${{ always() && needs.prepare-release.result == 'success' && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/scottia/splined
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}

      - name: Build GHCR image
        shell: bash
        run: |
          set -euo pipefail
          VERSION_TAG="v${RELEASE_VERSION}"
          docker build --pull \
            --build-arg SPLINED_BUILD_CHANNEL=release \
            --label "org.opencontainers.image.source=https://github.com/scottia/S-P-L-I-N-E-D" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=${{ needs.prepare-release.outputs.commit }}" \
            --tag "$IMAGE_NAME:$VERSION_TAG" \
            --tag "$IMAGE_NAME:latest" \
            ./python

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push version and latest image tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:v${RELEASE_VERSION}"
          docker push "$IMAGE_NAME:latest"

  release-summary:
    name: Release summary
    needs:
      - prepare-release
      - publish-release
      - publish-ghcr
    if: ${{ always() && needs.publish-release.result == 'success' && needs.publish-ghcr.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Report published outputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          {
            echo "## SPLINED release complete"
            echo
            echo "- Version and Git tag: \`$RELEASE_VERSION\`"
            echo "- Selected platform: \`${{ inputs.platform }}\`"
            echo "- GitHub Release: published"
            echo "- GHCR: \`ghcr.io/scottia/splined:v$RELEASE_VERSION\`"
            echo "- GHCR latest: \`ghcr.io/scottia/splined:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
