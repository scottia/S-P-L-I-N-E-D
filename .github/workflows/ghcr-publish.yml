name: SPLINED GHCR Recovery Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing numeric Git release tag to republish (for example 1.0.5)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: splined-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/scottia/splined

jobs:
  publish:
    name: Build, verify, and publish GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Resolve and verify version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          VERSION=$(python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8-sig"))
          source = Path("python/splined.py").read_text(encoding="utf-8")
          docker_config = tomllib.loads(
              Path("docker/config.example.toml").read_text(encoding="utf-8")
          )
          match = re.search(r'^VERSION = "([^"]+)"$', source, re.MULTILINE)
          if not match:
              raise SystemExit("VERSION declaration not found in python/splined.py")

          cargo_version = cargo["package"]["version"]
          python_version = match.group(1)
          requested_tag = os.environ["REQUESTED_TAG"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", requested_tag):
              raise SystemExit(f"Recovery release_tag must be numeric SemVer: {requested_tag}")
          if cargo_version != python_version:
              raise SystemExit(
                  f"Rust/Python version mismatch: Cargo.toml={cargo_version}, Python={python_version}"
              )
          if python_version != requested_tag:
              raise SystemExit(
                  f"Requested tag/source mismatch: tag={requested_tag}, Python={python_version}"
              )
          schema = re.search(r'^CONFIG_VERSION = (\d+)$', source, re.MULTILINE)
          if not schema or schema.group(1) != "5":
              raise SystemExit("Recovery publishing requires Python Config v5")
          if docker_config.get("config_version") != 5:
              raise SystemExit("Recovery publishing requires the Docker Config v5 example")

          print(python_version)
          PY
          )

          RELEASE_TAG="v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "SPLINED version: $VERSION"
          echo "Container tags: latest, $RELEASE_TAG"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/scottia/S-P-L-I-N-E-D" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:$RELEASE_TAG" \
            ./python

      - name: Verify built image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL=$(docker run --rm "$IMAGE_NAME:latest" -V | tr -d '\r')
          EXPECTED="SPLINED $VERSION"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Container image version verification failed."
            exit 1
          fi

          CONFIG_CHECK=$(docker run --rm \
            -v "$PWD/docker/config.example.toml:/config/config.toml:ro" \
            "$IMAGE_NAME:latest" \
            --config-check | tr -d '\r')
          printf '%s\n' "$CONFIG_CHECK"
          grep -F "config_version = 5" <<<"$CONFIG_CHECK"

      - name: Publish image tags
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:$RELEASE_TAG"
          docker push "$IMAGE_NAME:latest"

      - name: Publish summary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          {
            echo "## GHCR package published"
            echo
            echo "- \`$IMAGE_NAME:$RELEASE_TAG\`"
            echo "- \`$IMAGE_NAME:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
