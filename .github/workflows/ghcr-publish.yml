name: SPLINED (GHCR)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: splined-ghcr-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/scottia/splined

jobs:
  publish:
    name: Publish latest SPLINED release to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: SPLINED (GHCR) must be run from main."
            exit 1
          fi

      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve current repository release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION=$(python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8-sig"))
          source = Path("python/splined.py").read_text(encoding="utf-8")
          python_version = re.search(r'^VERSION = "([^"]+)"$', source, re.MULTILINE)
          if not python_version:
              raise SystemExit("VERSION declaration not found in python/splined.py")

          cargo_version = cargo["package"]["version"]
          if cargo_version != python_version.group(1):
              raise SystemExit(
                  f"Rust/Python version mismatch: Cargo.toml={cargo_version}, "
                  f"Python={python_version.group(1)}"
              )
          print(cargo_version)
          PY
          )

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Repository release version must be numeric SemVer (X.Y.Z): $RELEASE_VERSION"
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "ERROR: Release tag $RELEASE_VERSION does not exist."
            exit 1
          fi

          RELEASE_COMMIT=$(git rev-parse "$RELEASE_VERSION^{commit}")
          git checkout --detach "$RELEASE_COMMIT"

          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "container_tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

          echo "Release tag: $RELEASE_VERSION"
          echo "Release commit: $RELEASE_COMMIT"
          echo "Container tags: v$RELEASE_VERSION, latest"

      - name: Verify exact Config v5 release source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8-sig"))
          source = Path("python/splined.py").read_text(encoding="utf-8")
          docker_config = tomllib.loads(
              Path("docker/config.example.toml").read_text(encoding="utf-8")
          )
          expected = os.environ["RELEASE_VERSION"]
          python_version = re.search(r'^VERSION = "([^"]+)"$', source, re.MULTILINE)
          schema = re.search(r'^CONFIG_VERSION = (\d+)$', source, re.MULTILINE)

          if cargo["package"]["version"] != expected:
              raise SystemExit("Root Cargo version does not match the published release tag")
          if not python_version or python_version.group(1) != expected:
              raise SystemExit("Python version does not match the published release tag")
          if not schema or schema.group(1) != "5":
              raise SystemExit("Refusing to publish a non-Config-v5 Python image")
          if docker_config.get("config_version") != 5:
              raise SystemExit("Refusing to publish with a non-v5 Docker example")

          print(f"Repository release: {expected}")
          print("Config schema: 5")
          PY

      - name: Build and verify release image
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          CONTAINER_TAG: ${{ steps.release.outputs.container_tag }}
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/scottia/S-P-L-I-N-E-D" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --tag "$IMAGE_NAME:$CONTAINER_TAG" \
            --tag "$IMAGE_NAME:latest" \
            ./python

          ACTUAL=$(docker run --rm "$IMAGE_NAME:$CONTAINER_TAG" -V | tr -d '\r')
          EXPECTED="SPLINED $RELEASE_VERSION"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          CONFIG_CHECK=$(docker run --rm \
            -v "$PWD/docker/config.example.toml:/config/config.toml:ro" \
            "$IMAGE_NAME:$CONTAINER_TAG" \
            --config-check | tr -d '\r')
          printf '%s\n' "$CONFIG_CHECK"
          grep -F "config_version = 5" <<<"$CONFIG_CHECK"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish release and latest tags
        shell: bash
        env:
          CONTAINER_TAG: ${{ steps.release.outputs.container_tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:$CONTAINER_TAG"
          docker push "$IMAGE_NAME:latest"

      - name: Publish summary
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          CONTAINER_TAG: ${{ steps.release.outputs.container_tag }}
        run: |
          {
            echo "## SPLINED GHCR published"
            echo
            echo "- Repository release: \`$RELEASE_VERSION\`"
            echo "- Release commit: \`$RELEASE_COMMIT\`"
            echo "- Config schema: \`5\`"
            echo "- \`$IMAGE_NAME:$CONTAINER_TAG\`"
            echo "- \`$IMAGE_NAME:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
