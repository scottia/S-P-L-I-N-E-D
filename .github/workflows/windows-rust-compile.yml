name: Windows Rust Compile

on:
  pull_request:
    branches:
      - dev
    paths:
      - "windows/**"
      - ".github/workflows/windows-rust-compile.yml"
  push:
    branches:
      - dev
    paths:
      - "windows/**"
      - ".github/workflows/windows-rust-compile.yml"

permissions:
  contents: read

concurrency:
  group: windows-rust-compile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  WINDOWS_TARGET: "x86_64-pc-windows-msvc"

jobs:
  compile:
    name: Check Windows Rust source
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$WINDOWS_TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Restore Cargo dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-windows-compile-v1-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-compile-v1-${{ env.RUST_TOOLCHAIN }}-
            ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-

      - name: Check locked x64 Windows Rust source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo check --locked --manifest-path windows/Cargo.toml --lib --target $env:WINDOWS_TARGET
