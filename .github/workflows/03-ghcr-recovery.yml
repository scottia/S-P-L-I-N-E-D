name: 03. GHCR Recovery - Tagged Image and Ubuntu Asset

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RISK: rebuilds GHCR image for an existing numeric tag, adds a missing Ubuntu release asset, and refreshes git-cliff notes. No Store changes."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: splined-ghcr-recovery-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-ghcr:
    name: Publish tagged image and repair Ubuntu release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/scottia/splined
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Require main branch dispatch
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main || {
            echo "::error title=Main branch required::Run GHCR recovery from main."
            exit 1
          }

      - name: Validate numeric existing-tag input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must be an existing numeric release tag such as 1.0.71."
            exit 1
          fi

      - name: Checkout exact existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      - name: Checkout current authoritative release engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .splined-release-engine
          sparse-checkout: |
            cliff.toml
            release/Install-GitCliff.ps1
            release/Generate-ReleaseNotes.ps1
            release/templates

      - name: Verify exact existing tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")"
          release=$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)
          test "$(jq -r '.tagName' <<< "$release")" = "$RELEASE_VERSION"
          test "$(jq -r '.isDraft' <<< "$release")" = false
          test "$(jq -r '.isPrerelease' <<< "$release")" = false
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [ "$latest" != "$RELEASE_VERSION" ]; then
            echo "::error title=Older release refused::Recovery would move GHCR latest backward from $latest to $RELEASE_VERSION."
            exit 1
          fi

      - name: Install and verify git-cliff 2.14.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .splined-release-engine/release/Install-GitCliff.ps1 -InstallDirectory (Join-Path $env:RUNNER_TEMP "git-cliff-2.14.2")
          if (((git-cliff --version) -join "`n").Trim() -cne "git-cliff 2.14.2") {
            throw "The release-note engine must be git-cliff 2.14.2."
          }

      - name: Render GitHub release notes from the authoritative git-cliff context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .splined-release-engine/release/Generate-ReleaseNotes.ps1 `
            -Version $env:RELEASE_VERSION `
            -RepositoryRoot . `
            -ConfigPath .splined-release-engine/cliff.toml `
            -GitHubTemplatePath .splined-release-engine/release/templates/github-release.tera `
            -OutputDirectory release-notes

      - name: Build exact release Docker image
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          docker build --pull \
            --build-arg SPLINED_BUILD_CHANNEL=release \
            --label "org.opencontainers.image.source=https://github.com/scottia/S-P-L-I-N-E-D" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --tag "$IMAGE_NAME:v$RELEASE_VERSION" \
            --tag "$IMAGE_NAME:latest" \
            ./python

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish version and latest tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:v$RELEASE_VERSION"
          docker push "$IMAGE_NAME:latest"

      - name: Check whether Ubuntu asset already exists
        id: ubuntu-asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -Fxq 'splined-linux-x86_64.tar.gz' <<< "$assets"; then
            echo 'missing=false' >> "$GITHUB_OUTPUT"
          else
            echo 'missing=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -Fxq 'splined-linux-x86_64.sha256' <<< "$assets"; then
            echo 'checksum_missing=false' >> "$GITHUB_OUTPUT"
          else
            echo 'checksum_missing=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install stable Rust for missing Ubuntu asset
        if: ${{ steps.ubuntu-asset.outputs.missing == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build exact tagged Ubuntu release asset
        if: ${{ steps.ubuntu-asset.outputs.missing == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release
          mkdir -p release-package release-assets
          cp target/release/splined release-package/splined
          cp release/README-LINUX.txt release-package/README-LINUX.txt
          chmod +x release-package/splined
          tar -czf release-assets/splined-linux-x86_64.tar.gz -C release-package splined README-LINUX.txt

      - name: Add missing Ubuntu asset without replacing existing assets
        if: ${{ steps.ubuntu-asset.outputs.missing == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_VERSION" release-assets/splined-linux-x86_64.tar.gz --repo "$GITHUB_REPOSITORY"

      - name: Retrieve existing Ubuntu asset when only its checksum is missing
        if: ${{ steps.ubuntu-asset.outputs.missing == 'false' && steps.ubuntu-asset.outputs.checksum_missing == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern 'splined-linux-x86_64.tar.gz' --dir release-assets

      - name: Add missing Ubuntu asset checksum
        if: ${{ steps.ubuntu-asset.outputs.checksum_missing == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum splined-linux-x86_64.tar.gz > splined-linux-x86_64.sha256)
          gh release upload "$RELEASE_VERSION" release-assets/splined-linux-x86_64.sha256 --repo "$GITHUB_REPOSITORY"

      - name: Replace existing GitHub Release body with git-cliff notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes/GITHUB-RELEASE.md

      - name: GHCR resolution summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## SPLINED Docker/GHCR resolution complete"
            echo
            echo "- Existing tag: \`$RELEASE_VERSION\`"
            echo "- Exact release commit: \`$(git rev-parse HEAD)\`"
            echo "- GHCR: \`$IMAGE_NAME:v$RELEASE_VERSION\` and \`$IMAGE_NAME:latest\`"
            echo "- Existing GitHub Release body: refreshed from git-cliff context"
            echo "- Release or tag created: \`no\`"
            echo "- Microsoft Store touched: \`no\`"
          } >> "$GITHUB_STEP_SUMMARY"
