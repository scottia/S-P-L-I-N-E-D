name: 03. GHCR Recovery - Existing Published Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RISK: recover missing GHCR tags for the latest existing published numeric release. Does not change GitHub Releases, tags, assets, or Store."
        required: true
        type: string

permissions:
  contents: read

# Serialize normal publication and recovery so Workflow 03 cannot race
# Workflow 01 while it is publishing the authoritative GHCR tags.
concurrency:
  group: splined-release-next-patch
  cancel-in-progress: false

jobs:
  recover-ghcr:
    name: Verify or recover existing release image tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/scottia/splined
      IMAGE_SOURCE: https://github.com/scottia/S-P-L-I-N-E-D
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Require main branch dispatch
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main || {
            echo "::error title=Main branch required::Run GHCR recovery from main."
            exit 1
          }

      - name: Validate numeric existing-tag input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must be an existing numeric release tag such as 2.0.3."
            exit 1
          fi

      - name: Checkout exact existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      - name: Verify exact existing tag and published GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          release_commit=$(git rev-parse HEAD)
          test "$release_commit" = "$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")"

          release=$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)
          test "$(jq -r '.tagName' <<< "$release")" = "$RELEASE_VERSION"
          test "$(jq -r '.isDraft' <<< "$release")" = false
          test "$(jq -r '.isPrerelease' <<< "$release")" = false

          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [ "$latest" != "$RELEASE_VERSION" ]; then
            echo "::error title=Older release refused::Recovery would move GHCR latest backward from $latest to $RELEASE_VERSION."
            exit 1
          fi

          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Inspect existing tags, digests, and OCI provenance
        id: inspect
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          VERSION_REF="$IMAGE_NAME:v$RELEASE_VERSION"
          LATEST_REF="$IMAGE_NAME:latest"

          fail_closed() {
            local title=$1
            local message=$2
            {
              echo "## SPLINED GHCR recovery blocked"
              echo
              echo "- Status: failed closed"
              echo "- Release: \`$RELEASE_VERSION\`"
              echo "- Exact release commit: \`$EXPECTED_COMMIT\`"
              echo "- Reason: $message"
              echo "- GitHub Release, tag, and assets modified: \`no\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=$title::$message"
            exit 1
          }

          inspect_tag() {
            local prefix=$1
            local reference=$2
            local pull_log="$RUNNER_TEMP/ghcr-${prefix,,}-pull.log"

            if docker pull "$reference" >"$pull_log" 2>&1; then
              cat "$pull_log"
              local image_json digest version revision source
              image_json=$(docker image inspect "$reference" --format '{{json .}}')
              digest=$(jq -r --arg image "$IMAGE_NAME" \
                '.RepoDigests[]? | select(startswith($image + "@")) | split("@")[1]' \
                <<< "$image_json" | sed -n '1p')
              version=$(jq -r '.Config.Labels["org.opencontainers.image.version"] // ""' <<< "$image_json")
              revision=$(jq -r '.Config.Labels["org.opencontainers.image.revision"] // ""' <<< "$image_json")
              source=$(jq -r '.Config.Labels["org.opencontainers.image.source"] // ""' <<< "$image_json")

              if [ -z "$digest" ] || [ -z "$version" ] || [ -z "$revision" ] || [ -z "$source" ]; then
                fail_closed "GHCR provenance unavailable" \
                  "Provenance cannot be verified for $reference because its digest or required OCI labels are missing."
              fi
              if [ "$version" != "$RELEASE_VERSION" ] || \
                 [ "$revision" != "$EXPECTED_COMMIT" ] || \
                 [ "$source" != "$IMAGE_SOURCE" ]; then
                fail_closed "GHCR provenance conflict" \
                  "Existing image $reference has unexpected source, version, or revision provenance; it will not be overwritten."
              fi

              printf -v "${prefix}_STATE" '%s' present
              printf -v "${prefix}_DIGEST" '%s' "$digest"
              return
            fi

            cat "$pull_log"
            if grep -Eiq '(manifest unknown|no such manifest|name unknown|not found)' "$pull_log"; then
              printf -v "${prefix}_STATE" '%s' missing
              printf -v "${prefix}_DIGEST" '%s' ''
              return
            fi

            fail_closed "GHCR inspection failed" \
              "Provenance cannot be verified for $reference because the registry lookup failed unexpectedly."
          }

          inspect_tag VERSION "$VERSION_REF"
          inspect_tag LATEST "$LATEST_REF"

          if [ "$VERSION_STATE" = present ] && [ "$LATEST_STATE" = present ]; then
            if [ "$VERSION_DIGEST" != "$LATEST_DIGEST" ]; then
              fail_closed "GHCR digest conflict" \
                "Existing version and latest tags have different digests; neither tag will be overwritten."
            fi
            action=noop
            source_digest=$VERSION_DIGEST
          elif [ "$VERSION_STATE" = present ]; then
            action=recover-latest
            source_digest=$VERSION_DIGEST
          elif [ "$LATEST_STATE" = present ]; then
            action=recover-version
            source_digest=$LATEST_DIGEST
          else
            fail_closed "GHCR artifact equivalence unavailable" \
              "Both tags are missing. Workflow 01 recorded no published image digest or signed attestation, and its historical build inputs cannot be proven identical; recovery will not rebuild or publish a potentially different image. Create a new versioned release."
          fi

          {
            echo "version_state=$VERSION_STATE"
            echo "version_digest=$VERSION_DIGEST"
            echo "latest_state=$LATEST_STATE"
            echo "latest_digest=$LATEST_DIGEST"
            echo "source_digest=$source_digest"
            echo "action=$action"
          } >> "$GITHUB_OUTPUT"

      - name: Reuse verified image for missing version tag
        if: ${{ steps.inspect.outputs.action == 'recover-version' }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$IMAGE_NAME:latest" "$IMAGE_NAME:v$RELEASE_VERSION"

      - name: Reuse verified image for missing latest tag
        if: ${{ steps.inspect.outputs.action == 'recover-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$IMAGE_NAME:v$RELEASE_VERSION" "$IMAGE_NAME:latest"

      - name: Publish only missing GHCR tags
        if: ${{ steps.inspect.outputs.action != 'noop' }}
        shell: bash
        env:
          RECOVERY_ACTION: ${{ steps.inspect.outputs.action }}
        run: |
          set -euo pipefail

          VERSION_REF="$IMAGE_NAME:v$RELEASE_VERSION"
          LATEST_REF="$IMAGE_NAME:latest"

          assert_remote_tag_missing() {
            local reference=$1
            local inspect_log="$RUNNER_TEMP/ghcr-pre-push-$(echo "$reference" | tr '/:' '--').log"
            if docker manifest inspect "$reference" >"$inspect_log" 2>&1; then
              cat "$inspect_log"
              echo "::error title=GHCR tag appeared during recovery::$reference now exists; refusing a possible overwrite. Rerun recovery to verify it."
              exit 1
            fi
            cat "$inspect_log"
            if ! grep -Eiq '(manifest unknown|no such manifest|name unknown|not found)' "$inspect_log"; then
              echo "::error title=GHCR pre-push inspection failed::Could not prove $reference is absent; refusing to publish."
              exit 1
            fi
          }

          case "$RECOVERY_ACTION" in
            recover-version)
              assert_remote_tag_missing "$VERSION_REF"
              docker push "$VERSION_REF"
              ;;
            recover-latest)
              assert_remote_tag_missing "$LATEST_REF"
              docker push "$LATEST_REF"
              ;;
            *)
              echo "ERROR: unsupported recovery action: $RECOVERY_ACTION"
              exit 1
              ;;
          esac

      - name: Verify final tags, digests, and provenance
        id: verify
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
          RECOVERY_ACTION: ${{ steps.inspect.outputs.action }}
        run: |
          set -euo pipefail

          verify_tag() {
            local reference=$1
            docker pull "$reference" >&2
            local image_json digest version revision source
            image_json=$(docker image inspect "$reference" --format '{{json .}}')
            digest=$(jq -r --arg image "$IMAGE_NAME" \
              '.RepoDigests[]? | select(startswith($image + "@")) | split("@")[1]' \
              <<< "$image_json" | sed -n '1p')
            version=$(jq -r '.Config.Labels["org.opencontainers.image.version"] // ""' <<< "$image_json")
            revision=$(jq -r '.Config.Labels["org.opencontainers.image.revision"] // ""' <<< "$image_json")
            source=$(jq -r '.Config.Labels["org.opencontainers.image.source"] // ""' <<< "$image_json")
            if [ -z "$digest" ] || [ "$version" != "$RELEASE_VERSION" ] || \
               [ "$revision" != "$EXPECTED_COMMIT" ] || [ "$source" != "$IMAGE_SOURCE" ]; then
              echo "::error title=GHCR final verification failed::Digest or OCI provenance is invalid for $reference."
              exit 1
            fi
            printf '%s' "$digest"
          }

          version_digest=$(verify_tag "$IMAGE_NAME:v$RELEASE_VERSION")
          latest_digest=$(verify_tag "$IMAGE_NAME:latest")
          if [ "$version_digest" != "$latest_digest" ]; then
            echo "::error title=GHCR final digest conflict::Version and latest tags do not resolve to the same digest."
            exit 1
          fi

          {
            echo "digest=$version_digest"
            echo "action=$RECOVERY_ACTION"
          } >> "$GITHUB_OUTPUT"

      - name: GHCR recovery summary
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RECOVERY_ACTION: ${{ steps.verify.outputs.action }}
          VERIFIED_DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## SPLINED GHCR recovery complete"
            echo
            echo "- Existing published release: \`$RELEASE_VERSION\`"
            echo "- Exact release commit: \`$RELEASE_COMMIT\`"
            echo "- Recovery action: \`$RECOVERY_ACTION\`"
            echo "- Verified manifest digest: \`$VERIFIED_DIGEST\`"
            echo "- Provenance: source, version, and revision OCI labels verified"
            echo "- Signed provenance: not asserted; Workflow 01 does not publish a separately verifiable GHCR attestation"
            echo "- GitHub Release, tag, and assets modified: \`no\`"
            echo "- Microsoft Store touched: \`no\`"
          } >> "$GITHUB_STEP_SUMMARY"
