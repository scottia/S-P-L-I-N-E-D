name: 20. /dev Pre-release Testing
run-name: ${{ inputs.pr_evaluation && format('WF20 PR {0} v{1}', inputs.evaluation_pr_number, inputs.evaluation_version) || 'WF20 origin/dev' }}

on:
  workflow_dispatch:
    inputs:
      quick_portable:
        description: "TEST BUILD (default): KEEP CHECKED for any Windows or WebGUI test build. Uncheck only for BUILD ONLY, REPORT."
        default: true
        type: boolean
      report_only:
        description: "BUILD ONLY, REPORT: report the selected plan without building either client. Check this instead of TEST BUILD."
        default: false
        type: boolean

      target_windows:
        description: "TARGET — WINDOWS (default): optimized portable splined.exe. UNCHECK for WebGUI-only testing."
        default: true
        type: boolean
      target_webgui:
        description: "TARGET — WEBGUI: downloadable WebGUI package for splined-dev. Check both targets to build both clients."
        default: false
        type: boolean
      pr_evaluation:
        description: "PR EVALUATION: CHECK when entering a PR number and evaluation version below. Leave unchecked to build current origin/dev."
        default: false
        type: boolean
      evaluation_pr_number:
        description: "PR EVALUATION — PR number: digits only. Required if PR EVALUATION is checked; otherwise leave blank."
        default: ""
        type: string
      evaluation_version:
        description: "PR EVALUATION — build version: numeric X.Y.Z. Required if PR EVALUATION is checked; otherwise leave blank. Runner-only stamp."
        default: ""
        type: string

      force_rebuild:
        description: "FRESH TEST BUILD: ignore reusable evaluation artifacts and prior WebGUI validation. Compatible compiler caches remain enabled."
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: splined-quick-portable-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  WINDOWS_TARGET: "x86_64-pc-windows-msvc"

jobs:
  resolve-source:
    name: Resolve pre-release testing source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      main_sha: ${{ steps.source.outputs.main_sha }}
      source_version: ${{ steps.source.outputs.source_version }}
      committed_source_version: ${{ steps.source.outputs.committed_source_version }}
      source_mode: ${{ steps.source.outputs.source_mode }}
      evaluation_pr: ${{ steps.source.outputs.evaluation_pr }}
      report_only: ${{ steps.source.outputs.report_only }}
      target_windows: ${{ steps.source.outputs.target_windows }}
      target_webgui: ${{ steps.source.outputs.target_webgui }}
      started_epoch: ${{ steps.source.outputs.started_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select exact dev or PR evaluation source
        id: source
        shell: bash
        env:
          QUICK_PORTABLE: ${{ inputs.quick_portable }}
          REPORT_ONLY: ${{ inputs.report_only }}
          TARGET_WINDOWS: ${{ inputs.target_windows }}
          TARGET_WEBGUI: ${{ inputs.target_webgui }}
          PR_EVALUATION: ${{ inputs.pr_evaluation }}
          EVALUATION_PR_NUMBER: ${{ inputs.evaluation_pr_number }}
          EVALUATION_VERSION: ${{ inputs.evaluation_version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STARTED_EPOCH=$(date +%s)
          count=0
          if [ "$QUICK_PORTABLE" = true ]; then count=$((count + 1)); fi
          if [ "$REPORT_ONLY" = true ]; then count=$((count + 1)); fi
          if [ "$count" -ne 1 ]; then
            echo "::error title=Choose a completion::Check TEST BUILD for either client, or BUILD ONLY, REPORT for an audit. Exactly one must be checked; found $count."
            exit 1
          fi
          if [ "$TARGET_WINDOWS" != true ] && [ "$TARGET_WEBGUI" != true ]; then
            echo "::error title=Choose a target::Check TARGET — WINDOWS, TARGET — WEBGUI, or both. For WebGUI-only, uncheck Windows and keep TEST BUILD checked."
            exit 1
          fi
          if [ "$PR_EVALUATION" = true ]; then
            if [[ "$GITHUB_REF" != refs/heads/* ]]; then
              echo "::error title=Branch workflow required::Dispatch the evaluation workflow from a branch, not a tag."
              exit 1
            fi
            if ! [[ "$EVALUATION_PR_NUMBER" =~ ^[1-9][0-9]*$ && "$EVALUATION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=PR evaluation inputs required::With PR EVALUATION checked, enter both the open PR number and the numeric X.Y.Z build version."
              exit 1
            fi
          elif [ "$GITHUB_REF" != refs/heads/main ] || [ -n "$EVALUATION_PR_NUMBER" ] || [ -n "$EVALUATION_VERSION" ]; then
            if [ -n "$EVALUATION_PR_NUMBER" ] || [ -n "$EVALUATION_VERSION" ]; then
              echo "::error title=PR EVALUATION not checked::Check PR EVALUATION to build the entered PR and version, or clear both fields to build current origin/dev."
            else
              echo "::error title=Main workflow required::Dispatch normal origin/dev testing from main."
            fi
            exit 1
          fi
          git fetch --force origin \
            main:refs/remotes/origin/main \
            dev:refs/remotes/origin/dev
          MAIN_SHA=$(git rev-parse origin/main)
          EVALUATION_PR=""
          SOURCE_MODE="dev"
          SOURCE_REF="origin/dev"
          SOURCE_SHA=$(git rev-parse origin/dev)
          if [ "$PR_EVALUATION" = true ]; then
            SOURCE_MODE="pr-evaluation"
            EVALUATION_PR="$EVALUATION_PR_NUMBER"
            SOURCE_REF="refs/pull/$EVALUATION_PR/head"
            # The selector belongs to the workflow definition, not the product PR.
            # Keep it available after checking out a product revision that predates it.
            SELECTOR="$RUNNER_TEMP/quick_portable_evaluation.py"
            cp .github/scripts/quick_portable_evaluation.py "$SELECTOR"
            SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$EVALUATION_PR" | \
              python3 "$SELECTOR" resolve-pr --repository "$GITHUB_REPOSITORY" --number "$EVALUATION_PR")
            git fetch --no-tags origin "$SOURCE_REF"
            if [ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_SHA" ]; then
              echo "::error title=PR HEAD changed::Dispatch again to select a stable PR HEAD."
              exit 1
            fi
            git fetch --force --tags origin
          fi
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          COMMITTED_SOURCE_VERSION=$(python3 .github/scripts/source_version.py current)
          SOURCE_VERSION="$COMMITTED_SOURCE_VERSION"
          if [ "$PR_EVALUATION" = true ]; then
            python3 "$SELECTOR" validate-version --committed "$COMMITTED_SOURCE_VERSION" --version "$EVALUATION_VERSION"
            SOURCE_VERSION="$EVALUATION_VERSION"
          fi
          echo "committed_source_version=$COMMITTED_SOURCE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_mode=$SOURCE_MODE" >> "$GITHUB_OUTPUT"
          echo "evaluation_pr=$EVALUATION_PR" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "source_version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"
          echo "report_only=$REPORT_ONLY" >> "$GITHUB_OUTPUT"
          echo "target_windows=$TARGET_WINDOWS" >> "$GITHUB_OUTPUT"
          echo "target_webgui=$TARGET_WEBGUI" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$STARTED_EPOCH" >> "$GITHUB_OUTPUT"
          # Target-specific outcome wording only; the validated job selectors are unchanged.
          case "$TARGET_WINDOWS:$TARGET_WEBGUI" in
            true:true) TARGET_LABEL="WINDOWS + WEBGUI" ;;
            true:false) TARGET_LABEL="WINDOWS" ;;
            false:true) TARGET_LABEL="WEBGUI" ;;
          esac
          if [ "$REPORT_ONLY" = true ]; then
            OUTCOME="$TARGET_LABEL — REPORT ONLY (NO BUILD)"
          else
            OUTCOME="$TARGET_LABEL TEST BUILD"
          fi
          {
            echo "## Workflow 20 source plan"
            echo
            echo "- Selected source: $SOURCE_REF at $SOURCE_SHA"
            echo "- Source mode: $SOURCE_MODE"
            echo "- Selected targets: $TARGET_LABEL"
            echo "- Windows target: $TARGET_WINDOWS"
            echo "- WebGUI target: $TARGET_WEBGUI"
            echo "- Workflow definition: $GITHUB_REF at $GITHUB_SHA"
            echo "- Evaluation PR: ${EVALUATION_PR:-not applicable}"
            echo "- Committed product version (before runner stamp): $COMMITTED_SOURCE_VERSION"
            echo "- Current main baseline: \`$MAIN_SHA\`"
            echo "- Expected test build version: $SOURCE_VERSION"
            echo "- Outcome: $OUTCOME"
            if [ "$FORCE_REBUILD" = true ]; then
              echo "- Reuse policy: fresh test build; compatible compiler caches only"
            else
              echo "- Reuse policy: exact retained artifacts and verified committed-source evidence only"
            fi
            echo "- Release eligibility: false (evaluation only)"
            echo "- MSIX, Store, committed version advancement, notes, tags and publication: \`excluded\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cache-report:
    name: Audit Windows cache availability
    needs: resolve-source
    if: ${{ needs.resolve-source.outputs.target_windows == 'true' && needs.resolve-source.outputs.report_only == 'true' }}
    runs-on: windows-latest
    outputs:
      dependency_hit: ${{ steps.dependencies.outputs.cache-hit }}
      compiled_hit: ${{ steps.compiled.outputs.cache-hit }}
      dependency_hash: ${{ steps.cache-key.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Calculate compatible Windows cache identity
        id: cache-key
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content -Raw -LiteralPath build/Windows/Cargo.lock
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "splined-windows"\r?\n)version = "[^"]+"'
          $normalized = [regex]::Replace($lock, $pattern, '${1}version = "<release>"')
          if ($normalized -eq $lock) { throw "Unable to normalize the Windows package version." }
          $bytes = [Text.Encoding]::UTF8.GetBytes($normalized)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "hash=$hash" | Add-Content $env:GITHUB_OUTPUT

      - name: Look up Cargo dependency cache
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-${{ steps.cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-
          lookup-only: true

      - name: Look up compatible optimized intermediates
        id: compiled
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/Windows/target/x86_64-pc-windows-msvc/release/deps
            build/Windows/target/x86_64-pc-windows-msvc/release/build
            build/Windows/target/x86_64-pc-windows-msvc/release/.fingerprint
            build/Windows/target/x86_64-pc-windows-msvc/release/incremental
            build/Windows/target/release/deps
            build/Windows/target/release/build
            build/Windows/target/release/.fingerprint
            build/Windows/target/release/incremental
          key: ${{ runner.os }}-splined-wf20-incremental-compiled-v3-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.cache-key.outputs.hash }}-${{ needs.resolve-source.outputs.source_sha }}-${{ needs.resolve-source.outputs.source_version }}
          restore-keys: |
            ${{ runner.os }}-splined-wf20-incremental-compiled-v3-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.cache-key.outputs.hash }}-
            ${{ runner.os }}-splined-optimized-compiled-v2-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.cache-key.outputs.hash }}-
          lookup-only: true

      - name: Report measured or lookup-only cache results
        shell: pwsh
        run: |
          @"
          ## Workflow 20 cache audit

          - Cargo dependency cache exact hit: ``${{ steps.dependencies.outputs.cache-hit }}``
          - Compatible optimized-intermediate exact hit: ``${{ steps.compiled.outputs.cache-hit }}``
          - Cache identity: ``${{ steps.cache-key.outputs.hash }}``
          - Result type: ``lookup only; no cache payload restored by this audit job``
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  build:
    name: Compile and validate standalone splined.exe
    needs: resolve-source
    if: ${{ needs.resolve-source.outputs.report_only != 'true' && needs.resolve-source.outputs.target_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Retain reuse verifier from workflow definition
        shell: pwsh
        run: Copy-Item .github/scripts/workflow20_reuse.py "$env:RUNNER_TEMP/workflow20_reuse.py"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Stamp isolated PR evaluation source
        if: ${{ needs.resolve-source.outputs.source_mode == 'pr-evaluation' }}
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          EVALUATION_VERSION: ${{ needs.resolve-source.outputs.source_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -ne $env:SOURCE_COMMIT) { throw "Evaluation checkout mismatch." }
          python .github/scripts/source_version.py stamp-release $env:EVALUATION_VERSION
          if ((python .github/scripts/source_version.py current) -ne $env:EVALUATION_VERSION) { throw "Evaluation version mismatch." }
          $allowed = @(
            "build/Windows/Cargo.toml",
            "build/Windows/Cargo.lock",
            "build/Windows/gui/app.manifest",
            "build/Windows/package/Package.appxmanifest",
            "build/Windows/package/SPLINED.appinstaller.template",
            "build/WEBGui/webgui/backend/splined.py"
          )
          $changed = @(git diff --name-only)
          if ($changed.Count -ne $allowed.Count -or @($changed | Where-Object { $_ -notin $allowed }).Count -ne 0) {
            throw "Evaluation stamp changed unexpected source files."
          }

      - name: Find and verify reusable Windows evaluation artifact
        id: reuse
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.resolve-source.outputs.source_version }}
          SOURCE_MODE: ${{ needs.resolve-source.outputs.source_mode }}
          EVALUATION_PR: ${{ needs.resolve-source.outputs.evaluation_pr }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: python "$env:RUNNER_TEMP/workflow20_reuse.py" artifact --kind windows --root quick-portable

      - name: Calculate compatible Windows cache identity
        id: cache-key
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content -Raw -LiteralPath build/Windows/Cargo.lock
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "splined-windows"\r?\n)version = "[^"]+"'
          $normalized = [regex]::Replace($lock, $pattern, '${1}version = "<release>"')
          if ($normalized -eq $lock) { throw "Unable to normalize the Windows package version." }
          $bytes = [Text.Encoding]::UTF8.GetBytes($normalized)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "hash=$hash" | Add-Content $env:GITHUB_OUTPUT

      - name: Install stable Rust
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$WINDOWS_TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Restore Cargo dependency payload
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        id: dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-${{ steps.cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-

      - name: Restore optimized intermediates
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        id: compiled
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/Windows/target/x86_64-pc-windows-msvc/release/deps
            build/Windows/target/x86_64-pc-windows-msvc/release/build
            build/Windows/target/x86_64-pc-windows-msvc/release/.fingerprint
            build/Windows/target/x86_64-pc-windows-msvc/release/incremental
            build/Windows/target/release/deps
            build/Windows/target/release/build
            build/Windows/target/release/.fingerprint
            build/Windows/target/release/incremental
          key: ${{ runner.os }}-splined-wf20-incremental-compiled-v3-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.cache-key.outputs.hash }}-${{ needs.resolve-source.outputs.source_sha }}-${{ needs.resolve-source.outputs.source_version }}
          restore-keys: |
            ${{ runner.os }}-splined-wf20-incremental-compiled-v3-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.cache-key.outputs.hash }}-
            ${{ runner.os }}-splined-optimized-compiled-v2-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.cache-key.outputs.hash }}-

      - name: Build optimized quick portable executable
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        id: compile
        shell: pwsh
        env:
          SPLINED_BUILD_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $started = Get-Date
          cargo build --locked --release --manifest-path build/Windows/Cargo.toml --target $env:WINDOWS_TARGET
          "elapsed_seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Verify identity, architecture, native smoke and checksum
        id: validate
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.resolve-source.outputs.source_version }}
          REUSED_RUN_ID: ${{ steps.reuse.outputs.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $started = Get-Date
          $source = "build/Windows/target/$env:WINDOWS_TARGET/release/splined.exe"
          New-Item -ItemType Directory -Force -Path quick-portable | Out-Null
          if (-not $env:REUSED_RUN_ID) {
            Copy-Item -LiteralPath $source -Destination quick-portable/splined.exe
          }
          if (-not (Test-Path -LiteralPath quick-portable/splined.exe -PathType Leaf)) { throw "Evaluation executable is missing." }

          $bytes = [IO.File]::ReadAllBytes((Resolve-Path quick-portable/splined.exe).Path)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw "Invalid PE signature." }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw "Expected AMD64 PE architecture." }

          $identityPath = Join-Path $env:RUNNER_TEMP "splined-build-info.json"
          $identity = Start-Process -FilePath (Resolve-Path quick-portable/splined.exe) -ArgumentList @("--write-build-info", $identityPath) -Wait -PassThru
          if ($identity.ExitCode -ne 0) { throw "Executable identity query failed." }
          $buildInfo = Get-Content -Raw -LiteralPath $identityPath | ConvertFrom-Json
          if ($buildInfo.version -ne $env:SOURCE_VERSION) { throw "Executable version mismatch." }
          if ($buildInfo.commit -ne $env:SOURCE_COMMIT) { throw "Executable commit mismatch." }
          if ($buildInfo.architecture -ne "rust-slint") { throw "Executable architecture identity mismatch." }

          $stateRoot = Join-Path $env:RUNNER_TEMP "splined-quick-portable-state"
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $priorStateRoot = $env:SPLINED_INTERNAL_STATE_ROOT
          $env:SPLINED_INTERNAL_STATE_ROOT = $stateRoot
          try {
            $smoke = Start-Process -FilePath (Resolve-Path quick-portable/splined.exe) -ArgumentList "--native-smoke" -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          } finally {
            $env:SPLINED_INTERNAL_STATE_ROOT = $priorStateRoot
          }
          if ($smoke.ExitCode -ne 0) { throw "Native smoke validation failed." }

          $file = Get-Item -LiteralPath quick-portable/splined.exe
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = "splined-quick-portable-v1"
            source_commit = $env:SOURCE_COMMIT
            main_commit = "${{ needs.resolve-source.outputs.main_sha }}"
            source_version = $env:SOURCE_VERSION
            committed_source_version = "${{ needs.resolve-source.outputs.committed_source_version }}"
            source_mode = "${{ needs.resolve-source.outputs.source_mode }}"
            evaluation_pr = "${{ needs.resolve-source.outputs.evaluation_pr }}"
            workflow_definition_commit = $env:GITHUB_SHA
            architecture = "x86_64-pc-windows-msvc"
            rust_toolchain = $env:RUST_TOOLCHAIN
            build_profile = "release-optimized-incremental-v1"
            reused_from_run_id = $(if ($env:REUSED_RUN_ID) { [long]$env:REUSED_RUN_ID } else { $null })
            sha256 = $sha
            size_bytes = $file.Length
            workflow_run_id = [long]$env:GITHUB_RUN_ID
            release_eligible = $false
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 quick-portable/quick-portable-manifest.json
          "$sha  splined.exe" | Set-Content -Encoding ascii quick-portable/SHA256SUMS.txt
          "sha256=$sha" | Add-Content $env:GITHUB_OUTPUT
          "size_bytes=$($file.Length)" | Add-Content $env:GITHUB_OUTPUT
          "elapsed_seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Upload quick portable artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-quick-portable-windows
          path: quick-portable/
          if-no-files-found: error
          retention-days: 14

      - name: Report measured build results
        shell: pwsh
        run: |
          @"
          ## Workflow 20 quick portable complete

          - Source commit/version: ``${{ needs.resolve-source.outputs.source_sha }}`` / ``${{ needs.resolve-source.outputs.source_version }}``
          - Cargo dependency cache hit: ``${{ steps.dependencies.outputs.cache-hit }}``
          - Compiled-intermediate exact hit: ``${{ steps.compiled.outputs.cache-hit }}``
          - Artifact reused from run: ${{ steps.reuse.outputs.run_id || 'not reused' }}
          - Compilation duration (seconds): ${{ steps.compile.outputs.elapsed_seconds || '0 (retained exact executable)' }}
          - Validation duration: ``${{ steps.validate.outputs.elapsed_seconds }} seconds``
          - Executable size: ``${{ steps.validate.outputs.size_bytes }} bytes``
          - SHA-256: ``${{ steps.validate.outputs.sha256 }}``
          - Artifact ID: ``${{ steps.upload.outputs.artifact-id }}``
          - Native smoke: ``passed``
          - Release eligibility: ``false``
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  build-webgui:
    name: Validate and package WebGUI pre-release source
    needs: resolve-source
    if: ${{ needs.resolve-source.outputs.report_only != 'true' && needs.resolve-source.outputs.target_webgui == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splined_test
          POSTGRES_PASSWORD: splined_ci_only
          POSTGRES_DB: splined_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splined_test -d splined_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPLINED_TEST_DATABASE_URL: postgresql://splined_test:splined_ci_only@127.0.0.1:5432/splined_test
      PYTHONPATH: .:build/WEBGui:build/WEBGui/webgui/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Retain evaluation packager from workflow definition
        shell: bash
        run: |
          cp .github/scripts/webgui_evaluation_artifact.py "$RUNNER_TEMP/webgui_evaluation_artifact.py"
          cp .github/scripts/workflow20_reuse.py "$RUNNER_TEMP/workflow20_reuse.py"
          cp .github/scripts/source_version.py "$RUNNER_TEMP/source_version.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify exact source and apply isolated evaluation stamp
        id: evaluation-source
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          SOURCE_MODE: ${{ needs.resolve-source.outputs.source_mode }}
          SOURCE_VERSION: ${{ needs.resolve-source.outputs.source_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          if [ "$SOURCE_MODE" = pr-evaluation ]; then
            python3 .github/scripts/source_version.py stamp-release "$SOURCE_VERSION"
            allowed=(
              build/Windows/Cargo.toml
              build/Windows/Cargo.lock
              build/Windows/gui/app.manifest
              build/Windows/package/Package.appxmanifest
              build/Windows/package/SPLINED.appinstaller.template
              build/WEBGui/webgui/backend/splined.py
            )
            diff -u <(printf '%s\n' "${allowed[@]}" | sort) <(git diff --name-only | sort)
            git add -- "${allowed[@]}"
            git -c user.name="SPLINED evaluation" -c user.email="evaluation@users.noreply.github.com" commit -m "Temporary evaluation version $SOURCE_VERSION"
            test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          fi
          test "$(python3 .github/scripts/source_version.py current)" = "$SOURCE_VERSION"
          echo "candidate_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find and verify reusable WebGUI evaluation artifact
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.resolve-source.outputs.source_version }}
          SOURCE_MODE: ${{ needs.resolve-source.outputs.source_mode }}
          EVALUATION_PR: ${{ needs.resolve-source.outputs.evaluation_pr }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: python3 "$RUNNER_TEMP/workflow20_reuse.py" artifact --kind webgui --root webgui-evaluation
      - name: Resolve exact committed-source WebGUI validation evidence
        id: prior-validation
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.resolve-source.outputs.source_version }}
          SOURCE_MODE: ${{ needs.resolve-source.outputs.source_mode }}
          EVALUATION_PR: ${{ needs.resolve-source.outputs.evaluation_pr }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          CANDIDATE_COMMIT: ${{ steps.evaluation-source.outputs.candidate_commit }}
        run: python3 "$RUNNER_TEMP/workflow20_reuse.py" validation
      - name: Set up Python 3.12
        if: ${{ steps.reuse.outputs.reused != 'true' && steps.prior-validation.outputs.reused != 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node.js 22
        if: ${{ steps.reuse.outputs.reused != 'true' && steps.prior-validation.outputs.reused != 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install WebGUI test dependencies
        if: ${{ steps.reuse.outputs.reused != 'true' && steps.prior-validation.outputs.reused != 'true' }}
        run: pip install -r build/WEBGui/webgui/requirements-test.txt
      - name: Validate Python, PostgreSQL and browser JavaScript
        if: ${{ steps.reuse.outputs.reused != 'true' && steps.prior-validation.outputs.reused != 'true' }}
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          for test_path in build/WEBGui/webgui/tests/test_*.py; do
            test_name="$(basename "$test_path")"
            case "$test_name" in
              test_splined_compilation_authority_policy.py|test_audio_integrity.py|test_comp_job_scope.py|test_cross_format_cover_overwrite.py)
                continue
                ;;
            esac
            python -m unittest "$test_path" -v
          done
          node --check build/WEBGui/webgui/static/app.js
          node --check build/WEBGui/webgui/static/operations.js
          echo "seconds=$(($(date +%s) - started))" >> "$GITHUB_OUTPUT"
      - name: Expose GitHub Actions cache runtime for Buildx
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const cacheUrl = process.env.ACTIONS_CACHE_URL;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (!token || (!cacheUrl && !resultsUrl)) {
              core.setFailed("GitHub Actions cache runtime variables are unavailable.");
              return;
            }
            core.setSecret(token);
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", token);
            if (cacheUrl) core.exportVariable("ACTIONS_CACHE_URL", cacheUrl);
            if (resultsUrl) core.exportVariable("ACTIONS_RESULTS_URL", resultsUrl);
      - name: Build and smoke-test exact WebGUI image
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        id: container
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-source.outputs.source_version }}
          RELEASE_COMMIT: ${{ steps.evaluation-source.outputs.candidate_commit }}
          CACHE_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          builder="splined-workflow20-${GITHUB_RUN_ID}"
          docker buildx create --driver docker-container --name "$builder" --use
          cache_args=(--cache-to type=gha,mode=max,scope=splined-workflow20-webgui-${CACHE_SOURCE_SHA}
                      --cache-from type=gha,scope=splined-workflow20-webgui-${CACHE_SOURCE_SHA}
                      --cache-from type=gha,scope=splined-workflow20-webgui
                      --cache-from type=gha,scope=splined-official-release-webgui)
          set +e
          docker buildx build --progress=plain "${cache_args[@]}" --load \
            --build-arg SPLINED_BUILD_CHANNEL=dev \
            --label "org.opencontainers.image.source=https://github.com/scottia/S-P-L-I-N-E-D" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --file build/WEBGui/Dockerfile --tag splined-webgui:evaluation-test . 2>&1 | tee /tmp/splined-buildkit.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          cached_steps=$(grep -c ' CACHED$' /tmp/splined-buildkit.log || true)
          docker run -d --name splined-webgui-evaluation-test --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=splined_test -e PGPASSWORD=splined_ci_only \
            -e PGDATABASE=splined_test -e SPLINED_WEB_TOKEN=ci-browser-only \
            splined-webgui:evaluation-test
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/status > /tmp/splined-status.json; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs splined-webgui-evaluation-test; exit 1; fi
          python - <<'PY'
          import json
          status = json.load(open('/tmp/splined-status.json', encoding='utf-8'))
          assert status['database'] == 'PostgreSQL'
          assert status['database_ready'] is True
          assert status['auth_required'] is True
          PY
          docker exec splined-webgui-evaluation-test grep -Fxq -- "VERSION = \"$RELEASE_VERSION\"" /app/webgui/backend/splined.py
          mkdir -p webgui-evaluation/release-assets
          docker save splined-webgui:evaluation-test | gzip -9 > webgui-evaluation/release-assets/splined-webgui-container-image.tar.gz
          image_id=$(docker image inspect -f '{{.Id}}' splined-webgui:evaluation-test)
          image_size=$(docker image inspect -f '{{.Size}}' splined-webgui:evaluation-test)
          archive_size=$(stat -c %s webgui-evaluation/release-assets/splined-webgui-container-image.tar.gz)
          {
            echo "seconds=$(($(date +%s) - started))"
            echo "cached_steps=$cached_steps"
            echo "image_id=$image_id"
            echo "image_size=$image_size"
            echo "archive_size=$archive_size"
          } >> "$GITHUB_OUTPUT"
      - name: Report container logs
        if: ${{ always() && steps.reuse.outputs.reused != 'true' }}
        run: docker logs splined-webgui-evaluation-test || true
      - name: Package Python / WebGUI evaluation source
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        id: package
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          mkdir -p webgui-evaluation/release-package/build webgui-evaluation/release-assets
          cp -R build/WEBGui webgui-evaluation/release-package/build/
          cp -R schema docs webgui-evaluation/release-package/
          cp .dockerignore webgui-evaluation/release-package/
          cp README.md LICENSE PRIVACY.md SECURITY.md SUPPORT.md webgui-evaluation/release-package/
          tar -czf webgui-evaluation/release-assets/splined-webgui-python.tar.gz -C webgui-evaluation/release-package .
          echo "seconds=$(($(date +%s) - started))" >> "$GITHUB_OUTPUT"
          echo "source_size=$(stat -c %s webgui-evaluation/release-assets/splined-webgui-python.tar.gz)" >> "$GITHUB_OUTPUT"
          rm -rf webgui-evaluation/release-package
      - name: Create non-publishable WebGUI evaluation provenance
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          CANDIDATE_COMMIT: ${{ steps.evaluation-source.outputs.candidate_commit }}
          SOURCE_VERSION: ${{ needs.resolve-source.outputs.source_version }}
          SOURCE_MODE: ${{ needs.resolve-source.outputs.source_mode }}
          EVALUATION_PR: ${{ needs.resolve-source.outputs.evaluation_pr }}
          SOURCE_VALIDATION_RUN_ID: ${{ steps.prior-validation.outputs.run_id }}
          SOURCE_VALIDATION_RUN_ATTEMPT: ${{ steps.prior-validation.outputs.run_attempt }}
          SOURCE_VALIDATION_BASE_SHA: ${{ steps.prior-validation.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/webgui_evaluation_artifact.py" --root webgui-evaluation
      - name: Upload compatible WebGUI evaluation artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-webgui-release
          path: webgui-evaluation/
          if-no-files-found: error
          retention-days: 14
      - name: Report measured WebGUI evaluation results
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.resolve-source.outputs.source_version }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          TEST_SECONDS: ${{ steps.tests.outputs.seconds }}
          REUSED_ARTIFACT_RUN: ${{ steps.reuse.outputs.run_id }}
          REUSED_VALIDATION_RUN: ${{ steps.prior-validation.outputs.run_id }}
          CONTAINER_SECONDS: ${{ steps.container.outputs.seconds }}
        run: |
          {
            echo "## Workflow 20 WebGUI pre-release build"
            echo "- Source commit/version: $SOURCE_COMMIT / $SOURCE_VERSION"
            if [ -n "$REUSED_ARTIFACT_RUN" ]; then
              echo "- Exact package and original smoke evidence reused from run: $REUSED_ARTIFACT_RUN"
              echo "- No repeated WebGUI test or Docker build."
            else
              if [ -n "$REUSED_VALIDATION_RUN" ]; then
                echo "- Committed-source Python/PostgreSQL/Node validation reused from run: $REUSED_VALIDATION_RUN"
                echo "- Runner-only version stamp verified separately."
              else
                echo "- Python/PostgreSQL/Node validation: $TEST_SECONDS seconds"
              fi
              echo "- Docker build and health smoke: $CONTAINER_SECONDS seconds"
            fi
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- Release eligibility: false"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Pre-release testing summary
    needs: [resolve-source, cache-report, build, build-webgui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report stage results and enforce selected outcome
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.resolve-source.result }}
          CACHE_RESULT: ${{ needs.cache-report.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WEBGUI_RESULT: ${{ needs.build-webgui.result }}
          REPORT_ONLY: ${{ needs.resolve-source.outputs.report_only }}
          WINDOWS: ${{ needs.resolve-source.outputs.target_windows }}
          WEBGUI: ${{ needs.resolve-source.outputs.target_webgui }}
          STARTED_EPOCH: ${{ needs.resolve-source.outputs.started_epoch }}
        run: |
          set -euo pipefail
          {
            echo "## Workflow 20 stage results"
            echo "- Source resolution: $SOURCE_RESULT"
            echo "- Windows cache audit: $CACHE_RESULT (separate lookup-only runner is report-only)"
            echo "- Windows build: $BUILD_RESULT"
            echo "- WebGUI build: $WEBGUI_RESULT"
            echo "- Release eligibility: false"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$SOURCE_RESULT" = success
          if [ "$WINDOWS" = true ] && [ "$REPORT_ONLY" = true ]; then
            test "$CACHE_RESULT" = success
          else
            test "$CACHE_RESULT" = skipped
          fi
          if [ "$WINDOWS" = true ] && [ "$REPORT_ONLY" != true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi
          if [ "$WEBGUI" = true ] && [ "$REPORT_ONLY" != true ]; then
            test "$WEBGUI_RESULT" = success
          else
            test "$WEBGUI_RESULT" = skipped
          fi
          {
            echo "## Workflow 20 complete"
            if [ "$REPORT_ONLY" = true ]; then
              echo "Report-only audit complete; no compilation or packaging ran."
            else
              if [ "$WINDOWS" = true ]; then echo "Windows test build: validated and retained as splined-quick-portable-windows."; fi
            if [ "$WEBGUI" = true ]; then echo "WebGUI test build: validated and retained as splined-webgui-release."; fi
            fi
            echo "- Total elapsed time: $(($(date +%s) - STARTED_EPOCH)) seconds"
            echo "MSIX, Store, committed version advancement, notes, tags and publication were not performed."
          } >> "$GITHUB_STEP_SUMMARY"
