name: SPLINED Existing Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing numeric release tag to build/publish (example: 1.0.70)"
        required: true
        default: "1.0.70"
        type: string

permissions:
  contents: read

concurrency:
  group: splined-existing-windows-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  WINDOWS_TARGET: "x86_64-pc-windows-msvc"
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build-windows:
    name: Build Existing Windows Tag
    runs-on: windows-latest

    steps:
      - name: Validate version input
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be numeric SemVer, for example 1.0.70."
          }

      - name: Checkout existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      - name: Validate tag and release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          git fetch --force --tags origin
          $commit = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "refs/tags/$env:RELEASE_VERSION^{commit}").Trim()
          if ($commit -ne $tagCommit) {
            throw "Checked-out commit does not match tag $env:RELEASE_VERSION."
          }

          $rootCargo = Get-Content -Raw -LiteralPath Cargo.toml
          $windowsCargo = Get-Content -Raw -LiteralPath windows/Cargo.toml
          $rootMatch = [regex]::Match($rootCargo, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          $windowsMatch = [regex]::Match($windowsCargo, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $rootMatch.Success -or $rootMatch.Groups[1].Value -ne $env:RELEASE_VERSION) {
            throw "Root Cargo.toml version does not match tag $env:RELEASE_VERSION."
          }
          if (-not $windowsMatch.Success -or $windowsMatch.Groups[1].Value -ne $env:RELEASE_VERSION) {
            throw "windows/Cargo.toml version does not match tag $env:RELEASE_VERSION."
          }

          $manifest = [xml](Get-Content -Raw -LiteralPath windows/package/Package.appxmanifest)
          if ($manifest.Package.Identity.Version -ne "$env:RELEASE_VERSION.0") {
            throw "Package.appxmanifest version does not match $env:RELEASE_VERSION.0."
          }

          "RELEASE_COMMIT=$commit" | Add-Content $env:GITHUB_ENV
          Write-Host "Existing tag validated: $env:RELEASE_VERSION @ $commit"

      - name: Repair legacy Store minimum OS version if release provisioning corrupted it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = "windows/package/Package.appxmanifest"
          $manifest = [xml](Get-Content -Raw -LiteralPath $manifestPath)
          $family = $manifest.Package.Dependencies.TargetDeviceFamily
          $expectedMinVersion = "10.0.17763.0"
          $legacyCorruption = "$env:RELEASE_VERSION.0"

          if ($family.Name -ne "Windows.Desktop") {
            throw "Existing release tag does not target Windows.Desktop."
          }

          if ($family.MinVersion -eq $legacyCorruption) {
            Write-Host "Repairing release-tag MinVersion $legacyCorruption -> $expectedMinVersion for Store packaging only."
            $family.SetAttribute("MinVersion", $expectedMinVersion)
            $settings = New-Object Xml.XmlWriterSettings
            $settings.Indent = $true
            $settings.Encoding = New-Object Text.UTF8Encoding($false)
            $writer = [Xml.XmlWriter]::Create((Resolve-Path -LiteralPath $manifestPath).Path, $settings)
            try { $manifest.Save($writer) } finally { $writer.Dispose() }
          }
          elseif ($family.MinVersion -ne $expectedMinVersion) {
            throw "Unexpected Windows.Desktop MinVersion '$($family.MinVersion)'; refusing to silently rewrite it."
          }

          $verify = [xml](Get-Content -Raw -LiteralPath $manifestPath)
          if ($verify.Package.Dependencies.TargetDeviceFamily.MinVersion -ne $expectedMinVersion) {
            throw "Store MinVersion repair did not persist."
          }

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$WINDOWS_TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Calculate Windows dependency cache key
        id: windows-dependency-cache-key
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content -Raw -LiteralPath windows/Cargo.lock
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "splined-windows"\r?\n)version = "[^"]+"'
          $normalized = [regex]::Replace($lock, $pattern, '${1}version = "<release>"')
          if ($normalized -eq $lock) {
            throw "Unable to normalize the Windows package version for the dependency cache key."
          }
          $bytes = [Text.Encoding]::UTF8.GetBytes($normalized)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "hash=$hash" | Add-Content $env:GITHUB_OUTPUT

      - name: Restore Cargo dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-${{ steps.windows-dependency-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-

      - name: Install pinned WinAppCli
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $installRoot = Join-Path $env:RUNNER_TEMP "splined-winappcli"
          npm install --prefix $installRoot --no-save --no-audit --no-fund "@microsoft/winappcli@0.7.1"
          $commandDirectory = Join-Path $installRoot "node_modules\.bin"
          $commandDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $reportedVersion = (& (Join-Path $commandDirectory "winapp.cmd") --version) -join "`n"
          if ($reportedVersion -notmatch '0\.7\.1') {
            throw "The pinned WinAppCli installation did not report version 0.7.1."
          }

      - name: Build clean x64 WinForms and Rust DLL pair
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "windows/target/$env:WINDOWS_TARGET/release"
          if (Test-Path -LiteralPath $releaseRoot) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }
          $env:SPLINED_BUILD_GUI = "1"
          $env:SPLINED_BUILD_COMMIT = $env:RELEASE_COMMIT
          cargo build --locked --release --manifest-path windows/Cargo.toml --target $env:WINDOWS_TARGET

      - name: Stage and audit portable Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "windows/target/$env:WINDOWS_TARGET/release"
          $portableRoot = "release-package/SPLINED"
          New-Item -ItemType Directory -Force -Path "$portableRoot/runtime", release-assets | Out-Null
          Copy-Item "$releaseRoot/splined.exe" "$portableRoot/splined.exe"
          Copy-Item "$releaseRoot/splined_core.dll" "$portableRoot/runtime/splined-core.dll"
          Copy-Item release/README-WINDOWS.txt "$portableRoot/README-WINDOWS.txt"

          function Assert-Amd64Pe([string]$path) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path).Path)
            if ($bytes.Length -lt 64) { throw "PE image is truncated: $path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) { throw "PE header is invalid: $path" }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw "PE signature is invalid: $path" }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw ("Expected AMD64 PE Machine 0x8664 for {0}; found 0x{1:X4}." -f $path, $machine)
            }
          }

          Assert-Amd64Pe "$portableRoot/splined.exe"
          Assert-Amd64Pe "$portableRoot/runtime/splined-core.dll"

          $version = (Get-Item -LiteralPath "$portableRoot/splined.exe").VersionInfo.FileVersion
          if ($version -ne "$env:RELEASE_VERSION.0") {
            throw "The Windows executable version '$version' does not match $env:RELEASE_VERSION.0."
          }

          $assembly = [Reflection.Assembly]::LoadFile((Resolve-Path -LiteralPath "$portableRoot/splined.exe").Path)
          $buildInfo = $assembly.GetType("Splined.WindowsGui.BuildInfo", $true)
          $commitField = $buildInfo.GetField("Commit", [Reflection.BindingFlags] "Static,Public,NonPublic")
          if ($commitField.GetValue($null) -ne $env:RELEASE_COMMIT) {
            throw "The Windows executable commit does not match the existing release tag commit."
          }

          $files = @(Get-ChildItem -LiteralPath $portableRoot -Recurse -File | ForEach-Object {
            $_.FullName.Substring((Resolve-Path $portableRoot).Path.Length + 1).Replace('\', '/')
          } | Sort-Object)
          $expected = @("README-WINDOWS.txt", "runtime/splined-core.dll", "splined.exe")
          if (Compare-Object $files $expected) {
            throw "Portable package contents do not match the release allowlist."
          }
          if (Test-Path -LiteralPath "$portableRoot/data") {
            throw "A fresh portable package must not contain data/."
          }

          $smoke = Start-Process -FilePath (Resolve-Path "$portableRoot/splined.exe") -ArgumentList "--native-smoke" -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            throw "The portable WinForms-to-Rust DLL smoke test failed."
          }

          Compress-Archive -Path $portableRoot -DestinationPath "release-assets/splined-windows-x86_64.zip" -Force
          $archiveEntries = @(tar -tf release-assets/splined-windows-x86_64.zip | Where-Object { -not $_.EndsWith('/') } | Sort-Object)
          $expectedEntries = @("SPLINED/README-WINDOWS.txt", "SPLINED/runtime/splined-core.dll", "SPLINED/splined.exe")
          if (Compare-Object $archiveEntries $expectedEntries) {
            throw "Portable archive contents do not match the release allowlist."
          }

          $manifest = [ordered]@{
            schema = 2
            channel = "stable"
            version = $env:RELEASE_VERSION
            commit = $env:RELEASE_COMMIT
            short_commit = $env:RELEASE_COMMIT.Substring(0, 7)
            published_at = [DateTime]::UtcNow.ToString("o")
            release_url = "https://github.com/scottia/S-P-L-I-N-E-D/releases/tag/$env:RELEASE_VERSION"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 release-assets/windows-update.json

      - name: Build and validate production Store MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "windows/target/$env:WINDOWS_TARGET/release"
          $storePackage = "release-assets/SPLINED-x64-store-unsigned.msix"
          $result = & windows/package/Build-StorePackage.ps1 `
            -ExecutablePath "$releaseRoot/splined.exe" `
            -CoreDllPath "$releaseRoot/splined_core.dll" `
            -ManifestPath windows/package/Package.appxmanifest `
            -IconPath windows/gui/splined-app-icon.png `
            -LayoutRoot (Join-Path $env:RUNNER_TEMP "splined-msix-store-layout") `
            -UnpackedRoot (Join-Path $env:RUNNER_TEMP "splined-msix-store-unpacked") `
            -OutputPath $storePackage `
            -ExpectedVersion "$env:RELEASE_VERSION.0"
          $result | Format-List | Out-String | Write-Host

          $packedManifestPath = Join-Path $env:RUNNER_TEMP "splined-msix-store-unpacked/AppxManifest.xml"
          $packedManifest = [xml](Get-Content -Raw -LiteralPath $packedManifestPath)
          $packedFamily = $packedManifest.Package.Dependencies.TargetDeviceFamily
          if ($packedFamily.MinVersion -ne "10.0.17763.0") {
            throw "Packed Store MSIX has invalid Windows.Desktop MinVersion '$($packedFamily.MinVersion)'."
          }
          if ($packedFamily.MaxVersionTested -ne "10.0.26100.0") {
            throw "Packed Store MSIX MaxVersionTested changed unexpectedly to '$($packedFamily.MaxVersionTested)'."
          }

      - name: Development-sign, install, activate, and uninstall isolated QA package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "windows/target/$env:WINDOWS_TARGET/release"
          & windows/package/Test-DevelopmentPackage.ps1 `
            -ExecutablePath "$releaseRoot/splined.exe" `
            -CoreDllPath "$releaseRoot/splined_core.dll" `
            -ManifestPath windows/package/Package.appxmanifest `
            -IconPath windows/gui/splined-app-icon.png `
            -LayoutRoot (Join-Path $env:RUNNER_TEMP "splined-msix-development-layout")

      - name: Upload portable Windows recovery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-windows-existing-${{ inputs.version }}
          path: |
            release-assets/splined-windows-x86_64.zip
            release-assets/windows-update.json
          if-no-files-found: error

      - name: Upload Partner Center Store submission artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-windows-store-submission
          path: release-assets/SPLINED-x64-store-unsigned.msix
          if-no-files-found: error

      - name: Build summary
        shell: pwsh
        run: |
          @"
          ## Existing Windows release build complete

          - Existing tag: `$env:RELEASE_VERSION`
          - Commit: `$env:RELEASE_COMMIT`
          - Full GUI regression suite: `not run`
          - Portable artifact: `splined-windows-existing-$env:RELEASE_VERSION`
          - Partner Center artifact: `splined-windows-store-submission`
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  publish-release:
    name: Publish or Repair GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: splined-windows-existing-${{ inputs.version }}
          path: release-assets

      - name: Create checksums and publish existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd release-assets

          test -f splined-windows-x86_64.zip
          test -f windows-update.json
          sha256sum splined-windows-x86_64.zip windows-update.json > SHA256SUMS.txt

          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists; replacing Windows release assets."
            gh release upload "$RELEASE_VERSION"               splined-windows-x86_64.zip               windows-update.json               SHA256SUMS.txt               --clobber               --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating GitHub Release for existing tag $RELEASE_VERSION."
            gh release create "$RELEASE_VERSION"               splined-windows-x86_64.zip               windows-update.json               SHA256SUMS.txt               --repo "$GITHUB_REPOSITORY"               --verify-tag               --title "S:P:L:I:N:E:D $RELEASE_VERSION"               --generate-notes
          fi

      - name: Publication summary
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Existing Windows tag published"
            echo
            echo "- Version: `$RELEASE_VERSION`"
            echo "- GitHub Release: created or repaired"
            echo "- Store MSIX: retained only as the Actions artifact `splined-windows-store-submission`"
            echo "- GHCR: not modified; use the existing SPLINED Published > GHCR workflow if needed"
          } >> "$GITHUB_STEP_SUMMARY"
