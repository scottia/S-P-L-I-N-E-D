name: Windows Dev Update

on:
  push:
    branches:
      - dev
    paths-ignore:
      - ".github/workflows/windows-dev-update.yml"
      - "README.md"
      - "docs/**"
      - "windows/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: splined-windows-dev-update
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build and publish rolling Windows dev update
    runs-on: windows-latest

    steps:
      - name: Checkout dev commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: ${{ runner.os }}-splined-windows-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-

      - name: Build commit-aware Windows updater
        shell: bash
        env:
          SPLINED_BUILD_COMMIT: ${{ github.sha }}
          SPLINED_UPDATE_CHANNEL: dev
        run: cargo build --manifest-path windows/Cargo.toml --locked --release

      - name: Create verified update manifest
        shell: pwsh
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item windows/target/release/splined.exe release-assets/setup-splined.exe

          $asset = Get-Item release-assets/setup-splined.exe
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            channel = "dev"
            commit = $env:BUILD_COMMIT.ToLowerInvariant()
            short_commit = $env:BUILD_COMMIT.Substring(0, 7).ToLowerInvariant()
            published_at = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            asset_url = "https://github.com/scottia/S-P-L-I-N-E-D/releases/download/windows-dev/setup-splined.exe"
            sha256 = $digest
            size = $asset.Length
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8NoBOM release-assets/windows-dev-update.json
          "$digest  setup-splined.exe" | Set-Content -Encoding ascii release-assets/SHA256SUMS.txt

      - name: Publish rolling Windows dev update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view windows-dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit windows-dev \
              --repo "$GITHUB_REPOSITORY" \
              --title "S:P:L:I:N:E:D Windows Dev Update" \
              --notes "Rolling Windows development build from dev commit ${GITHUB_SHA}. The GUI verifies the published SHA-256 before installation." \
              --prerelease
          else
            gh release create windows-dev \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "S:P:L:I:N:E:D Windows Dev Update" \
              --notes "Rolling Windows development build from dev commit ${GITHUB_SHA}. The GUI verifies the published SHA-256 before installation." \
              --prerelease
          fi
          gh release upload windows-dev \
            release-assets/setup-splined.exe \
            release-assets/windows-dev-update.json \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Report update channel
        shell: pwsh
        run: |
          @"
          ## Windows dev update published

          - Commit: ``${{ github.sha }}``
          - Channel: ``dev``
          - Release tag: ``windows-dev``
          - Manifest and executable: SHA-256 verified by the GUI
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
