name: SPLINED > MS Store Publish & Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing numeric SPLINED release tag (example: 1.0.71)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: splined-windows-store-publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  publish-store-update:
    name: Publish existing validated Store package
    runs-on: windows-latest
    concurrency:
      group: splined-microsoft-store-submission
      cancel-in-progress: false

    steps:
      - name: Validate numeric existing-tag input
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "version must be an existing numeric release tag such as 1.0.71."
          }

      - name: Checkout exact existing release tag with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      - name: Checkout current authoritative Store release engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .splined-release-engine
          sparse-checkout: |
            cliff.toml
            release/Install-GitCliff.ps1
            release/Generate-StoreHighlights.ps1
            release/Resolve-StoreBaseline.ps1
            release/Test-StoreBaseline.ps1
            release/tests
            release/templates/store-highlights.tera
            windows/package/Publish-StoreUpdate.ps1
          sparse-checkout-cone-mode: false

      - name: Verify existing tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = (& gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_VERSION" | ConvertFrom-Json)
          if ($null -eq $tag -or [String]::IsNullOrWhiteSpace($tag.ref)) {
            throw "Existing tag $env:RELEASE_VERSION was not found."
          }
          $release = (& gh release view $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease | ConvertFrom-Json)
          if ($release.tagName -cne $env:RELEASE_VERSION -or $release.isDraft -or $release.isPrerelease) {
            throw "Version $env:RELEASE_VERSION must already have a published, non-prerelease GitHub Release."
          }

      - name: Require Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("AZURE_AD_APPLICATION_CLIENT_ID", "AZURE_AD_APPLICATION_SECRET", "AZURE_AD_TENANT_ID", "SELLER_ID")) {
            if ([String]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Microsoft Store publishing credential is unavailable: $name"
            }
          }

      - name: Install pinned Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3

      - name: Install and verify git-cliff 2.14.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .splined-release-engine/release/Install-GitCliff.ps1 -InstallDirectory (Join-Path $env:RUNNER_TEMP "git-cliff-2.14.2")
          if (((git-cliff --version) -join "`n").Trim() -cne "git-cliff 2.14.2") {
            throw "The release-note engine must be git-cliff 2.14.2."
          }

      - name: Authenticate Microsoft Store before artifact retrieval
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          try {
            & msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          }
          catch {
            throw "Microsoft Store authentication failed before any package work. Verify the Partner Center Seller ID, Entra tenant/client IDs, client secret VALUE, and that the Entra application is added in Partner Center with the Manager role. $($_.Exception.Message)"
          }

      - name: Test Store history baseline resolution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .splined-release-engine/release/Test-StoreBaseline.ps1 -RepositoryRoot .

      - name: Resolve last-published Store baseline before package staging
        id: store-baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .splined-release-engine/release/Resolve-StoreBaseline.ps1 `
            -TargetVersion $env:RELEASE_VERSION `
            -RepositoryRoot . `
            -ProductId 9P8G4GMBBVBS `
            -OutputDirectory store-notes

      - name: Locate and validate retained Store submission artifact
        id: artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $artifactName = "splined-windows-store-submission"
          $response = (& gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$artifactName&per_page=100" | ConvertFrom-Json)
          $candidates = @($response.artifacts | Where-Object { -not $_.expired } | Sort-Object { [DateTime]$_.created_at } -Descending)
          if ($candidates.Count -eq 0) {
            throw "No retained validated Store submission artifact exists. Run 'SPLINED (Tagged) > MS Store Package Resolution' for $env:RELEASE_VERSION first."
          }

          $selected = $null
          foreach ($artifact in $candidates) {
            $run = (& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($artifact.workflow_run.id)" | ConvertFrom-Json)
            if ($run.name -notin @("SPLINED (All OS) and GHCR", "SPLINED (Tagged) > MS Store Package Resolution", "SPLINED > MS Store Publish & Update")) {
              continue
            }

            $candidateRoot = Join-Path $env:RUNNER_TEMP "store-artifact-$($artifact.id)"
            if (Test-Path -LiteralPath $candidateRoot) {
              Remove-Item -LiteralPath $candidateRoot -Recurse -Force
            }
            [IO.Directory]::CreateDirectory($candidateRoot) | Out-Null
            & gh run download $artifact.workflow_run.id --repo $env:GITHUB_REPOSITORY --name $artifactName --dir $candidateRoot

            $allFiles = @(Get-ChildItem -LiteralPath $candidateRoot -Recurse -File)
            $packageFiles = @($allFiles | Where-Object { $_.Name -ceq "SPLINED-x64-store-unsigned.msix" })
            $legacyHighlightFiles = @($allFiles | Where-Object { $_.Name -ceq "STORE-HIGHLIGHTS.txt" })
            $auditFiles = @($allFiles | Where-Object { $_.Name -ceq "STORE-SUBMISSION.json" })
            $unexpectedFiles = @($allFiles | Where-Object { $_.Name -cnotin @("SPLINED-x64-store-unsigned.msix", "STORE-HIGHLIGHTS.txt", "STORE-SUBMISSION.json") })
            if ($packageFiles.Count -ne 1 -or
                $legacyHighlightFiles.Count -ne 1 -or
                $auditFiles.Count -gt 1 -or
                $allFiles.Count -notin @(2, 3) -or
                $unexpectedFiles.Count -ne 0) {
              continue
            }

            $inspectRoot = Join-Path $env:RUNNER_TEMP "store-msix-$($artifact.id)"
            if (Test-Path -LiteralPath $inspectRoot) {
              Remove-Item -LiteralPath $inspectRoot -Recurse -Force
            }
            [IO.Directory]::CreateDirectory($inspectRoot) | Out-Null
            $zipPath = Join-Path $inspectRoot "package.zip"
            Copy-Item -LiteralPath $packageFiles[0].FullName -Destination $zipPath
            Expand-Archive -LiteralPath $zipPath -DestinationPath (Join-Path $inspectRoot "unpacked") -Force
            $manifestPath = Join-Path $inspectRoot "unpacked/AppxManifest.xml"
            if (-not (Test-Path -LiteralPath $manifestPath)) {
              continue
            }

            $manifest = [xml](Get-Content -Raw -LiteralPath $manifestPath)
            $identity = $manifest.Package.Identity
            if ($identity.Name -cne "Psycotix.SPLINED" -or $identity.Publisher -cne "CN=FE370EF6-D95D-4A6F-9AAB-2654E6DE00FE" -or $identity.ProcessorArchitecture -cne "x64" -or $identity.Version -cne "$env:RELEASE_VERSION.0") {
              continue
            }

            [IO.Directory]::CreateDirectory("store-submission") | Out-Null
            Copy-Item -LiteralPath $packageFiles[0].FullName -Destination "store-submission/SPLINED-x64-store-unsigned.msix" -Force
            $selected = $artifact
            break
          }

          if ($null -eq $selected) {
            throw "No retained validated Store submission artifact matches version $env:RELEASE_VERSION. Run 'SPLINED (Tagged) > MS Store Package Resolution' first."
          }

          "artifact_id=$($selected.id)" | Add-Content $env:GITHUB_OUTPUT
          "source_run_id=$($selected.workflow_run.id)" | Add-Content $env:GITHUB_OUTPUT

      - name: Regenerate cumulative Store Highlights from live published baseline
        id: store-highlights
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .splined-release-engine/release/Generate-StoreHighlights.ps1 `
            -Version $env:RELEASE_VERSION `
            -BaselineMetadataPath store-notes/STORE-BASELINE.json `
            -RepositoryRoot . `
            -ConfigPath .splined-release-engine/cliff.toml `
            -StoreTemplatePath .splined-release-engine/release/templates/store-highlights.tera `
            -OutputDirectory store-submission

      - name: Upload refreshed Store submission audit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-windows-store-submission
          path: |
            store-submission/SPLINED-x64-store-unsigned.msix
            store-submission/STORE-HIGHLIGHTS.txt
            store-submission/STORE-SUBMISSION.json
          if-no-files-found: error

      - name: Publish retained package and update Store Highlights
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          & .splined-release-engine/windows/package/Publish-StoreUpdate.ps1 `
            -PackagePath store-submission/SPLINED-x64-store-unsigned.msix `
            -HighlightsPath store-submission/STORE-HIGHLIGHTS.txt `
            -BaselineMetadataPath store-submission/STORE-SUBMISSION.json `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ProductId 9P8G4GMBBVBS `
            -SkipReconfigure

      - name: Report publication source
        shell: pwsh
        run: |
          @"
          ## SPLINED Microsoft Store publish/update

          Existing version: $env:RELEASE_VERSION
          Rebuild performed: no
          Source package artifact: splined-windows-store-submission
          Source workflow run: ${{ steps.artifact.outputs.source_run_id }}
          Source artifact ID: ${{ steps.artifact.outputs.artifact_id }}
          Store Highlights range: ${{ steps.store-baseline.outputs.range }}
          Store Highlights regenerated from live Store history: yes
          Microsoft Store: package staged and en-US Store Highlights submitted
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
