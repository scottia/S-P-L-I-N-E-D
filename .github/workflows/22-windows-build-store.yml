name: 22. Windows Build & Microsoft Store

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Workflow 21 run ID containing the approved release candidate (required for build and report modes)."
        default: ""
        type: string
      windows_build_run_id:
        description: "Workflow 22 run ID containing the validated MSIX (required only for SUBMIT EXISTING MSIX)."
        default: ""
        type: string
      compile_partial:
        description: "PARTIAL UPDATE (default). Choose one compilation mode for build/report; ignored by submission-only mode."
        default: true
        type: boolean
      compile_full:
        description: "FULL SOURCE."
        default: false
        type: boolean
      completion_build:
        description: "BUILD ONLY (default). Choose one completion."
        default: true
        type: boolean
      completion_report_only:
        description: "BUILD ONLY, REPORT: audit without compilation or packaging."
        default: false
        type: boolean
      completion_submit_existing:
        description: "SUBMIT EXISTING MSIX: submit an exact validated package without recompilation."
        default: false
        type: boolean
      store_local_review:
        description: "MS STORE — LOCAL DRAFT REVIEW (default): required for standard builds."
        default: true
        type: boolean
      store_auto_submit:
        description: "MS STORE — AUTO MSIX SUBMISSION: required only for SUBMIT EXISTING MSIX."
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.completion_submit_existing && 'splined-microsoft-store-submission' || format('splined-windows-build-{0}', github.ref) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  WINDOWS_TARGET: "x86_64-pc-windows-msvc"

jobs:
  resolve-plan:
    name: Validate Windows workflow selections
    runs-on: ubuntu-latest
    outputs:
      completion: ${{ steps.plan.outputs.completion }}
      compile_mode: ${{ steps.plan.outputs.compile_mode }}
      clean: ${{ steps.plan.outputs.clean }}
      candidate_run_id: ${{ steps.plan.outputs.candidate_run_id }}
      windows_build_run_id: ${{ steps.plan.outputs.windows_build_run_id }}
      started_epoch: ${{ steps.plan.outputs.started_epoch }}
    steps:
      - name: Reject conflicting selections before artifact transfer
        id: plan
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          WINDOWS_BUILD_RUN_ID: ${{ inputs.windows_build_run_id }}
          PARTIAL: ${{ inputs.compile_partial }}
          FULL: ${{ inputs.compile_full }}
          BUILD: ${{ inputs.completion_build }}
          REPORT: ${{ inputs.completion_report_only }}
          SUBMIT: ${{ inputs.completion_submit_existing }}
          LOCAL_REVIEW: ${{ inputs.store_local_review }}
          AUTO_SUBMIT: ${{ inputs.store_auto_submit }}
        run: |
          set -euo pipefail
          STARTED_EPOCH=$(date +%s)
          selected=0
          completion=""
          for value in "$BUILD" "$REPORT" "$SUBMIT"; do
            if [ "$value" = true ]; then selected=$((selected + 1)); fi
          done
          if [ "$selected" -ne 1 ]; then
            echo "::error title=Select exactly one completion::COMPLETION has $selected checked options."
            exit 1
          fi
          if [ "$SUBMIT" = true ]; then
            completion="SUBMIT EXISTING MSIX"
            compile_mode="NOT APPLICABLE"
            clean=false
            if [ "$AUTO_SUBMIT" != true ] || [ "$LOCAL_REVIEW" = true ]; then
              echo "::error title=Select automatic submission::SUBMIT EXISTING MSIX requires AUTO MSIX SUBMISSION and LOCAL DRAFT REVIEW unchecked."
              exit 1
            fi
            if ! [[ "$WINDOWS_BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error title=Windows build run required::Enter the originating Workflow 22 run ID."
              exit 1
            fi
          else
            compile_count=0
            if [ "$PARTIAL" = true ]; then compile_count=$((compile_count + 1)); compile_mode="PARTIAL UPDATE"; clean=false; fi
            if [ "$FULL" = true ]; then compile_count=$((compile_count + 1)); compile_mode="FULL SOURCE"; clean=true; fi
            if [ "$compile_count" -ne 1 ]; then
              echo "::error title=Select exactly one compilation mode::Compilation has $compile_count checked options."
              exit 1
            fi
            if [ "$LOCAL_REVIEW" != true ] || [ "$AUTO_SUBMIT" = true ]; then
              echo "::error title=Standard builds use local review::Build and report modes require LOCAL DRAFT REVIEW and prohibit AUTO MSIX SUBMISSION."
              exit 1
            fi
            if ! [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error title=Release candidate run required::Enter the approved Workflow 21 run ID."
              exit 1
            fi
            if [ "$REPORT" = true ]; then completion="BUILD ONLY, REPORT"; else completion="BUILD ONLY"; fi
          fi
          {
            echo "completion=$completion"
            echo "compile_mode=$compile_mode"
            echo "clean=$clean"
            echo "candidate_run_id=$CANDIDATE_RUN_ID"
            echo "windows_build_run_id=$WINDOWS_BUILD_RUN_ID"
            echo "started_epoch=$STARTED_EPOCH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Workflow 22 selected plan"
            echo
            echo "- Completion: \`$completion\`"
            echo "- Compilation mode: \`$compile_mode\`"
            echo "- Candidate run: \`${CANDIDATE_RUN_ID:-not applicable}\`"
            echo "- Existing Windows build run: \`${WINDOWS_BUILD_RUN_ID:-not applicable}\`"
            echo "- Standard-build Store output: \`unsigned MSIX plus offline local review bundle\`"
          } >> "$GITHUB_STEP_SUMMARY"

  audit-candidate:
    name: Audit approved Windows release candidate
    needs: resolve-plan
    if: ${{ needs.resolve-plan.outputs.completion != 'SUBMIT EXISTING MSIX' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.release_version }}
      commit: ${{ steps.candidate.outputs.candidate_commit }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download approved release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-release-candidate
          path: release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-plan.outputs.candidate_run_id }}

      - name: Verify immutable candidate contract
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_artifact_contract.py verify-candidate release-candidate \
            --expected-run-id "${{ needs.resolve-plan.outputs.candidate_run_id }}" \
            --github-output "$GITHUB_OUTPUT"
          git bundle verify release-candidate/release-source.bundle
          python3 - <<'PY'
          import json
          manifest = json.load(open("release-candidate/release-candidate.json", encoding="utf-8"))
          if manifest["target"] not in {"ALL", "WINDOWS"}:
              raise SystemExit("The approved candidate does not include the Windows target")
          PY

      - name: Report candidate audit
        shell: bash
        run: |
          {
            echo "## Workflow 22 candidate audit"
            echo
            echo "- Candidate commit/version: \`${{ steps.candidate.outputs.candidate_commit }}\` / \`${{ steps.candidate.outputs.release_version }}\`"
            echo "- Requested mode: \`${{ needs.resolve-plan.outputs.compile_mode }}\`"
            echo "- Bundle checksum and provenance: \`passed\`"
            echo "- MSIX and offline review bundle required for a standard build: \`true\`"
            echo "- Compilation and packaging performed by this audit: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build portable, ZIP, MSIX and local review bundle
    needs: [resolve-plan, audit-candidate]
    if: ${{ needs.resolve-plan.outputs.completion == 'BUILD ONLY' }}
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: ${{ needs.resolve-plan.outputs.clean == 'true' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download approved release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-release-candidate
          path: release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-plan.outputs.candidate_run_id }}

      - name: Verify and checkout exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_artifact_contract.py verify-candidate release-candidate \
            --expected-run-id "${{ needs.resolve-plan.outputs.candidate_run_id }}" \
            --github-output "$GITHUB_OUTPUT"
          git fetch release-candidate/release-source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "${{ needs.audit-candidate.outputs.commit }}"
          git checkout --detach FETCH_HEAD
          test "$(python3 .github/scripts/source_version.py current)" = "${{ needs.audit-candidate.outputs.version }}"

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$WINDOWS_TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Calculate normalized dependency cache identity
        id: cache-key
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content -Raw -LiteralPath build/Windows/Cargo.lock
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "splined-windows"\r?\n)version = "[^"]+"'
          $normalized = [regex]::Replace($lock, $pattern, '${1}version = "<release>"')
          if ($normalized -eq $lock) { throw "Unable to normalize the Windows package version." }
          $bytes = [Text.Encoding]::UTF8.GetBytes($normalized)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "hash=$hash" | Add-Content $env:GITHUB_OUTPUT

      - name: Restore Cargo dependency cache
        id: dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-${{ steps.cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-

      - name: Restore compatible compiled intermediates
        if: ${{ needs.resolve-plan.outputs.clean != 'true' }}
        id: compiled
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/Windows/target/x86_64-pc-windows-msvc/release/deps
            build/Windows/target/x86_64-pc-windows-msvc/release/build
            build/Windows/target/x86_64-pc-windows-msvc/release/.fingerprint
            build/Windows/target/x86_64-pc-windows-msvc/release/incremental
            build/Windows/target/release/deps
            build/Windows/target/release/build
            build/Windows/target/release/.fingerprint
            build/Windows/target/release/incremental
          key: ${{ runner.os }}-splined-optimized-compiled-v2-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.cache-key.outputs.hash }}-${{ needs.audit-candidate.outputs.commit }}-${{ needs.audit-candidate.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-splined-optimized-compiled-v2-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.cache-key.outputs.hash }}-

      - name: Compile optimized x64 Rust/Slint executable
        id: compile
        shell: pwsh
        env:
          SPLINED_BUILD_COMMIT: ${{ needs.audit-candidate.outputs.commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $started = Get-Date
          if ($env:CARGO_INCREMENTAL -eq "0") {
            cargo clean --manifest-path build/Windows/Cargo.toml --release --target $env:WINDOWS_TARGET
          }
          cargo build --locked --release --manifest-path build/Windows/Cargo.toml --target $env:WINDOWS_TARGET
          "seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Stage and validate portable Windows distributable
        id: portable
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ needs.audit-candidate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.audit-candidate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $started = Get-Date
          $releaseRoot = "build/Windows/target/$env:WINDOWS_TARGET/release"
          $portableRoot = "windows-release/release-package/SPLINED"
          New-Item -ItemType Directory -Force -Path $portableRoot, "windows-release/release-assets" | Out-Null
          Copy-Item "$releaseRoot/splined.exe" "$portableRoot/splined.exe"
          Copy-Item release/README-WINDOWS.txt "$portableRoot/README-WINDOWS.txt"

          $bytes = [IO.File]::ReadAllBytes((Resolve-Path "$portableRoot/splined.exe").Path)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw "Invalid PE signature." }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw "Expected AMD64 PE architecture." }
          $identityPath = Join-Path $env:RUNNER_TEMP "splined-build-info.json"
          $identity = Start-Process -FilePath (Resolve-Path "$portableRoot/splined.exe") -ArgumentList @("--write-build-info", $identityPath) -Wait -PassThru
          if ($identity.ExitCode -ne 0) { throw "Executable identity query failed." }
          $buildInfo = Get-Content -Raw -LiteralPath $identityPath | ConvertFrom-Json
          if ($buildInfo.version -ne $env:RELEASE_VERSION -or $buildInfo.commit -ne $env:RELEASE_COMMIT -or $buildInfo.architecture -ne "rust-slint") {
            throw "Executable identity does not match the approved candidate."
          }
          $stateRoot = Join-Path $env:RUNNER_TEMP "splined-portable-smoke-state"
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $prior = $env:SPLINED_INTERNAL_STATE_ROOT
          $env:SPLINED_INTERNAL_STATE_ROOT = $stateRoot
          try {
            $smoke = Start-Process -FilePath (Resolve-Path "$portableRoot/splined.exe") -ArgumentList "--native-smoke" -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          } finally {
            $env:SPLINED_INTERNAL_STATE_ROOT = $prior
          }
          if ($smoke.ExitCode -ne 0) { throw "Portable native smoke failed." }
          Compress-Archive -Path $portableRoot -DestinationPath "windows-release/release-assets/splined-windows-x86_64.zip" -Force
          $manifest = [ordered]@{
            schema = 2
            channel = "stable"
            version = $env:RELEASE_VERSION
            commit = $env:RELEASE_COMMIT
            short_commit = $env:RELEASE_COMMIT.Substring(0, 7)
            published_at = [DateTime]::UtcNow.ToString("o")
            release_url = "https://github.com/scottia/S-P-L-I-N-E-D/releases/tag/$env:RELEASE_VERSION"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 "windows-release/release-assets/windows-update.json"
          "seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Install pinned upstream WinAppCli
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installRoot = Join-Path $env:RUNNER_TEMP "splined-winappcli"
          npm install --prefix $installRoot --no-save --no-audit --no-fund "@microsoft/winappcli@0.7.1"
          $commandDirectory = Join-Path $installRoot "node_modules\.bin"
          $commandDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (((& (Join-Path $commandDirectory "winapp.cmd") --version) -join "`n") -notmatch '0\.7\.1') {
            throw "Pinned WinAppCli did not report version 0.7.1."
          }

      - name: Build and strictly validate unsigned production MSIX
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.audit-candidate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $started = Get-Date
          $releaseRoot = "build/Windows/target/$env:WINDOWS_TARGET/release"
          New-Item -ItemType Directory -Force -Path "windows-release/store-review" | Out-Null
          $storePackage = "windows-release/store-review/SPLINED-x64-store-unsigned.msix"
          & build/Windows/package/Build-StorePackage.ps1 `
            -ExecutablePath "$releaseRoot/splined.exe" `
            -ManifestPath build/Windows/package/Package.appxmanifest `
            -IconPath build/Windows/gui/splined-app-icon.png `
            -LayoutRoot (Join-Path $env:RUNNER_TEMP "splined-msix-store-layout") `
            -UnpackedRoot (Join-Path $env:RUNNER_TEMP "splined-msix-store-unpacked") `
            -OutputPath $storePackage `
            -ExpectedVersion "$env:RELEASE_VERSION.0" | Out-String | Write-Host
          & build/Windows/package/Test-DevelopmentPackage.ps1 `
            -ExecutablePath "$releaseRoot/splined.exe" `
            -ManifestPath build/Windows/package/Package.appxmanifest `
            -IconPath build/Windows/gui/splined-app-icon.png `
            -LayoutRoot (Join-Path $env:RUNNER_TEMP "splined-msix-development-layout")
          "seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Generate offline Store review bundle
        id: review
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.audit-candidate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.audit-candidate.outputs.commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $started = Get-Date
          git fetch --force --tags origin
          $existingTag = (git tag --list -- $env:RELEASE_VERSION) -join "`n"
          if (-not [String]::IsNullOrWhiteSpace($existingTag)) {
            if ((git rev-list -n 1 $env:RELEASE_VERSION) -ne $env:RELEASE_COMMIT) { throw "Existing tag points at a different commit." }
          } else {
            git tag $env:RELEASE_VERSION $env:RELEASE_COMMIT
          }
          & release/Install-GitCliff.ps1 -InstallDirectory (Join-Path $env:RUNNER_TEMP "git-cliff-2.14.2")
          if (((git-cliff --version) -join "`n").Trim() -cne "git-cliff 2.14.2") { throw "Expected git-cliff 2.14.2." }
          & release/Test-ReleaseNoteClassification.ps1
          & release/Generate-ReleaseNotes.ps1 `
            -Version $env:RELEASE_VERSION `
            -RepositoryRoot . `
            -ConfigPath release/cliff.toml `
            -GitHubTemplatePath release/templates/github-release.tera `
            -OutputDirectory windows-release/release-notes
          & git-cliff `
            --config release/cliff.toml `
            --from-context windows-release/release-notes/release-context.json `
            --body-file release/templates/store-highlights.tera `
            --strip all `
            --output windows-release/store-review/STORE-HIGHLIGHTS.txt
          & release/Test-LocalStoreReviewBundle.ps1 -RepositoryRoot .
          & release/New-LocalStoreReviewBundle.ps1 `
            -PackagePath windows-release/store-review/SPLINED-x64-store-unsigned.msix `
            -HighlightsPath windows-release/store-review/STORE-HIGHLIGHTS.txt `
            -ReleaseContextPath windows-release/release-notes/release-context.json `
            -TargetVersion $env:RELEASE_VERSION `
            -TargetCommit $env:RELEASE_COMMIT `
            -OutputDirectory windows-release/local-store-review
          "seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Create checksummed Windows build provenance
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ needs.resolve-plan.outputs.candidate_run_id }}
          COMPILE_SECONDS: ${{ steps.compile.outputs.seconds }}
          VALIDATION_SECONDS: ${{ steps.portable.outputs.seconds }}
          PACKAGE_SECONDS: ${{ steps.package.outputs.seconds }}
          REVIEW_SECONDS: ${{ steps.review.outputs.seconds }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path windows-release/candidate | Out-Null
          Copy-Item release-candidate/* windows-release/candidate/
          python .github/scripts/release_artifact_contract.py create-build `
            --kind windows `
            --root windows-release `
            --candidate-root release-candidate `
            --candidate-run-id $env:CANDIDATE_RUN_ID `
            --run-id $env:GITHUB_RUN_ID `
            --compile-mode "${{ needs.resolve-plan.outputs.compile_mode }}" `
            --validation portable-identity-x64-native-smoke `
            --validation unsigned-msix-package-contract `
            --validation isolated-development-package `
            --validation offline-local-store-review `
            --metric "dependency_cache_hit=${{ steps.dependencies.outputs.cache-hit }}" `
            --metric "compiled_cache_hit=${{ steps.compiled.outputs.cache-hit }}" `
            --metric "compile_seconds=$env:COMPILE_SECONDS" `
            --metric "portable_validation_seconds=$env:VALIDATION_SECONDS" `
            --metric "msix_validation_seconds=$env:PACKAGE_SECONDS" `
            --metric "local_review_seconds=$env:REVIEW_SECONDS"

      - name: Upload complete validated Windows build
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-windows-release
          path: windows-release/
          if-no-files-found: error
          retention-days: 90

      - name: Report Windows build measurements
        shell: pwsh
        run: |
          @"
          ## Workflow 22 Windows build complete

          - Candidate commit/version: ``${{ needs.audit-candidate.outputs.commit }}`` / ``${{ needs.audit-candidate.outputs.version }}``
          - Mode: ``${{ needs.resolve-plan.outputs.compile_mode }}``
          - Dependency cache hit: ``${{ steps.dependencies.outputs.cache-hit }}``
          - Compiled cache exact hit: ``${{ steps.compiled.outputs.cache-hit }}``
          - Compilation: ``${{ steps.compile.outputs.seconds }} seconds``
          - Portable validation: ``${{ steps.portable.outputs.seconds }} seconds``
          - MSIX packaging/validation: ``${{ steps.package.outputs.seconds }} seconds``
          - Local review generation: ``${{ steps.review.outputs.seconds }} seconds``
          - Unsigned MSIX retained: ``true``
          - Offline local review bundle retained: ``true``
          - Partner Center contacted: ``false``
          - Artifact ID: ``${{ steps.upload.outputs.artifact-id }}``
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  audit-submission:
    name: Audit existing validated MSIX and published release
    needs: resolve-plan
    if: ${{ needs.resolve-plan.outputs.completion == 'SUBMIT EXISTING MSIX' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.release_version }}
      commit: ${{ steps.build.outputs.candidate_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download exact prior Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-windows-release
          path: windows-release
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-plan.outputs.windows_build_run_id }}
      - name: Verify build manifest, checksums, tag and release
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_artifact_contract.py verify-build --kind windows windows-release \
            --expected-run-id "${{ needs.resolve-plan.outputs.windows_build_run_id }}" \
            --github-output "$GITHUB_OUTPUT"
          test -s windows-release/store-review/SPLINED-x64-store-unsigned.msix
          VERSION=$(python3 -c 'import json; print(json.load(open("windows-release/windows-build-manifest.json"))["release_version"])')
          COMMIT=$(python3 -c 'import json; print(json.load(open("windows-release/windows-build-manifest.json"))["candidate_commit"])')
          git fetch --force --tags origin
          test "$(git rev-list -n 1 "$VERSION")" = "$COMMIT"
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          {
            echo "## Workflow 22 Store submission audit"
            echo
            echo "- Published release: \`$VERSION\`"
            echo "- Exact validated commit: \`$COMMIT\`"
            echo "- Windows build run: \`${{ needs.resolve-plan.outputs.windows_build_run_id }}\`"
            echo "- MSIX checksum/provenance: \`passed\`"
            echo "- Compilation and repackaging: \`not performed\`"
          } >> "$GITHUB_STEP_SUMMARY"

  approve-submission:
    name: Approve Microsoft Store submission
    needs: [resolve-plan, audit-submission]
    if: ${{ needs.resolve-plan.outputs.completion == 'SUBMIT EXISTING MSIX' && needs.audit-submission.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: workflow-22-store-submission-approval
    steps:
      - run: echo "Exact validated MSIX submission approved." >> "$GITHUB_STEP_SUMMARY"

  submit-store:
    name: Submit exact existing MSIX without rebuilding
    needs: [resolve-plan, audit-submission, approve-submission]
    if: ${{ needs.approve-submission.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.audit-submission.outputs.version }}
          fetch-depth: 0
      - name: Download exact prior Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-windows-release
          path: windows-release
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-plan.outputs.windows_build_run_id }}
      - name: Verify Windows build again on submission runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/release_artifact_contract.py verify-build --kind windows windows-release `
            --expected-run-id "${{ needs.resolve-plan.outputs.windows_build_run_id }}"
      - name: Require Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("AZURE_AD_APPLICATION_CLIENT_ID", "AZURE_AD_APPLICATION_SECRET", "AZURE_AD_TENANT_ID", "SELLER_ID")) {
            if ([String]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing Store credential: $name" }
          }
      - name: Install pinned Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3
      - name: Install and verify release-note tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & release/Install-GitCliff.ps1 -InstallDirectory (Join-Path $env:RUNNER_TEMP "git-cliff-2.14.2")
          if (((git-cliff --version) -join "`n").Trim() -cne "git-cliff 2.14.2") { throw "Expected git-cliff 2.14.2." }
          & release/Test-StoreBaseline.ps1 -RepositoryRoot .
      - name: Authenticate and resolve published Store baseline
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          RELEASE_VERSION: ${{ needs.audit-submission.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          & release/Resolve-StoreBaseline.ps1 -TargetVersion $env:RELEASE_VERSION -RepositoryRoot . -ProductId 9P8G4GMBBVBS -OutputDirectory store-notes
          & release/Generate-StoreHighlights.ps1 `
            -Version $env:RELEASE_VERSION `
            -BaselineMetadataPath store-notes/STORE-BASELINE.json `
            -RepositoryRoot . `
            -ConfigPath release/cliff.toml `
            -StoreTemplatePath release/templates/store-highlights.tera `
            -OutputDirectory store-notes
      - name: Assemble exact submission audit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path store-auto-submission | Out-Null
          Copy-Item windows-release/store-review/SPLINED-x64-store-unsigned.msix store-auto-submission/SPLINED-x64-store-unsigned.msix
          Copy-Item store-notes/STORE-HIGHLIGHTS.txt store-auto-submission/STORE-HIGHLIGHTS.txt
          Copy-Item store-notes/STORE-SUBMISSION.json store-auto-submission/STORE-SUBMISSION.json
      - name: Upload Store submission audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-windows-store-auto-submission
          path: store-auto-submission/
          if-no-files-found: error
      - name: Submit exact package and Highlights for certification
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.audit-submission.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          & build/Windows/package/Publish-StoreUpdate.ps1 `
            -PackagePath store-auto-submission/SPLINED-x64-store-unsigned.msix `
            -HighlightsPath store-auto-submission/STORE-HIGHLIGHTS.txt `
            -BaselineMetadataPath store-auto-submission/STORE-SUBMISSION.json `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ProductId 9P8G4GMBBVBS

  summary:
    name: Windows workflow summary
    needs: [resolve-plan, audit-candidate, build-windows, audit-submission, approve-submission, submit-store]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report stage results and recovery action
        shell: bash
        run: |
          {
            echo "## Workflow 22 stage results"
            echo
            echo "- Plan: \`${{ needs.resolve-plan.result }}\`"
            echo "- Candidate audit: \`${{ needs.audit-candidate.result }}\`"
            echo "- Windows build/package: \`${{ needs.build-windows.result }}\`"
            echo "- Existing-MSIX audit: \`${{ needs.audit-submission.result }}\`"
            echo "- Submission approval: \`${{ needs.approve-submission.result }}\`"
            echo "- Partner Center submission: \`${{ needs.submit-store.result }}\`"
            echo "- Next action after build failure: rerun Workflow 22 with the same approved candidate."
            echo "- Next action after submission failure: retain the validated MSIX, correct credentials or Store state, and rerun submission-only mode without rebuilding."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce selected outcome
        shell: bash
        env:
          PLAN: ${{ needs.resolve-plan.result }}
          COMPLETION: ${{ needs.resolve-plan.outputs.completion }}
          AUDIT_CANDIDATE: ${{ needs.audit-candidate.result }}
          BUILD: ${{ needs.build-windows.result }}
          AUDIT_SUBMISSION: ${{ needs.audit-submission.result }}
          APPROVAL: ${{ needs.approve-submission.result }}
          SUBMISSION: ${{ needs.submit-store.result }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          case "$COMPLETION" in
            "BUILD ONLY")
              test "$AUDIT_CANDIDATE" = success
              test "$BUILD" = success
              result="Portable, ZIP, unsigned MSIX and offline local review bundle retained."
              ;;
            "BUILD ONLY, REPORT")
              test "$AUDIT_CANDIDATE" = success
              test "$BUILD" = skipped
              result="Report-only audit complete; no compilation or packaging ran."
              ;;
            "SUBMIT EXISTING MSIX")
              test "$AUDIT_SUBMISSION" = success
              test "$APPROVAL" = success
              test "$SUBMISSION" = success
              result="Exact existing validated MSIX submitted without recompilation or repackaging."
              ;;
            *) exit 1 ;;
          esac
          {
            echo "## Workflow 22 complete"
            echo
            echo "$result"
            echo "- Total elapsed time: \`$(($(date +%s) - ${{ needs.resolve-plan.outputs.started_epoch }})) seconds\`"
            echo "GitHub tagging, GitHub Release publication and GHCR publication were not performed."
          } >> "$GITHUB_STEP_SUMMARY"
