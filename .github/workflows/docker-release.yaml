name: SPLINED Docker Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splined-docker-release
  cancel-in-progress: false

env:
  IMAGE_NAME: scottia/splined
  RELEASE_VERSION: 1.0.1
  EXPECTED_SPLINED_SHA256: 4470bea0fd2e1df36102d56b9c99e40160e5a69ac078e1a2a6dc8908df1e022b

jobs:
  release:
    name: Build, verify and publish v1.0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify validated stable source
        shell: bash
        run: |
          set -euo pipefail

          test -f python/splined.py
          printf '%s  %s\n' "$EXPECTED_SPLINED_SHA256" python/splined.py | sha256sum --check --strict

          python3 - <<'PY'
          import pathlib
          import re
          import os

          source = pathlib.Path("python/splined.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"$', source, re.MULTILINE)
          if not match:
              raise SystemExit("VERSION declaration not found in python/splined.py")

          expected = os.environ["RELEASE_VERSION"]
          actual = match.group(1)
          print(f"Source version: {actual}")
          if actual != expected:
              raise SystemExit(f"Expected VERSION {expected}, found {actual}")
          PY

          python3 -m py_compile python/splined.py

      - name: Build release image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --tag "$IMAGE_NAME:release-candidate" \
            ./python

      - name: Verify container version
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(docker run --rm "$IMAGE_NAME:release-candidate" -V)
          EXPECTED="SPLINED $RELEASE_VERSION"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: scottia
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push immutable release
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$IMAGE_NAME:release-candidate" "$IMAGE_NAME:$RELEASE_VERSION"
          docker push "$IMAGE_NAME:$RELEASE_VERSION"

      - name: Tag and push latest
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$IMAGE_NAME:release-candidate" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"

      - name: Verify published tags
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_VERSION"
          docker buildx imagetools inspect "$IMAGE_NAME:latest"
