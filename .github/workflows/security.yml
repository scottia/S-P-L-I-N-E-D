name: SPLINED Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "43 7 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" |
            sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan all commits with Gitleaks
        run: "$RUNNER_TEMP/gitleaks git --redact --no-banner ."

  python-dependencies:
    name: Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r python/requirements.txt

  rust-policy:
    name: Rust policy (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - windows/Cargo.toml
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit advisories, licenses, bans, and sources
        run: cargo deny --manifest-path "${{ matrix.manifest }}" --all-features check
