name: 05. Prepare Next Source Version - Draft PR and Compile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splined-source-version-preparation
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  WINDOWS_TARGET: "x86_64-pc-windows-msvc"
  CARGO_INCREMENTAL: "1"

jobs:
  prepare-source:
    name: Create next-version Draft PR
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      branch: ${{ steps.prepare.outputs.branch }}
      commit: ${{ steps.prepare.outputs.commit }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      pr_url: ${{ steps.prepare.outputs.pr_url }}
    steps:
      - name: Checkout main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create Draft PR before source-version changes
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Main branch required::Workflow 05 must be dispatched from main."
            exit 1
          fi

          git fetch origin main dev --tags --force
          MAIN_SHA=$(git rev-parse origin/main)
          DEV_SHA=$(git rev-parse origin/dev)
          if [ "$MAIN_SHA" != "$DEV_SHA" ]; then
            echo "::error title=Branches are not synchronized::Workflow 05 requires origin/main and origin/dev to identify the same commit. main=$MAIN_SHA dev=$DEV_SHA"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$MAIN_SHA" ]; then
            echo "::error title=Stale dispatch::The checked-out main revision is not the current origin/main revision."
            exit 1
          fi

          TAG_ARGS=()
          while IFS= read -r release_tag; do
            [ -n "$release_tag" ] && TAG_ARGS+=(--tag "$release_tag")
          done < <(git tag --merged origin/main --list)
          CURRENT_VERSION=$(python3 .github/scripts/source_version.py current)
          NEXT_VERSION=$(python3 .github/scripts/source_version.py next "${TAG_ARGS[@]}")
          BRANCH_NAME="source/v${NEXT_VERSION}-workflow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            echo "::error title=Candidate branch already exists::$BRANCH_NAME"
            exit 1
          fi

          git checkout -b "$BRANCH_NAME" "$MAIN_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/pr-intent
          cat > .github/pr-intent/source-version-preparation.md <<EOF
          # Draft source-version preparation

          Workflow 05 created this Draft PR before changing application source.
          Planned version: ${NEXT_VERSION}; base source: ${MAIN_SHA}.
          This temporary boundary file is removed by the version-stamping commit.
          EOF
          git add .github/pr-intent/source-version-preparation.md
          git commit -m "chore: initialize source v${NEXT_VERSION} preparation"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"

          cat > "$RUNNER_TEMP/source-pr-body.md" <<EOF
          ## Source preparation plan

          - Advance the synchronized Windows and WebGUI source from \`${CURRENT_VERSION}\` to \`${NEXT_VERSION}\`.
          - Update Cargo, Windows manifests, WebGUI identity, and Workflow 04's visible committed-version default together.
          - Compile the exact candidate commit for Windows and WebGUI.
          - Run the required PR validation on the exact candidate revision.

          ## Safety boundary

          This Draft PR targets \`dev\`. Workflow 05 does not merge it, write to \`dev\` or \`main\`, create a tag or GitHub Release, publish GHCR, or contact Microsoft Store.

          Base \`main\` / \`dev\` commit: \`${MAIN_SHA}\`.
          EOF
          PR_URL=$(gh pr create \
            --draft \
            --base dev \
            --head "$BRANCH_NAME" \
            --title "Draft: prepare SPLINED source v${NEXT_VERSION}" \
            --body-file "$RUNNER_TEMP/source-pr-body.md")
          PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq .number)

          python3 .github/scripts/source_version.py stamp "$NEXT_VERSION"
          rm .github/pr-intent/source-version-preparation.md
          rmdir .github/pr-intent 2>/dev/null || true
          python3 .github/scripts/source_version.py current | grep -Fx "$NEXT_VERSION"
          python3 .github/scripts/test_release_source_version.py
          python3 .github/scripts/test_optimized_build_workflow.py
          git diff --check
          git add \
            .github/scripts/source_version.py \
            .github/scripts/test_release_source_version.py \
            .github/workflows/04-optimized-build-test.yml \
            build/Windows/Cargo.toml \
            build/Windows/Cargo.lock \
            build/Windows/gui/app.manifest \
            build/Windows/package/Package.appxmanifest \
            build/Windows/package/SPLINED.appinstaller.template \
            build/WEBGui/webgui/backend/splined.py \
            .github/pr-intent/source-version-preparation.md
          git commit -m "release: prepare source ${NEXT_VERSION}"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
          CANDIDATE_SHA=$(git rev-parse HEAD)

          cat >> "$RUNNER_TEMP/source-pr-body.md" <<EOF

          Candidate source commit: \`${CANDIDATE_SHA}\`.

          Workflow 05 leaves this PR in Draft for required checks and owner review. Promotion and release remain separate owner actions.
          EOF
          gh pr edit "$PR_URL" --body-file "$RUNNER_TEMP/source-pr-body.md"

          # Pull-request events created with GITHUB_TOKEN do not recursively
          # start Actions. Dispatch the same required validation explicitly on
          # the candidate branch so the exact revision receives the checks once.
          gh workflow run validate.yml \
            --ref "$BRANCH_NAME"

          {
            echo "version=$NEXT_VERSION"
            echo "branch=$BRANCH_NAME"
            echo "commit=$CANDIDATE_SHA"
            echo "pr_number=$PR_NUMBER"
            echo "pr_url=$PR_URL"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Workflow 05 source candidate created"
            echo
            echo "- Version: \`$NEXT_VERSION\`"
            echo "- Draft PR: $PR_URL"
            echo "- Candidate commit: \`$CANDIDATE_SHA\`"
            echo "- Required validation: explicitly dispatched for this commit"
            echo "- Merge, tags, releases, GHCR and Store publication: none"
          } >> "$GITHUB_STEP_SUMMARY"

  compile-windows:
    name: Compile candidate — Windows
    needs: prepare-source
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-source.outputs.commit }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$WINDOWS_TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Calculate normalized Windows dependency key
        id: dependency-key
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content -Raw -LiteralPath build/Windows/Cargo.lock
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "splined-windows"\r?\n)version = "[^"]+"'
          $normalized = [regex]::Replace($lock, $pattern, '${1}version = "<source>"')
          if ($normalized -eq $lock) { throw "Unable to normalize the Windows source version." }
          $bytes = [Text.Encoding]::UTF8.GetBytes($normalized)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "hash=$hash" | Add-Content $env:GITHUB_OUTPUT

      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-source-dependencies-v1-${{ env.RUST_TOOLCHAIN }}-${{ steps.dependency-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-splined-source-dependencies-v1-${{ env.RUST_TOOLCHAIN }}-

      - name: Restore compiled dependency intermediates
        id: compiled-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/Windows/target/x86_64-pc-windows-msvc/release/deps
            build/Windows/target/x86_64-pc-windows-msvc/release/build
            build/Windows/target/x86_64-pc-windows-msvc/release/.fingerprint
            build/Windows/target/x86_64-pc-windows-msvc/release/incremental
            build/Windows/target/release/deps
            build/Windows/target/release/build
            build/Windows/target/release/.fingerprint
            build/Windows/target/release/incremental
          key: ${{ runner.os }}-splined-source-compiled-v1-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.dependency-key.outputs.hash }}-${{ needs.prepare-source.outputs.commit }}
          restore-keys: |
            ${{ runner.os }}-splined-source-compiled-v1-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.dependency-key.outputs.hash }}-

      - name: Compile exact Windows candidate
        id: compile
        shell: pwsh
        env:
          SPLINED_BUILD_COMMIT: ${{ needs.prepare-source.outputs.commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $started = Get-Date
          cargo build --locked --release --manifest-path build/Windows/Cargo.toml --target $env:WINDOWS_TARGET
          "elapsed_seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Verify Windows candidate identity
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ needs.prepare-source.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.prepare-source.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build/Windows/target/$env:WINDOWS_TARGET/release/splined.exe"
          $identityPath = Join-Path $env:RUNNER_TEMP "splined-source-build-info.json"
          $process = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @("--write-build-info", $identityPath) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The candidate executable could not report its identity." }
          $identity = Get-Content -Raw -LiteralPath $identityPath | ConvertFrom-Json
          if ($identity.version -ne $env:EXPECTED_VERSION) { throw "Candidate version mismatch." }
          if ($identity.commit -ne $env:EXPECTED_COMMIT) { throw "Candidate commit mismatch." }
          if ($identity.architecture -ne "rust-slint") { throw "Candidate architecture mismatch." }
          New-Item -ItemType Directory -Force -Path source-candidate | Out-Null
          Copy-Item -LiteralPath $exe -Destination source-candidate/splined.exe
          "QA source candidate only. No release, Store package, or publication." | Set-Content -Encoding utf8 source-candidate/QA-NOT-A-RELEASE.txt
          Compress-Archive -Path source-candidate -DestinationPath "splined-windows-source-v$env:EXPECTED_VERSION.zip" -Force

      - name: Upload Windows source candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-windows-source-v${{ needs.prepare-source.outputs.version }}
          path: splined-windows-source-v${{ needs.prepare-source.outputs.version }}.zip
          if-no-files-found: error

      - name: Report Windows source compilation
        shell: pwsh
        run: |
          @"
          ## Windows source candidate

          - Cargo download cache exact hit: ``${{ steps.cargo-cache.outputs.cache-hit }}``
          - Compiled cache exact hit: ``${{ steps.compiled-cache.outputs.cache-hit }}``
          - Compile duration: ``${{ steps.compile.outputs.elapsed_seconds }} seconds``
          - Version: ``${{ needs.prepare-source.outputs.version }}``
          - Commit: ``${{ needs.prepare-source.outputs.commit }}``
          - Publication: none
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  compile-webgui:
    name: Compile candidate — WebGUI container
    needs: prepare-source
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splined_test
          POSTGRES_PASSWORD: splined_ci_only
          POSTGRES_DB: splined_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splined_test -d splined_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-source.outputs.commit }}
          fetch-depth: 0

      - name: Verify committed source identity
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare-source.outputs.version }}
        run: |
          set -euo pipefail
          test "$(python3 .github/scripts/source_version.py current)" = "$EXPECTED_VERSION"

      - name: Build and smoke-test exact WebGUI container
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          docker build --file build/WEBGui/Dockerfile --tag splined-webgui:source-candidate .
          docker run -d --name splined-webgui-source-candidate --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=splined_test -e PGPASSWORD=splined_ci_only \
            -e PGDATABASE=splined_test -e SPLINED_WEB_TOKEN=ci-browser-only \
            splined-webgui:source-candidate
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/status > /tmp/splined-status.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs splined-webgui-source-candidate
            exit 1
          fi
          python3 - <<'PY'
          import json
          status = json.load(open('/tmp/splined-status.json', encoding='utf-8'))
          assert status['database'] == 'PostgreSQL'
          assert status['database_ready'] is True
          assert status['auth_required'] is True
          PY
          docker image inspect splined-webgui:source-candidate > webgui-source-image.json
          echo "elapsed_seconds=$(($(date +%s) - started))" >> "$GITHUB_OUTPUT"

      - name: Report WebGUI candidate logs
        if: always()
        run: docker logs splined-webgui-source-candidate || true

      - name: Upload WebGUI source image report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-webgui-source-v${{ needs.prepare-source.outputs.version }}
          path: webgui-source-image.json
          if-no-files-found: error

      - name: Report WebGUI source compilation
        shell: bash
        run: |
          {
            echo "## WebGUI source candidate"
            echo
            echo "- Container build and PostgreSQL health: passed"
            echo "- Build/smoke duration: \`${{ steps.compile.outputs.elapsed_seconds }} seconds\`"
            echo "- Version: \`${{ needs.prepare-source.outputs.version }}\`"
            echo "- Commit: \`${{ needs.prepare-source.outputs.commit }}\`"
            echo "- Publication: none"
          } >> "$GITHUB_STEP_SUMMARY"

  source-summary:
    name: Source preparation summary
    needs: [prepare-source, compile-windows, compile-webgui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Report Draft PR outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare-source.outputs.pr_number }}
          PR_URL: ${{ needs.prepare-source.outputs.pr_url }}
          VERSION: ${{ needs.prepare-source.outputs.version }}
          COMMIT: ${{ needs.prepare-source.outputs.commit }}
          PREPARE_RESULT: ${{ needs.prepare-source.result }}
          WINDOWS_RESULT: ${{ needs.compile-windows.result }}
          WEBGUI_RESULT: ${{ needs.compile-webgui.result }}
        run: |
          set -euo pipefail
          {
            echo "## Workflow 05 source preparation"
            echo
            echo "- Draft PR: ${PR_URL:-not created}"
            echo "- Version: ${VERSION:-not resolved}"
            echo "- Candidate commit: ${COMMIT:-not created}"
            echo "- Draft preparation: $PREPARE_RESULT"
            echo "- Windows compilation: $WINDOWS_RESULT"
            echo "- WebGUI container compilation: $WEBGUI_RESULT"
            echo "- Automatic merge or publication: none"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$PR_NUMBER" ]; then
            cat > "$RUNNER_TEMP/source-result.md" <<EOF
          Workflow 05 compiled candidate \`${COMMIT}\` for source version \`${VERSION}\`.

          - Windows compilation: **${WINDOWS_RESULT}**
          - WebGUI container compilation: **${WEBGUI_RESULT}**
          - Required source validation: dispatched separately on this exact commit
          - PR state: remains **Draft**
          - Merge, tags, releases, GHCR and Store publication: **none**
          EOF
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/source-result.md"
          fi

          if [ "$PREPARE_RESULT" != success ] || [ "$WINDOWS_RESULT" != success ] || [ "$WEBGUI_RESULT" != success ]; then
            echo "::error title=Source preparation incomplete::The Draft PR remains unmerged for diagnosis."
            exit 1
          fi
