name: 10. Unified Source Build - Full or Incremental Windows and WebGUI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build complete distributables for both clients or one selected client."
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "WINDOWS"
          - "WEBGUI"
      outcome:
        description: "COMPLETE RELEASE publishes; BUILD ONLY reports then builds without publishing; BUILD ONLY, REPORT stops after the audit report."
        required: true
        default: "COMPLETE RELEASE"
        type: choice
        options:
          - "COMPLETE RELEASE"
          - "BUILD ONLY"
          - "BUILD ONLY, REPORT"
      store_action:
        description: "Windows/ALL: retain the local review bundle, or additionally submit the validated package to Partner Center after release publication."
        required: true
        default: "LOCAL REVIEW ONLY"
        type: choice
        options:
          - "LOCAL REVIEW ONLY"
          - "AUTO SUBMIT"

permissions:
  contents: read

concurrency:
  group: ${{ inputs.outcome == 'COMPLETE RELEASE' && 'splined-unified-release' || format('splined-unified-build-{0}', github.ref) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  WINDOWS_TARGET: "x86_64-pc-windows-msvc"

jobs:
  resolve-plan:
    name: Resolve Workflow 10 source, target and compile plan
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.plan.outputs.platform }}
      target_label: ${{ steps.plan.outputs.target_label }}
      compile_mode: ${{ steps.plan.outputs.compile_mode }}
      clean: ${{ steps.plan.outputs.clean }}
      store_draft: ${{ steps.plan.outputs.store_draft }}
      store_submit: ${{ steps.plan.outputs.store_submit }}
      publish_ghcr: ${{ steps.plan.outputs.publish_ghcr }}
      release_confirmation: ${{ steps.plan.outputs.release_confirmation }}
      report_only: ${{ steps.plan.outputs.report_only }}
      release_version: ${{ steps.plan.outputs.release_version }}
      display_version: ${{ steps.plan.outputs.display_version }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      build_webgui: ${{ steps.plan.outputs.build_webgui }}
      existing_release: ${{ steps.plan.outputs.existing_release }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      main_sha: ${{ steps.plan.outputs.main_sha }}
      source_relation: ${{ steps.plan.outputs.source_relation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact committed source and requested outputs
        id: plan
        shell: bash
        env:
          TARGET_SELECTION: ${{ inputs.target }}
          OUTCOME: ${{ inputs.outcome }}
          STORE_ACTION: ${{ inputs.store_action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Main workflow required::Workflow 10 must be dispatched from main; received '$GITHUB_REF'."
            exit 1
          fi
          git fetch --force origin \
            main:refs/remotes/origin/main \
            dev:refs/remotes/origin/dev
          MAIN_SHA=$(git rev-parse origin/main)
          DEV_SHA=$(git rev-parse origin/dev)
          MAIN_TREE=$(git rev-parse origin/main^{tree})
          DEV_TREE=$(git rev-parse origin/dev^{tree})
          if [ "$MAIN_TREE" = "$DEV_TREE" ]; then
            source_relation="same tree - approved promotion merge accepted"
          elif git merge-base --is-ancestor "$MAIN_SHA" "$DEV_SHA"; then
            source_relation="different trees - origin/dev is ahead and selected"
          else
            echo "::error title=Unsafe branch relationship::origin/main and origin/dev have different trees, but origin/dev does not contain origin/main. Reconcile the branches through reviewed source promotion before running Workflow 10."
            exit 1
          fi
          MAIN_VERSION=$(git show origin/main:build/Windows/Cargo.toml | sed -n '0,/^version = /s/^version = "\([0-9][0-9.]*\)"/\1/p')
          git checkout --detach "$DEV_SHA"

          SOURCE_VERSION=$(python3 - <<'PY'
          from pathlib import Path
          import re

          cargo = Path("build/Windows/Cargo.toml").read_text(encoding="utf-8-sig")
          match = re.search(
              r'(?ms)^\[package\].*?^version\s*=\s*"(\d+\.\d+\.\d+)"',
              cargo,
          )
          if not match:
              raise SystemExit("Windows source version was not found")
          windows_version = match.group(1)
          webgui = Path("build/WEBGui/webgui/backend/splined.py").read_text(encoding="utf-8")
          webgui_match = re.search(r'^VERSION = "(\d+\.\d+\.\d+)"$', webgui, re.MULTILINE)
          if not webgui_match:
              raise SystemExit("WebGUI source version was not found")
          if webgui_match.group(1) != windows_version:
              raise SystemExit(
                  f"Committed source versions disagree: Windows {windows_version}, WebGUI {webgui_match.group(1)}"
              )
          print(windows_version)
          PY
          )

          if [ "${MAIN_VERSION:-}" = "$SOURCE_VERSION" ]; then
            compile_mode="PARTIAL UPDATE"
            clean=false
          else
            compile_mode="FULL SOURCE"
            clean=true
          fi

          case "$TARGET_SELECTION" in
            "ALL") platform="All"; target_label="Windows / WebGUI"; build_windows=true; build_webgui=true ;;
            "WINDOWS") platform="Windows"; target_label="Windows"; build_windows=true; build_webgui=false ;;
            "WEBGUI") platform="WebGUI / Python"; target_label="WebGUI"; build_windows=false; build_webgui=true ;;
            *)
              echo "::error title=Unknown Workflow 10 target::Unsupported target '$TARGET_SELECTION'."
              exit 1
              ;;
          esac
          case "$OUTCOME" in
            "COMPLETE RELEASE") release_confirmation="Create release now"; report_only=false ;;
            "BUILD ONLY") release_confirmation="Stop - no release"; report_only=false ;;
            "BUILD ONLY, REPORT") release_confirmation="Stop - no release"; report_only=true ;;
            *) echo "::error title=Invalid Workflow 10 outcome::$OUTCOME"; exit 1 ;;
          esac
          case "$STORE_ACTION" in
            "LOCAL REVIEW ONLY") store_submit=false ;;
            "AUTO SUBMIT")
              if [ "$OUTCOME" != "COMPLETE RELEASE" ]; then
                echo "::error title=Store submission requires a release::AUTO SUBMIT is unavailable for BUILD ONLY, REPORT."
                exit 1
              fi
              if [ "$TARGET_SELECTION" = "WEBGUI" ]; then
                echo "::error title=Windows target required::AUTO SUBMIT requires WINDOWS or ALL."
                exit 1
              fi
              store_submit=true
              ;;
            *) echo "::error title=Invalid Store action::$STORE_ACTION"; exit 1 ;;
          esac

          release_version="$SOURCE_VERSION"
          display_version="$SOURCE_VERSION"
          existing_release=false
          if gh release view "$SOURCE_VERSION" >/tmp/release.json 2>/dev/null; then
            existing_release=true
            if [ "$OUTCOME" = "COMPLETE RELEASE" ]; then
              mapfile -t existing_assets < <(gh release view "$SOURCE_VERSION" --json assets --jq '.assets[].name')
              if printf '%s\n' "${existing_assets[@]}" | grep -qx 'splined-windows-x86_64.zip'; then
                build_windows=false
              fi
              if printf '%s\n' "${existing_assets[@]}" | grep -qx 'splined-webgui-python.tar.gz'; then
                build_webgui=false
              fi
              if [ "$TARGET_SELECTION" = "WINDOWS" ] && [ "$build_windows" = false ]; then
                echo "::error title=Windows output already published::Version $SOURCE_VERSION already contains the Windows distributable; Workflow 10 never overwrites it."
                exit 1
              fi
              if [ "$TARGET_SELECTION" = "WEBGUI" ] && [ "$build_webgui" = false ]; then
                echo "::error title=WebGUI output already published::Version $SOURCE_VERSION already contains the WebGUI distributable; Workflow 10 never overwrites it."
                exit 1
              fi
              if [ "$TARGET_SELECTION" = "ALL" ] && [ "$build_windows" = false ] && [ "$build_webgui" = false ]; then
                echo "::error title=Release already complete::Version $SOURCE_VERSION already contains both complete distributables."
                exit 1
              fi
            fi
          fi
          store_draft=$build_windows
          publish_ghcr=$build_webgui
          if [ "$build_windows" != true ]; then
            store_submit=false
          fi

          {
            echo "platform=$platform"
            echo "target_label=$target_label"
            echo "compile_mode=$compile_mode"
            echo "clean=$clean"
            echo "store_draft=$store_draft"
            echo "store_submit=$store_submit"
            echo "publish_ghcr=$publish_ghcr"
            echo "release_confirmation=$release_confirmation"
            echo "report_only=$report_only"
            echo "release_version=$release_version"
            echo "display_version=$display_version"
            echo "build_windows=$build_windows"
            echo "build_webgui=$build_webgui"
            echo "existing_release=$existing_release"
            echo "source_sha=$DEV_SHA"
            echo "main_sha=$MAIN_SHA"
            echo "source_relation=$source_relation"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Workflow 10 resolved build plan"
            echo
            echo "- Requested target: \`$TARGET_SELECTION\`"
            echo "- Automatic compile mode: \`$compile_mode\` (main \`${MAIN_VERSION:-unknown}\`; dev \`$SOURCE_VERSION\`)"
            echo "- Workflow definition branch: \`$GITHUB_REF_NAME\`"
            echo "- Main commit/version: \`$MAIN_SHA\` / \`${MAIN_VERSION:-unknown}\`"
            echo "- Selected dev source: \`$DEV_SHA\` / \`$SOURCE_VERSION\`"
            echo "- Dev/main comparison: \`$source_relation\`"
            echo "- Release version: \`$display_version\`"
            echo "- Build Windows now: \`$build_windows\`"
            echo "- Build WebGUI now: \`$build_webgui\`"
            echo "- Existing release completion: \`$existing_release\`"
            echo "- Windows Store action: \`$STORE_ACTION\`; submit after release: \`$store_submit\`"
            echo "- Publish GHCR when WebGUI is built: \`$publish_ghcr\`"
            echo "- Outcome: \`$OUTCOME\`"
            echo "- Stop after report: \`$report_only\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-only-report:
    name: BUILD ONLY, REPORT — source, policy and credential audit
    needs: resolve-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact dev comparison source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-plan.outputs.source_sha }}
          fetch-depth: 0

      - name: Validate source versions and canonical policy contracts
        shell: bash
        env:
          PYTHONPATH: .:build/WEBGui:build/WEBGui/webgui/backend
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_release_policy_contracts.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Confirm Microsoft Store credential readiness without authentication
        id: store-credentials
        shell: bash
        env:
          BUILD_WINDOWS: ${{ needs.resolve-plan.outputs.build_windows }}
          STORE_SUBMIT: ${{ needs.resolve-plan.outputs.store_submit }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          set -euo pipefail
          if [ "$BUILD_WINDOWS" != true ]; then
            echo "ready=not-applicable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          for name in AZURE_AD_APPLICATION_CLIENT_ID AZURE_AD_APPLICATION_SECRET AZURE_AD_TENANT_ID SELLER_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Microsoft Store credentials unavailable::Missing credential names: ${missing[*]}. Local review remains available; AUTO SUBMIT is blocked."
            if [ "$STORE_SUBMIT" = true ]; then
              exit 1
            fi
          fi

      - name: Publish BUILD ONLY audit report
        shell: bash
        run: |
          {
            echo "## BUILD ONLY, REPORT"
            echo
            echo "- Dispatcher: \`origin/main\` at \`${{ needs.resolve-plan.outputs.main_sha }}\`"
            echo "- Compared and selected source: \`origin/dev\` at \`${{ needs.resolve-plan.outputs.source_sha }}\`"
            echo "- Comparison: \`${{ needs.resolve-plan.outputs.source_relation }}\`"
            echo "- Version: \`${{ needs.resolve-plan.outputs.display_version }}\`"
            echo "- Target: \`${{ needs.resolve-plan.outputs.target_label }}\`"
            echo "- Automatic mode: \`${{ needs.resolve-plan.outputs.compile_mode }}\`"
            echo "- Canonical policy and release-source checks: \`passed\`"
            echo "- Microsoft Store credentials: \`${{ steps.store-credentials.outputs.ready }}\`"
            echo "- Branch write, PR, tag, release, GHCR, and Store submission: \`not performed by this report\`"
          } >> "$GITHUB_STEP_SUMMARY"

  approve-plan:
    name: Approve resolved Workflow 10 plan
    needs: [resolve-plan, build-only-report]
    if: ${{ needs.resolve-plan.outputs.report_only != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: workflow-10-plan-approval
    steps:
      - name: Record the approved plan
        shell: bash
        run: |
          {
            echo "## Workflow 10 plan approved"
            echo
            echo "- Requested target: \`${{ inputs.target }}\`"
            echo "- Automatic compile mode: \`${{ needs.resolve-plan.outputs.compile_mode }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Release version: \`${{ needs.resolve-plan.outputs.display_version }}\`"
            echo "- Release target: \`${{ needs.resolve-plan.outputs.target_label }}\`"
            echo "- Clean full-source compile: \`${{ needs.resolve-plan.outputs.clean }}\`"
            echo "- Review Bundle / No Submit: \`${{ needs.resolve-plan.outputs.store_draft }}\`"
            echo "- Partner Center AUTO SUBMIT: \`${{ needs.resolve-plan.outputs.store_submit }}\`"
            echo "- Publish GHCR: \`${{ needs.resolve-plan.outputs.publish_ghcr }}\`"
            echo "- Final option: \`${{ needs.resolve-plan.outputs.release_confirmation }}\`"
            echo "- Existing release completion: \`${{ needs.resolve-plan.outputs.existing_release }}\`"
            echo "- Main commit: \`${{ needs.resolve-plan.outputs.main_sha }}\`"
            echo "- Selected dev source: \`${{ needs.resolve-plan.outputs.source_sha }}\`"
            echo "- Dev/main comparison: \`${{ needs.resolve-plan.outputs.source_relation }}\`"
            echo
            echo "Validation, compilation and publication may now begin."
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-release:
    needs: [resolve-plan, approve-plan]
    if: >-
      ${{
        needs.resolve-plan.result == 'success' &&
        needs.approve-plan.result == 'success' &&
        needs.resolve-plan.outputs.report_only != 'true'
      }}
    name: Prepare exact release source for build or unpublished validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      base: ${{ steps.release.outputs.base }}
      existing_release: ${{ steps.release.outputs.existing_release }}

    steps:
      - name: Validate resolved preset before any release work
        shell: bash
        env:
          RELEASE_CONFIRMATION: ${{ needs.resolve-plan.outputs.release_confirmation }}
          STORE_DRAFT: ${{ needs.resolve-plan.outputs.store_draft }}
          RELEASE_PLATFORM: ${{ needs.resolve-plan.outputs.platform }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CONFIRMATION" != "Create release now" ] && [ "$RELEASE_CONFIRMATION" != "Stop - no release" ]; then
            echo "::error title=Invalid preset plan::The selected preset did not resolve a supported release mode."
            exit 1
          fi
          if [ "$RELEASE_CONFIRMATION" = "Stop - no release" ]; then
            echo "::notice title=Validation only::Build and package the exact candidate locally; no branch, tag, Release, GHCR or Store publication."
          fi
          if [ "$STORE_DRAFT" = true ] && [ "$RELEASE_PLATFORM" != Windows ] && [ "$RELEASE_PLATFORM" != All ]; then
            echo "::error title=Windows build required::Store bundle preparation requires Windows or All."
            exit 1
          fi

      - name: Require main branch dispatch
        if: ${{ needs.resolve-plan.outputs.release_confirmation == 'Create release now' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: Run this release workflow from the main branch."
            echo "Received: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout exact source with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-plan.outputs.source_sha }}
          fetch-depth: 0

      - name: Provision exact versioned source in temporary runner commit
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ needs.resolve-plan.outputs.release_version }}
          RELEASE_MODE: ${{ needs.resolve-plan.outputs.release_confirmation }}
          EXPECTED_DEV_SHA: ${{ needs.resolve-plan.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          SOURCE_SHA=$(git rev-parse HEAD)
          if [ "$SOURCE_SHA" != "$EXPECTED_DEV_SHA" ]; then
            echo "::error title=Incorrect dev checkout::Expected $EXPECTED_DEV_SHA; received $SOURCE_SHA."
            exit 1
          fi
          RELEASE_VERSION="$REQUESTED_VERSION"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid committed version::$RELEASE_VERSION is not numeric X.Y.Z."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EXISTING_RELEASE=false
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
              echo "::error title=Tag without release::Tag $RELEASE_VERSION exists but has no published GitHub Release. Use the recovery workflow."
              exit 1
            fi
            EXISTING_RELEASE=true
            RELEASE_COMMIT=$(git rev-list -n 1 "$RELEASE_VERSION")
            if ! git diff --quiet "$RELEASE_COMMIT" HEAD -- build/Windows build/WEBGui schema; then
              echo "::error title=Source changed after this release::The current product source differs from tag $RELEASE_VERSION. Promote a new numeric source version before building."
              git diff --name-only "$RELEASE_COMMIT" HEAD -- build/Windows build/WEBGui schema
              exit 1
            fi
            git checkout --detach "$RELEASE_COMMIT"
            echo "Completing missing outputs for existing release $RELEASE_VERSION from exact tagged source $RELEASE_COMMIT."
          else
            python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys
          sys.path.insert(0, str(Path(".github/scripts").resolve()))
          from release_source_version import choose_release_version
          requested = os.environ["REQUESTED_VERSION"]
          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          versions = []
          for tag in tags:
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))
          actual = choose_release_version(requested, versions, tags, requested)
          if actual != requested:
              raise SystemExit(f"Resolved release {actual} did not match committed source {requested}")
          PY
            RELEASE_COMMIT="$SOURCE_SHA"
            git fetch --force origin dev:refs/remotes/origin/dev
            if [ "$(git rev-parse origin/dev)" != "$SOURCE_SHA" ]; then
              echo "::error title=Dev source advanced::origin/dev changed after the approved plan; run Workflow 10 again to use the new exact source."
              exit 1
            fi
          fi

          BUNDLE_BASE=$(git rev-parse "$RELEASE_COMMIT^")
          git checkout --detach "$RELEASE_COMMIT"
          git bundle create release-source.bundle HEAD "^$BUNDLE_BASE"
          git bundle verify release-source.bundle

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "base=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "existing_release=$EXISTING_RELEASE" >> "$GITHUB_OUTPUT"
          if [ "$EXISTING_RELEASE" = true ]; then
            echo "Prepared existing tagged source $RELEASE_VERSION at $RELEASE_COMMIT"
          elif [ "$RELEASE_MODE" = "Create release now" ]; then
            echo "Prepared exact origin/dev source $RELEASE_VERSION at $RELEASE_COMMIT"
          else
            echo "Prepared exact origin/dev source $RELEASE_VERSION at $RELEASE_COMMIT for BUILD ONLY"
          fi

      - name: Upload exact release source commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source-commit
          path: release-source.bundle
          if-no-files-found: error

  build-windows:
    name: Build Release — Windows
    needs: [resolve-plan, prepare-release]
    if: ${{ needs.resolve-plan.outputs.build_windows == 'true' }}
    runs-on: windows-latest
    env:
      # FULL SOURCE is clean; PARTIAL UPDATE reuses compiler state while still
      # emitting and auditing the complete Windows distributable.
      CARGO_INCREMENTAL: ${{ needs.resolve-plan.outputs.clean == 'true' && '0' || '1' }}

    steps:
      - name: Checkout release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-plan.outputs.release_confirmation == 'Create release now' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Download exact release source commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source-commit
          path: .release-source

      - name: Checkout exact untagged release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch .release-source/release-source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$WINDOWS_TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Calculate Windows dependency cache key
        id: windows-dependency-cache-key
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content -Raw -LiteralPath build/Windows/Cargo.lock
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "splined-windows"\r?\n)version = "[^"]+"'
          $normalized = [regex]::Replace($lock, $pattern, '${1}version = "<release>"')
          if ($normalized -eq $lock) {
            throw "Unable to normalize the release-only Windows package version for the dependency cache key."
          }
          $bytes = [Text.Encoding]::UTF8.GetBytes($normalized)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "hash=$hash" | Add-Content $env:GITHUB_OUTPUT

      - name: Restore Cargo dependency cache
        id: rust-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-${{ steps.windows-dependency-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-

      - name: Restore cached compiled Windows intermediates (fast mode only)
        if: ${{ needs.resolve-plan.outputs.clean != 'true' }}
        id: compiled-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/Windows/target/x86_64-pc-windows-msvc/release/deps
            build/Windows/target/x86_64-pc-windows-msvc/release/build
            build/Windows/target/x86_64-pc-windows-msvc/release/.fingerprint
            build/Windows/target/x86_64-pc-windows-msvc/release/incremental
            build/Windows/target/release/deps
            build/Windows/target/release/build
            build/Windows/target/release/.fingerprint
            build/Windows/target/release/incremental
          # A new source SHA/version saves updated compiler state under a new
          # immutable key; fallback restores the latest compatible build state.
          key: ${{ runner.os }}-splined-optimized-compiled-v2-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.windows-dependency-cache-key.outputs.hash }}-${{ github.sha }}-${{ needs.prepare-release.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-splined-optimized-compiled-v2-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.windows-dependency-cache-key.outputs.hash }}-

      - name: Restore previous compiled dependencies (v1 cache migration)
        if: ${{ needs.resolve-plan.outputs.clean != 'true' && steps.compiled-cache.outputs.cache-hit == '' }}
        id: legacy-compiled-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/Windows/target/x86_64-pc-windows-msvc/release/deps
            build/Windows/target/x86_64-pc-windows-msvc/release/build
            build/Windows/target/x86_64-pc-windows-msvc/release/.fingerprint
            build/Windows/target/release/deps
            build/Windows/target/release/build
            build/Windows/target/release/.fingerprint
          key: ${{ runner.os }}-splined-optimized-compiled-v1-${{ env.RUST_TOOLCHAIN }}-${{ env.WINDOWS_TARGET }}-${{ steps.windows-dependency-cache-key.outputs.hash }}

      - name: Build optimized x64 Rust/Slint executable (incremental or clean)
        id: windows-build
        shell: pwsh
        env:
          SPLINED_BUILD_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $started = Get-Date
          if ($env:CARGO_INCREMENTAL -eq "0") {
            # Strict mode: no compiled release cache; rebuild all release crates.
            cargo clean --manifest-path build/Windows/Cargo.toml --release --target $env:WINDOWS_TARGET
          } else {
            # Fast mode: Cargo fingerprints plus the version/commit inputs
            # invalidate changed application outputs; never reuse a stale EXE.
            Write-Host "Fast mode: reusing Cargo-validated release intermediates."
          }
          cargo build --locked --release --manifest-path build/Windows/Cargo.toml --target $env:WINDOWS_TARGET
          "elapsed_seconds=$([Math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_OUTPUT

      - name: Stage and audit portable Windows release
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_MODE: ${{ needs.resolve-plan.outputs.release_confirmation }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "build/Windows/target/$env:WINDOWS_TARGET/release"
          $portableRoot = "release-package/SPLINED"
          New-Item -ItemType Directory -Force -Path $portableRoot, release-assets | Out-Null
          Copy-Item "$releaseRoot/splined.exe" "$portableRoot/splined.exe"
          Copy-Item release/README-WINDOWS.txt "$portableRoot/README-WINDOWS.txt"

          function Assert-Amd64Pe([string]$path) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path).Path)
            if ($bytes.Length -lt 64) { throw "PE image is truncated: $path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) { throw "PE header is invalid: $path" }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw "PE signature is invalid: $path" }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) { throw ("Expected AMD64 PE Machine 0x8664 for {0}; found 0x{1:X4}." -f $path, $machine) }
          }
          Assert-Amd64Pe "$portableRoot/splined.exe"

          $buildInfoPath = Join-Path $env:RUNNER_TEMP "splined-build-info.json"
          $identity = Start-Process -FilePath (Resolve-Path "$portableRoot/splined.exe") -ArgumentList @("--write-build-info", $buildInfoPath) -Wait -PassThru
          if ($identity.ExitCode -ne 0) { throw "The Rust/Slint executable could not report its build identity." }
          $buildInfo = Get-Content -Raw -LiteralPath $buildInfoPath | ConvertFrom-Json
          if ($buildInfo.version -ne $env:RELEASE_VERSION) { throw "The Windows executable version does not match the release tag." }
          if ($buildInfo.commit -ne $env:RELEASE_COMMIT) { throw "The Windows executable commit does not match the release commit." }
          if ($buildInfo.architecture -ne "rust-slint") { throw "The Windows executable is not the Rust/Slint architecture." }

          $files = @(Get-ChildItem -LiteralPath $portableRoot -Recurse -File | ForEach-Object {
            $_.FullName.Substring((Resolve-Path $portableRoot).Path.Length + 1).Replace('\', '/')
          } | Sort-Object)
          $expected = @("README-WINDOWS.txt", "splined.exe")
          if (Compare-Object $files $expected) { throw "Portable package contents do not match the release allowlist." }
          if (Test-Path -LiteralPath "$portableRoot/data") { throw "A fresh portable package must not contain data/." }

          $smokeStateRoot = Join-Path $env:RUNNER_TEMP "splined-portable-smoke-state"
          New-Item -ItemType Directory -Force -Path $smokeStateRoot | Out-Null
          $priorStateRoot = $env:SPLINED_INTERNAL_STATE_ROOT
          $env:SPLINED_INTERNAL_STATE_ROOT = $smokeStateRoot
          try {
            $smoke = Start-Process -FilePath (Resolve-Path "$portableRoot/splined.exe") -ArgumentList "--native-smoke" -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          } finally {
            $env:SPLINED_INTERNAL_STATE_ROOT = $priorStateRoot
          }
          if ($smoke.ExitCode -ne 0) { throw "The clean portable Rust/Slint smoke test failed." }
          $unexpectedState = @("data", "_cache", "_logs", "credentials", "docker_builds") | Where-Object {
            Test-Path -LiteralPath (Join-Path $smokeStateRoot $_)
          }
          if ($unexpectedState) {
            throw "Clean first-run smoke created state before Setup Save: $($unexpectedState -join ', ')"
          }

          Compress-Archive -Path $portableRoot -DestinationPath "release-assets/splined-windows-x86_64.zip" -Force
          $archiveEntries = @(tar -tf release-assets/splined-windows-x86_64.zip | Where-Object { -not $_.EndsWith('/') } | Sort-Object)
          $expectedEntries = @("SPLINED/README-WINDOWS.txt", "SPLINED/splined.exe")
          if (Compare-Object $archiveEntries $expectedEntries) { throw "Portable archive contents do not match the release allowlist." }

          $manifest = [ordered]@{
            schema = 2
            channel = "stable"
            version = $env:RELEASE_VERSION
            commit = $env:RELEASE_COMMIT
            short_commit = $env:RELEASE_COMMIT.Substring(0, 7)
            published_at = [DateTime]::UtcNow.ToString("o")
            release_url = "https://github.com/scottia/S-P-L-I-N-E-D/releases/tag/$env:RELEASE_VERSION"
          }
          if ($env:RELEASE_MODE -eq "Stop - no release") {
            # A validation-only artifact must never advertise a nonexistent
            # public version as a stable user-facing update.
            $manifest.channel = "qa"
            $manifest.release_url = $null
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 release-assets/windows-update.json

      - name: Install pinned upstream WinAppCli for Store packaging
        if: ${{ needs.resolve-plan.outputs.store_draft == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $installRoot = Join-Path $env:RUNNER_TEMP "splined-winappcli"
          npm install --prefix $installRoot --no-save --no-audit --no-fund "@microsoft/winappcli@0.7.1"
          $commandDirectory = Join-Path $installRoot "node_modules\.bin"
          $commandDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $reportedVersion = (& (Join-Path $commandDirectory "winapp.cmd") --version) -join "`n"
          if ($reportedVersion -notmatch '0\.7\.1') {
            throw "The pinned WinAppCli installation did not report version 0.7.1."
          }

      - name: Build and strictly validate unsigned production Store MSIX from release binaries
        id: store-package
        if: ${{ needs.resolve-plan.outputs.store_draft == 'true' }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "build/Windows/target/$env:WINDOWS_TARGET/release"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "splined-store-artifact"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $storePackage = Join-Path $artifactRoot "SPLINED-x64-store-unsigned.msix"
          $result = & build/Windows/package/Build-StorePackage.ps1 `
            -ExecutablePath "$releaseRoot/splined.exe" `
            -ManifestPath build/Windows/package/Package.appxmanifest `
            -IconPath build/Windows/gui/splined-app-icon.png `
            -LayoutRoot (Join-Path $env:RUNNER_TEMP "splined-msix-store-layout") `
            -UnpackedRoot (Join-Path $env:RUNNER_TEMP "splined-msix-store-unpacked") `
            -OutputPath $storePackage `
            -ExpectedVersion "$env:RELEASE_VERSION.0"
          $result | Format-List | Out-String | Write-Host
          "path=$storePackage" | Add-Content $env:GITHUB_OUTPUT

      - name: Development-sign, install, activate, native-smoke, and uninstall isolated Store QA package
        if: ${{ needs.resolve-plan.outputs.store_draft == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "build/Windows/target/$env:WINDOWS_TARGET/release"
          & build/Windows/package/Test-DevelopmentPackage.ps1 `
            -ExecutablePath "$releaseRoot/splined.exe" `
            -ManifestPath build/Windows/package/Package.appxmanifest `
            -IconPath build/Windows/gui/splined-app-icon.png `
            -LayoutRoot (Join-Path $env:RUNNER_TEMP "splined-msix-development-layout")

      - name: Mark nonpublished Windows test artifacts explicitly
        if: ${{ needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' }}
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          "QA ONLY — NO GITHUB RELEASE OR STORE SUBMISSION. Temporary prepared commit: $env:SOURCE_COMMIT" |
            Set-Content -Encoding utf8 release-assets/QA-NOT-A-RELEASE.txt

      - name: Upload Windows portable release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-windows-x86_64
          path: |
            release-assets/splined-windows-x86_64.zip
            release-assets/windows-update.json
          if-no-files-found: error

      - name: Install and verify git-cliff 2.14.2 for Store fixture validation
        if: ${{ needs.resolve-plan.outputs.store_draft == 'true' && needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & release/Install-GitCliff.ps1 -InstallDirectory (Join-Path $env:RUNNER_TEMP "git-cliff-2.14.2")
          if (((git-cliff --version) -join "`n").Trim() -cne "git-cliff 2.14.2") {
            throw "The Store fixture validation engine must be git-cliff 2.14.2."
          }

      - name: Validate Store published-baseline logic against synthetic regression fixtures
        if: ${{ needs.resolve-plan.outputs.store_draft == 'true' && needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & release/Test-StoreBaseline.ps1 -RepositoryRoot .

      - name: Upload manual Store submission MSIX artifact
        if: ${{ needs.resolve-plan.outputs.store_draft == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-windows-store-package
          path: ${{ steps.store-package.outputs.path }}
          if-no-files-found: error

      - name: Report Windows build cache
        shell: pwsh
        run: |
          @"
          ## Windows release build

          - Downloaded Cargo cache hit: ``${{ steps.rust-cache.outputs.cache-hit }}``
          - Windows build mode: ``${{ needs.resolve-plan.outputs.clean == 'true' && 'FULL SOURCE - clean' || 'PARTIAL UPDATE - incremental' }}``
          - Compiled cache exact-key hit: ``${{ steps.compiled-cache.outputs.cache-hit }}`` (a prefix match can also restore cache)
          - Legacy v1 cache fallback hit: ``${{ steps.legacy-compiled-cache.outputs.cache-hit }}``
          - Rust toolchain: ``${{ env.RUST_TOOLCHAIN }}``
          - Rust incremental flag: ``$env:CARGO_INCREMENTAL``
          - Release build duration: ``${{ steps.windows-build.outputs.elapsed_seconds }} seconds``
          - Store package-only artifact: ``splined-windows-store-package``
          - Partner Center contact: ``false``; local review bundle: ``${{ needs.resolve-plan.outputs.store_draft }}``
          - Portable and Store outputs use the same release executable and Rust DLL build.
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  webgui-tests:
    name: Full WebGUI Python/PostgreSQL/Node validation
    needs: [resolve-plan, prepare-release]
    if: ${{ needs.resolve-plan.outputs.build_webgui == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splined_test
          POSTGRES_PASSWORD: splined_ci_only
          POSTGRES_DB: splined_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splined_test -d splined_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPLINED_TEST_DATABASE_URL: postgresql://splined_test:splined_ci_only@127.0.0.1:5432/splined_test
      PYTHONPATH: .:build/WEBGui:build/WEBGui/webgui/backend

    steps:
      - name: Checkout release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-plan.outputs.release_confirmation == 'Create release now' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Download exact release source commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source-commit
          path: .release-source

      - name: Checkout exact untagged release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch .release-source/release-source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install WebGUI test dependencies
        run: pip install -r build/WEBGui/webgui/requirements-test.txt

      - name: Validate Python/PostgreSQL WebGUI
        shell: bash
        run: |
          set -euo pipefail
          for test_path in build/WEBGui/webgui/tests/test_*.py; do
            test_name="$(basename "$test_path")"
            case "$test_name" in
              test_splined_compilation_authority_policy.py|test_audio_integrity.py|test_comp_job_scope.py|test_cross_format_cover_overwrite.py)
                continue
                ;;
            esac
            python -m unittest "$test_path" -v
          done

      - name: Validate browser JavaScript
        run: node --check build/WEBGui/webgui/static/app.js && node --check build/WEBGui/webgui/static/operations.js


  build-webgui:
    name: WebGUI production Docker and source-archive validation
    needs: [resolve-plan, prepare-release]
    if: ${{ needs.resolve-plan.outputs.build_webgui == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splined_test
          POSTGRES_PASSWORD: splined_ci_only
          POSTGRES_DB: splined_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splined_test -d splined_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPLINED_TEST_DATABASE_URL: postgresql://splined_test:splined_ci_only@127.0.0.1:5432/splined_test
      PYTHONPATH: .:build/WEBGui:build/WEBGui/webgui/backend

    steps:
      - name: Checkout release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-plan.outputs.release_confirmation == 'Create release now' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Download exact release source commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source-commit
          path: .release-source

      - name: Checkout exact untagged release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch .release-source/release-source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Build and smoke-test WebGUI container
        shell: bash
        env:
          COMPILE_MODE: ${{ needs.resolve-plan.outputs.compile_mode }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --name splined-workflow10 --use
          cache_args=(--cache-to type=gha,mode=max,scope=splined-workflow10-webgui)
          if [ "$COMPILE_MODE" = "FULL SOURCE" ]; then
            cache_args+=(--no-cache)
          else
            cache_args+=(--cache-from type=gha,scope=splined-workflow10-webgui)
          fi
          docker buildx build "${cache_args[@]}" --load \
            --build-arg SPLINED_BUILD_CHANNEL=release \
            --label "org.opencontainers.image.source=https://github.com/scottia/S-P-L-I-N-E-D" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --file build/WEBGui/Dockerfile --tag splined-webgui:release-test .
          docker run -d --name splined-webgui-release-test --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=splined_test -e PGPASSWORD=splined_ci_only \
            -e PGDATABASE=splined_test -e SPLINED_WEB_TOKEN=ci-browser-only \
            splined-webgui:release-test
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/status > /tmp/splined-status.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs splined-webgui-release-test
            exit 1
          fi
          python - <<'PY'
          import json
          status = json.load(open('/tmp/splined-status.json', encoding='utf-8'))
          assert status['database'] == 'PostgreSQL'
          assert status['database_ready'] is True
          assert status['auth_required'] is True
          PY
          mkdir -p release-assets
          docker save splined-webgui:release-test | gzip -9 > release-assets/splined-webgui-container-image.tar.gz

      - name: Report WebGUI container logs
        if: always()
        run: docker logs splined-webgui-release-test || true

      - name: Package WebGUI / Python release source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package/build release-assets
          cp -R build/WEBGui release-package/build/
          cp -R schema docs release-package/
          cp .dockerignore release-package/
          cp README.md LICENSE PRIVACY.md SECURITY.md SUPPORT.md release-package/
          tar -czf release-assets/splined-webgui-python.tar.gz -C release-package .

      - name: Upload WebGUI / Python artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-webgui-python
          path: release-assets/splined-webgui-python.tar.gz
          if-no-files-found: error

      - name: Upload exact smoke-tested WebGUI container image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-webgui-container-image
          path: release-assets/splined-webgui-container-image.tar.gz
          if-no-files-found: error

  finalize-tag:
    name: Tag exact selected dev source after successful builds
    needs:
      - resolve-plan
      - build-only-report
      - approve-plan
      - prepare-release
      - build-windows
      - build-webgui
      - webgui-tests
    if: >-
      ${{
        always() &&
        needs.resolve-plan.outputs.release_confirmation == 'Create release now' &&
        needs.prepare-release.outputs.existing_release != 'true' &&
        needs.prepare-release.result == 'success' &&
        (needs.resolve-plan.outputs.build_windows == 'true' && needs.build-windows.result == 'success' || needs.resolve-plan.outputs.build_windows == 'false' && needs.build-windows.result == 'skipped') &&
        (needs.resolve-plan.outputs.build_webgui == 'true' && needs.build-webgui.result == 'success' && needs.webgui-tests.result == 'success' || needs.resolve-plan.outputs.build_webgui == 'false' && needs.build-webgui.result == 'skipped' && needs.webgui-tests.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout workflow branch before loading exact dev source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact release source commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source-commit
          path: .release-source

      - name: Tag the unchanged selected dev commit
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.base }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin dev
          if [ "$(git rev-parse origin/dev)" != "$SOURCE_SHA" ]; then
            echo "ERROR: dev changed while selected builds were running; no tag was created. Run Workflow 10 again to use the new source."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "ERROR: Release tag already exists: $RELEASE_VERSION"
            exit 1
          fi
          git fetch .release-source/release-source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          test "$RELEASE_COMMIT" = "$SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" "$RELEASE_COMMIT" -m "S:P:L:I:N:E:D ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"
          test "$(git ls-remote origin "refs/tags/$RELEASE_VERSION^{}" | awk '{print $1}')" = "$RELEASE_COMMIT"
          test "$(git ls-remote origin "refs/heads/dev" | awk '{print $1}')" = "$SOURCE_SHA"

  generate-release-notes:
    name: Generate incremental GitHub release notes
    needs:
      - resolve-plan
      - prepare-release
      - build-windows
      - build-webgui
      - webgui-tests
      - finalize-tag
    if: >-
      ${{
        always() &&
        needs.prepare-release.result == 'success' &&
        (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
        (needs.build-webgui.result == 'success' || needs.build-webgui.result == 'skipped') &&
        (needs.webgui-tests.result == 'success' || needs.webgui-tests.result == 'skipped') &&
        (
          (needs.resolve-plan.outputs.release_confirmation == 'Create release now' && (
            needs.finalize-tag.result == 'success' ||
            (needs.prepare-release.outputs.existing_release == 'true' && needs.finalize-tag.result == 'skipped')
          )) ||
          (needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' && needs.finalize-tag.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag or validation-only source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-plan.outputs.release_confirmation == 'Create release now' && format('refs/tags/{0}', needs.prepare-release.outputs.version) || github.sha }}
          fetch-depth: 0

      - name: Download exact prepared source for validation-only notes
        if: ${{ needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source-commit
          path: .release-source

      - name: Create temporary local tag for release-note validation (never pushed)
        if: ${{ needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' && needs.prepare-release.outputs.existing_release != 'true' }}
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch .release-source/release-source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "::error title=Unexpected release tag::Validation-only tag must be unallocated."
            exit 1
          fi
          git tag "$RELEASE_VERSION" "$RELEASE_COMMIT"
          echo "Local tag $RELEASE_VERSION exists only in this disposable runner."

      - name: Checkout exact tagged source for an existing-version BUILD ONLY run
        if: ${{ needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' && needs.prepare-release.outputs.existing_release == 'true' }}
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch .release-source/release-source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"


      - name: Install and verify git-cliff 2.14.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & release/Install-GitCliff.ps1 -InstallDirectory (Join-Path $env:RUNNER_TEMP "git-cliff-2.14.2")
          $reportedVersion = (git-cliff --version) -join "`n"
          if ($reportedVersion.Trim() -cne "git-cliff 2.14.2") {
            throw "Expected git-cliff 2.14.2; received '$($reportedVersion.Trim())'."
          }

      - name: Verify WebGUI release-note classification
        shell: pwsh
        run: ./release/Test-ReleaseNoteClassification.ps1

      - name: Render incremental GitHub notes
        id: notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          & release/Generate-ReleaseNotes.ps1 `
            -Version $env:RELEASE_VERSION `
            -RepositoryRoot . `
            -ConfigPath release/cliff.toml `
            -GitHubTemplatePath release/templates/github-release.tera `
            -OutputDirectory release-notes

      - name: Upload generated release-note context and outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-release-notes
          path: |
            release-notes/release-context.json
            release-notes/GITHUB-RELEASE.md
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - resolve-plan
      - prepare-release
      - build-windows
      - build-webgui
      - finalize-tag
      - generate-release-notes
    if: >-
      ${{
        always() &&
        needs.resolve-plan.outputs.release_confirmation == 'Create release now' &&
        needs.prepare-release.result == 'success' &&
        (needs.finalize-tag.result == 'success' || (needs.prepare-release.outputs.existing_release == 'true' && needs.finalize-tag.result == 'skipped')) &&
        needs.generate-release-notes.result == 'success' &&
        (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
        (needs.build-webgui.result == 'success' || needs.build-webgui.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download generated release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-release-notes
          path: release-notes

      - name: Download Windows release assets
        if: ${{ needs.resolve-plan.outputs.build_windows == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-windows-x86_64
          path: release-assets

      - name: Download WebGUI / Python release asset
        if: ${{ needs.resolve-plan.outputs.build_webgui == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-webgui-python
          path: release-assets

      - name: Create a new release or add only its missing target outputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          EXISTING_RELEASE: ${{ needs.prepare-release.outputs.existing_release }}
          BUILD_WINDOWS: ${{ needs.resolve-plan.outputs.build_windows }}
          BUILD_WEBGUI: ${{ needs.resolve-plan.outputs.build_webgui }}
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t archives < <(find . -maxdepth 1 -type f \( -name 'splined-*.zip' -o -name 'splined-*.tar.gz' \) -printf '%f\n' | sort)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: No selected release-target archive was produced."
            exit 1
          fi
          release_files=("${archives[@]}")
          for metadata in windows-update.json; do
            if [ -f "$metadata" ]; then release_files+=("$metadata"); fi
          done
          if [ "$EXISTING_RELEASE" = true ]; then
            if [ "$BUILD_WINDOWS" = true ] && [ "$BUILD_WEBGUI" = false ]; then
              checksum_file=SHA256SUMS-WINDOWS.txt
            elif [ "$BUILD_WINDOWS" = false ] && [ "$BUILD_WEBGUI" = true ]; then
              checksum_file=SHA256SUMS-WEBGUI.txt
            else
              checksum_file=SHA256SUMS-COMPLETION.txt
            fi
            mapfile -t published < <(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for file in "${release_files[@]}" "$checksum_file"; do
              if printf '%s\n' "${published[@]}" | grep -qx "$file"; then
                echo "::error title=Refusing release-asset overwrite::$file already exists on release $RELEASE_VERSION."
                exit 1
              fi
            done
            sha256sum "${release_files[@]}" > "$checksum_file"
            gh release upload "$RELEASE_VERSION" \
              "${release_files[@]}" "$checksum_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            sha256sum "${release_files[@]}" > SHA256SUMS.txt
            gh release create "$RELEASE_VERSION" \
              "${release_files[@]}" \
              SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "S:P:L:I:N:E:D $RELEASE_VERSION" \
              --notes-file ../release-notes/GITHUB-RELEASE.md
          fi

  qa-artifacts:
    name: Validate and checksum selected artifacts without creating a release
    needs:
      - resolve-plan
      - prepare-release
      - build-windows
      - build-webgui
      - webgui-tests
      - generate-release-notes
    if: >-
      ${{
        always() &&
        needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' &&
        needs.prepare-release.result == 'success' &&
        needs.generate-release-notes.result == 'success' &&
        (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
        (needs.build-webgui.result == 'success' || needs.build-webgui.result == 'skipped') &&
        (needs.webgui-tests.result == 'success' || needs.webgui-tests.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download selected Windows portable artifacts
        if: ${{ needs.resolve-plan.outputs.build_windows == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-windows-x86_64
          path: release-assets
      - name: Download selected WebGUI source archive
        if: ${{ needs.resolve-plan.outputs.build_webgui == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-webgui-python
          path: release-assets
      - name: Download generated release-note preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-release-notes
          path: release-notes
      - name: Verify staged release-equivalent files and generate QA-only checksums
        shell: bash
        env:
          PREPARED_VERSION: ${{ needs.prepare-release.outputs.version }}
          PREPARED_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          BUILD_WINDOWS: ${{ needs.resolve-plan.outputs.build_windows }}
          BUILD_WEBGUI: ${{ needs.resolve-plan.outputs.build_webgui }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f \
            \( -name 'splined-*.zip' -o -name 'splined-*.tar.gz' \) -printf '%f\n' | sort)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error title=Missing QA artifacts::No selected target archive was produced."
            exit 1
          fi
          if [ "$BUILD_WINDOWS" = true ]; then
            test -f release-assets/splined-windows-x86_64.zip
            test -f release-assets/windows-update.json
          fi
          if [ "$BUILD_WEBGUI" = true ]; then
            test -f release-assets/splined-webgui-python.tar.gz
          fi
          test -s release-notes/GITHUB-RELEASE.md
          test -s release-notes/release-context.json
          (
            cd release-assets
            sha256sum "${archives[@]}" > SHA256SUMS.txt
            if [ -f windows-update.json ]; then sha256sum windows-update.json >> SHA256SUMS.txt; fi
            sha256sum -c SHA256SUMS.txt
          )
          {
            echo "QA ONLY — NO RELEASE CREATED"
            echo "Version candidate: $PREPARED_VERSION"
            echo "Exact source commit: $PREPARED_COMMIT"
            echo "No remote branch, tag, Release, GHCR or Store change."
          } > release-assets/QA-NOT-A-RELEASE.txt
          cp release-notes/GITHUB-RELEASE.md release-assets/GITHUB-RELEASE-PREVIEW.md
      - name: Upload checksum-verified QA-only release-equivalent artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-validation-only-assets
          path: release-assets/
          if-no-files-found: error

  qa-ghcr-build:
    name: Validate release-channel GHCR image locally, never push
    needs: [resolve-plan, prepare-release, build-webgui]
    if: ${{ needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' && needs.resolve-plan.outputs.build_webgui == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download exact smoke-tested container image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-webgui-container-image
          path: container-image
      - name: Load and inspect the smoke-tested image without registry push
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          gzip -dc container-image/splined-webgui-container-image.tar.gz | docker load
          actual_version=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' splined-webgui:release-test)
          actual_revision=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' splined-webgui:release-test)
          test "$actual_version" = "$RELEASE_VERSION"
          test "$actual_revision" = "$RELEASE_COMMIT"
          {
            echo "## GHCR release-channel build validated locally"
            echo "- Version: $RELEASE_VERSION"
            echo "- Revision: $RELEASE_COMMIT"
            echo "- Registry login and push: NOT RUN"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-ghcr:
    name: Publish GHCR
    needs:
      - resolve-plan
      - prepare-release
      - build-webgui
      - publish-release
    if: >-
      ${{
        always() &&
        needs.resolve-plan.outputs.release_confirmation == 'Create release now' &&
        needs.resolve-plan.outputs.publish_ghcr == 'true' &&
        needs.prepare-release.result == 'success' &&
        needs.publish-release.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/scottia/splined
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}

    steps:
      - name: Download exact smoke-tested container image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-webgui-container-image
          path: container-image

      - name: Load and tag the exact smoke-tested image
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc container-image/splined-webgui-container-image.tar.gz | docker load
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' splined-webgui:release-test)" = "$RELEASE_VERSION"
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' splined-webgui:release-test)" = "${{ needs.prepare-release.outputs.commit }}"
          docker tag splined-webgui:release-test "$IMAGE_NAME:v${RELEASE_VERSION}"
          docker tag splined-webgui:release-test "$IMAGE_NAME:latest"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push version and latest image tags
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          if docker pull "$IMAGE_NAME:v${RELEASE_VERSION}" >/dev/null 2>&1; then
            existing_revision=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_NAME:v${RELEASE_VERSION}")
            if [ "$existing_revision" != "$RELEASE_COMMIT" ]; then
              echo "::error title=Refusing GHCR overwrite::v${RELEASE_VERSION} already identifies revision $existing_revision, not $RELEASE_COMMIT."
              exit 1
            fi
            echo "GHCR v${RELEASE_VERSION} already contains the exact release revision; no version tag was overwritten."
          else
            docker push "$IMAGE_NAME:v${RELEASE_VERSION}"
          fi
          docker push "$IMAGE_NAME:latest"

  publish-store:
    name: Prepare local Microsoft Store review bundle
    needs:
      - resolve-plan
      - prepare-release
      - generate-release-notes
      - publish-release
    if: >-
      ${{
        always() &&
        needs.resolve-plan.outputs.release_confirmation == 'Create release now' &&
        needs.resolve-plan.outputs.store_draft == 'true' &&
        needs.resolve-plan.outputs.build_windows == 'true' &&
        needs.prepare-release.result == 'success' &&
        needs.generate-release-notes.result == 'success' &&
        needs.publish-release.result == 'success'
      }}
    runs-on: windows-latest
    concurrency:
      group: splined-microsoft-store-submission
      cancel-in-progress: false

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}
          fetch-depth: 0

      - name: Download exact Store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-windows-store-package
          path: store-package

      - name: Download generated release context for local review
        if: ${{ needs.resolve-plan.outputs.store_draft == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-release-notes
          path: release-notes

      - name: Install and verify git-cliff 2.14.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & release/Install-GitCliff.ps1 -InstallDirectory (Join-Path $env:RUNNER_TEMP "git-cliff-2.14.2")
          if (((git-cliff --version) -join "`n").Trim() -cne "git-cliff 2.14.2") {
            throw "The release-note engine must be git-cliff 2.14.2."
          }

      - name: Test local-only Store review bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & release/Test-LocalStoreReviewBundle.ps1 -RepositoryRoot .

      - name: Render local-only Store review files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          $ErrorActionPreference = "Stop"
          [IO.Directory]::CreateDirectory("store-notes") | Out-Null
          & git-cliff `
            --config release/cliff.toml `
            --from-context release-notes/release-context.json `
            --body-file release/templates/store-highlights.tera `
            --strip all `
            --output store-notes/STORE-HIGHLIGHTS.txt
          & release/New-LocalStoreReviewBundle.ps1 `
            -PackagePath store-package/SPLINED-x64-store-unsigned.msix `
            -HighlightsPath store-notes/STORE-HIGHLIGHTS.txt `
            -ReleaseContextPath release-notes/release-context.json `
            -TargetVersion $env:RELEASE_VERSION `
            -TargetCommit $env:RELEASE_COMMIT `
            -OutputDirectory store-submission

      - name: Upload Store submission audit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-windows-store-submission
          path: store-submission/
          if-no-files-found: error

  submit-store:
    name: Submit validated Microsoft Store update
    needs:
      - resolve-plan
      - prepare-release
      - generate-release-notes
      - publish-release
      - publish-store
    if: >-
      ${{
        always() &&
        needs.resolve-plan.outputs.release_confirmation == 'Create release now' &&
        needs.resolve-plan.outputs.store_submit == 'true' &&
        needs.resolve-plan.outputs.build_windows == 'true' &&
        needs.prepare-release.result == 'success' &&
        needs.generate-release-notes.result == 'success' &&
        needs.publish-release.result == 'success' &&
        needs.publish-store.result == 'success'
      }}
    runs-on: windows-latest
    concurrency:
      group: splined-microsoft-store-submission
      cancel-in-progress: false

    steps:
      - name: Checkout generated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.version }}
          fetch-depth: 0

      - name: Download exact Store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-windows-store-package
          path: store-package

      - name: Require Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("AZURE_AD_APPLICATION_CLIENT_ID", "AZURE_AD_APPLICATION_SECRET", "AZURE_AD_TENANT_ID", "SELLER_ID")) {
            if ([String]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Microsoft Store publishing credential is unavailable: $name"
            }
          }

      - name: Install pinned Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3

      - name: Install and verify git-cliff 2.14.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & release/Install-GitCliff.ps1 -InstallDirectory (Join-Path $env:RUNNER_TEMP "git-cliff-2.14.2")
          if (((git-cliff --version) -join "`n").Trim() -cne "git-cliff 2.14.2") {
            throw "The release-note engine must be git-cliff 2.14.2."
          }

      - name: Test Store history baseline resolution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & release/Test-StoreBaseline.ps1 -RepositoryRoot .

      - name: Authenticate Microsoft Store before resolving published history
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET

      - name: Resolve last-published Store baseline
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          & release/Resolve-StoreBaseline.ps1 `
            -TargetVersion $env:RELEASE_VERSION `
            -RepositoryRoot . `
            -ProductId 9P8G4GMBBVBS `
            -OutputDirectory store-notes

      - name: Render cumulative Store Highlights from published baseline
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          & release/Generate-StoreHighlights.ps1 `
            -Version $env:RELEASE_VERSION `
            -BaselineMetadataPath store-notes/STORE-BASELINE.json `
            -RepositoryRoot . `
            -ConfigPath release/cliff.toml `
            -StoreTemplatePath release/templates/store-highlights.tera `
            -OutputDirectory store-notes

      - name: Assemble automatic Store submission audit artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [IO.Directory]::CreateDirectory("store-auto-submission") | Out-Null
          Copy-Item -LiteralPath "store-package/SPLINED-x64-store-unsigned.msix" -Destination "store-auto-submission/SPLINED-x64-store-unsigned.msix"
          Copy-Item -LiteralPath "store-notes/STORE-HIGHLIGHTS.txt" -Destination "store-auto-submission/STORE-HIGHLIGHTS.txt"
          Copy-Item -LiteralPath "store-notes/STORE-SUBMISSION.json" -Destination "store-auto-submission/STORE-SUBMISSION.json"

      - name: Upload automatic Store submission audit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-windows-store-auto-submission
          path: store-auto-submission/
          if-no-files-found: error

      - name: Stage package and Highlights and submit for certification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & build/Windows/package/Publish-StoreUpdate.ps1 `
            -PackagePath store-auto-submission/SPLINED-x64-store-unsigned.msix `
            -HighlightsPath store-auto-submission/STORE-HIGHLIGHTS.txt `
            -BaselineMetadataPath store-auto-submission/STORE-SUBMISSION.json `
            -ExpectedVersion ${{ needs.prepare-release.outputs.version }} `
            -ProductId 9P8G4GMBBVBS

  release-summary:
    name: Release or validation-only summary
    needs:
      - resolve-plan
      - build-only-report
      - approve-plan
      - prepare-release
      - build-windows
      - build-webgui
      - finalize-tag
      - generate-release-notes
      - publish-release
      - publish-ghcr
      - publish-store
      - submit-store
      - webgui-tests
      - qa-artifacts
      - qa-ghcr-build
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Report plan rejection or missing approval
        if: ${{ needs.resolve-plan.outputs.report_only != 'true' && needs.approve-plan.result != 'success' }}
        shell: bash
        run: |
          {
            echo "## Workflow 10 stopped before build"
            echo
            echo "The protected plan approval was rejected or did not complete."
            echo "No validation, compilation, tagging or publication work was authorized."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Complete report-only outcome without build or publication
        if: ${{ needs.resolve-plan.outputs.report_only == 'true' }}
        shell: bash
        env:
          REPORT_RESULT: ${{ needs.build-only-report.result }}
        run: |
          set -euo pipefail
          if [ "$REPORT_RESULT" != success ]; then
            echo "::error title=BUILD ONLY, REPORT failed::The audit job concluded '$REPORT_RESULT'."
            exit 1
          fi
          {
            echo "## Workflow 10 BUILD ONLY, REPORT complete"
            echo
            echo "The source/version, target, policy and credential audit passed."
            echo "Compilation, packaging, plan approval, branch writes, PRs, tags, Releases, GHCR and Store actions were not run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce selected build and publication results
        if: ${{ needs.approve-plan.result == 'success' && needs.resolve-plan.outputs.release_confirmation == 'Create release now' }}
        shell: bash
        env:
          BUILD_WINDOWS: ${{ needs.resolve-plan.outputs.build_windows }}
          BUILD_WEBGUI: ${{ needs.resolve-plan.outputs.build_webgui }}
          EXISTING_RELEASE: ${{ needs.prepare-release.outputs.existing_release }}
          STORE_DRAFT: ${{ needs.resolve-plan.outputs.store_draft }}
          STORE_SUBMIT: ${{ needs.resolve-plan.outputs.store_submit }}
          PUBLISH_GHCR: ${{ needs.resolve-plan.outputs.publish_ghcr }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          WEBGUI_RESULT: ${{ needs.build-webgui.result }}
          WEBGUI_TEST_RESULT: ${{ needs.webgui-tests.result }}
          QA_ASSETS_RESULT: ${{ needs.qa-artifacts.result }}
          QA_GHCR_RESULT: ${{ needs.qa-ghcr-build.result }}
          TAG_RESULT: ${{ needs.finalize-tag.result }}
          NOTES_RESULT: ${{ needs.generate-release-notes.result }}
          GITHUB_RELEASE_RESULT: ${{ needs.publish-release.result }}
          GHCR_RESULT: ${{ needs.publish-ghcr.result }}
          STORE_RESULT: ${{ needs.publish-store.result }}
          STORE_SUBMIT_RESULT: ${{ needs.submit-store.result }}
        run: |
          set -euo pipefail
          failures=0

          expect_result() {
            local stage="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error title=Unexpected release stage result::$stage was '$actual'; expected '$expected'."
              failures=1
            fi
          }

          expect_result "Prepare release" "$PREPARE_RESULT" success
          expect_result "Validation-only artifacts" "$QA_ASSETS_RESULT" skipped
          expect_result "Validation-only GHCR build" "$QA_GHCR_RESULT" skipped
          if [ "$BUILD_WINDOWS" = true ]; then
            expect_result "Windows build" "$WINDOWS_RESULT" success
          else
            expect_result "Windows build" "$WINDOWS_RESULT" skipped
          fi
          if [ "$BUILD_WEBGUI" = true ]; then
            expect_result "WebGUI / Python validation" "$WEBGUI_RESULT" success
            expect_result "WebGUI Python/PostgreSQL tests" "$WEBGUI_TEST_RESULT" success
          else
            expect_result "WebGUI / Python validation" "$WEBGUI_RESULT" skipped
            expect_result "WebGUI Python/PostgreSQL tests" "$WEBGUI_TEST_RESULT" skipped
          fi

          if [ "$EXISTING_RELEASE" = true ]; then
            expect_result "Existing numeric tag" "$TAG_RESULT" skipped
          else
            expect_result "Numeric tag" "$TAG_RESULT" success
          fi
          expect_result "git-cliff release notes" "$NOTES_RESULT" success
          expect_result "GitHub Release" "$GITHUB_RELEASE_RESULT" success
          if [ "$PUBLISH_GHCR" = true ]; then
            expect_result "GHCR publication" "$GHCR_RESULT" success
          else
            expect_result "GHCR publication" "$GHCR_RESULT" skipped
          fi

          if [ "$BUILD_WINDOWS" = true ] && [ "$STORE_DRAFT" = true ]; then
            expect_result "Microsoft Store selected mode" "$STORE_RESULT" success
          else
            expect_result "Microsoft Store selected mode" "$STORE_RESULT" skipped
          fi
          if [ "$STORE_SUBMIT" = true ]; then
            expect_result "Microsoft Store automatic submission" "$STORE_SUBMIT_RESULT" success
          else
            expect_result "Microsoft Store automatic submission" "$STORE_SUBMIT_RESULT" skipped
          fi

          if [ "$failures" -ne 0 ]; then
            {
              echo "## SPLINED release incomplete"
              echo
              echo "One or more required build/publication stages failed or were unexpectedly skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Report published outputs
        if: ${{ needs.approve-plan.result == 'success' && needs.resolve-plan.outputs.release_confirmation == 'Create release now' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          {
            echo "## SPLINED release complete"
            echo
            echo "- Version and Git tag: \`$RELEASE_VERSION\`"
            echo "- Selected release target: \`${{ needs.resolve-plan.outputs.platform }}\`"
            echo "- Existing release completion: \`${{ needs.prepare-release.outputs.existing_release }}\`"
            echo "- GitHub Release: created or completed without overwriting an existing target asset"
            if [ "${{ needs.resolve-plan.outputs.publish_ghcr }}" = true ]; then
              echo "- GHCR: \`ghcr.io/scottia/splined:v$RELEASE_VERSION\`"
              echo "- GHCR latest: \`ghcr.io/scottia/splined:latest\`"
            else
              echo "- GHCR: not published by the selected preset"
            fi
            echo "- Partner Center AUTO SUBMIT: \`${{ needs.resolve-plan.outputs.store_submit }}\`; local review bundle: \`${{ needs.resolve-plan.outputs.store_draft }}\`"
            if [ "${{ needs.publish-store.result }}" = "success" ]; then
              echo "- Microsoft Store: local MSIX review ZIP retained"
            elif [ "${{ needs.resolve-plan.outputs.store_draft }}" = true ]; then
              echo "- Microsoft Store: requested review bundle was not created"
            else
              echo "- Microsoft Store: not run (disabled or no Windows target selected)"
            fi
            if [ "${{ needs.submit-store.result }}" = "success" ]; then
              echo "- Microsoft Store: validated package and Highlights submitted for certification"
            elif [ "${{ needs.resolve-plan.outputs.store_submit }}" = true ]; then
              echo "- Microsoft Store: requested automatic submission did not complete"
            else
              echo "- Microsoft Store: Partner Center was not contacted"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require validation-only build and archive results and confirm no publications
        if: ${{ needs.approve-plan.result == 'success' && needs.resolve-plan.outputs.release_confirmation == 'Stop - no release' && needs.resolve-plan.outputs.report_only != 'true' }}
        shell: bash
        env:
          BUILD_WINDOWS: ${{ needs.resolve-plan.outputs.build_windows }}
          BUILD_WEBGUI: ${{ needs.resolve-plan.outputs.build_webgui }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          WEBGUI_RESULT: ${{ needs.build-webgui.result }}
          WEBGUI_TEST_RESULT: ${{ needs.webgui-tests.result }}
          TAG_RESULT: ${{ needs.finalize-tag.result }}
          NOTES_RESULT: ${{ needs.generate-release-notes.result }}
          QA_RESULT: ${{ needs.qa-artifacts.result }}
          QA_GHCR_RESULT: ${{ needs.qa-ghcr-build.result }}
          RELEASE_RESULT: ${{ needs.publish-release.result }}
          GHCR_RESULT: ${{ needs.publish-ghcr.result }}
          STORE_RESULT: ${{ needs.publish-store.result }}
          STORE_SUBMIT_RESULT: ${{ needs.submit-store.result }}
        run: |
          set -euo pipefail
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error title=Unexpected validation-only result::$1 was '$2'; expected '$3'."
              exit 1
            fi
          }
          check "Temporary candidate preparation" "$PREPARE_RESULT" success
          check "Release notes preview" "$NOTES_RESULT" success
          check "QA-only checksum and artifacts" "$QA_RESULT" success
          if [ "$BUILD_WEBGUI" = true ]; then
            check "Local release-channel GHCR image build" "$QA_GHCR_RESULT" success
          else
            check "Local release-channel GHCR image build" "$QA_GHCR_RESULT" skipped
          fi
          check "Published tag" "$TAG_RESULT" skipped
          check "GitHub Release" "$RELEASE_RESULT" skipped
          check "GHCR publish" "$GHCR_RESULT" skipped
          check "Store submission" "$STORE_RESULT" skipped
          check "Automatic Store submission" "$STORE_SUBMIT_RESULT" skipped
          if [ "$BUILD_WINDOWS" = true ]; then
            check "Windows build" "$WINDOWS_RESULT" success
          else
            check "Windows build" "$WINDOWS_RESULT" skipped
          fi
          if [ "$BUILD_WEBGUI" = true ]; then
            check "WebGUI package" "$WEBGUI_RESULT" success
            check "WebGUI tests" "$WEBGUI_TEST_RESULT" success
          else
            check "WebGUI package" "$WEBGUI_RESULT" skipped
            check "WebGUI tests" "$WEBGUI_TEST_RESULT" skipped
          fi
          {
            echo "## Workflow 10 BUILD ONLY, REPORT complete — NO RELEASE"
            echo "- Exact selected origin/dev source was compiled without a source or branch mutation"
            echo "- All selected build, policy, test, package and artifact checks passed"
            echo "- QA-only checksum artifacts: splined-validation-only-assets"
            echo "- Branch commits, published tags, GitHub Releases, GHCR, Store: NONE"
          } >> "$GITHUB_STEP_SUMMARY"
