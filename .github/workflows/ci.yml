name: SPLINED CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-rust:
    name: Native Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore native Rust cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Validate formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  windows-gui:
    name: Windows GUI
    runs-on: windows-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore Windows Rust cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: ci-windows-${{ runner.os }}-${{ hashFiles('windows/Cargo.lock') }}
      - name: Validate formatting
        run: cargo fmt --manifest-path windows/Cargo.toml --all -- --check
      - name: Check
        run: cargo check --manifest-path windows/Cargo.toml --locked
      - name: Test
        run: cargo test --manifest-path windows/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path windows/Cargo.toml --locked -- -D warnings

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore Python package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ci-python-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}
      - name: Install locked runtime dependencies
        run: python -m pip install --disable-pip-version-check -r python/requirements.txt
      - name: Compile modules
        run: python -m py_compile python/splined.py python/splined_scan.py python/splined_oauth_validation.py
      - name: Run tests
        run: python -m unittest discover -s python -p 'test_*.py'
      - name: Build container
        run: docker build --pull=false --tag splined-ci:${{ github.sha }} python
