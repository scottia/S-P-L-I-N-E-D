name: SPLINED Published > GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing numeric release version to publish to GHCR (example: 1.0.9)"
        required: true
        default: "1.0.9"
        type: string

permissions:
  contents: read

concurrency:
  group: splined-ghcr-existing-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-ghcr:
    name: Publish Existing Release to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/scottia/splined
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Validate release version input
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must be numeric SemVer, for example 1.0.9"
            exit 1
          fi

          echo "Existing release requested: $RELEASE_VERSION"

      - name: Checkout entered release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      - name: Restore 1.0.28 Docker build context
        if: ${{ inputs.version == '1.0.28' }}
        shell: bash
        run: |
          set -euo pipefail

          test -f python/test_splined_scan_lazy_batch.py
          if ! grep -Fxq '!test_splined_scan_lazy_batch.py' python/.dockerignore; then
            printf '\n!test_splined_scan_lazy_batch.py\n' >> python/.dockerignore
          fi

          grep -Fx '!test_splined_scan_lazy_batch.py' python/.dockerignore
          echo "PASS: 1.0.28 Docker build context restored"

      - name: Build exact release Docker image
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_COMMIT=$(git rev-parse HEAD)
          VERSION_TAG="v${RELEASE_VERSION}"

          docker build --pull \
            --build-arg SPLINED_BUILD_CHANNEL=release \
            --label "org.opencontainers.image.source=https://github.com/scottia/S-P-L-I-N-E-D" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --tag "$IMAGE_NAME:$VERSION_TAG" \
            --tag "$IMAGE_NAME:latest" \
            ./python

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Publish version and latest tags
        shell: bash
        run: |
          set -euo pipefail

          VERSION_TAG="v${RELEASE_VERSION}"

          echo "Publishing:"
          echo "  $IMAGE_NAME:$VERSION_TAG"
          echo "  $IMAGE_NAME:latest"

          docker push "$IMAGE_NAME:$VERSION_TAG"
          docker push "$IMAGE_NAME:latest"

      - name: GHCR publication summary
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_COMMIT=$(git rev-parse HEAD)

          {
            echo "## SPLINED existing release published to GHCR"
            echo
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Release commit: \`$RELEASE_COMMIT\`"
            echo "- Existing Git tag: \`$RELEASE_VERSION\`"
            echo "- GHCR version tag: \`$IMAGE_NAME:v$RELEASE_VERSION\`"
            echo "- GHCR latest tag: \`$IMAGE_NAME:latest\`"
            echo "- Config schema: \`5\`"
            echo "- Branches modified: \`no\`"
            echo "- Release created: \`no\`"
            echo "- Tag created: \`no\`"
          } >> "$GITHUB_STEP_SUMMARY"
