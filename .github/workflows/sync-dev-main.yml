name: Sync dev and main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: splined-sync-dev-main
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize equivalent dev/main tips
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Align equivalent branch tips
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/dev:refs/remotes/origin/dev"

          MAIN_SHA=$(git rev-parse origin/main)
          DEV_SHA=$(git rev-parse origin/dev)

          if [ "$MAIN_SHA" = "$DEV_SHA" ]; then
            echo "dev and main already point to $MAIN_SHA"
            exit 0
          fi

          MAIN_TREE=$(git rev-parse "origin/main^{tree}")
          DEV_TREE=$(git rev-parse "origin/dev^{tree}")

          if [ "$MAIN_TREE" != "$DEV_TREE" ]; then
            echo "dev and main contain different source trees; automatic synchronization is intentionally skipped."
            echo "main: $MAIN_SHA ($MAIN_TREE)"
            echo "dev:  $DEV_SHA ($DEV_TREE)"
            exit 0
          fi

          echo "dev and main contain identical source trees but have different commit IDs."
          echo "Creating one history-preserving synchronization commit with both tips as parents."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync-main origin/main
          git merge --no-ff --no-edit origin/dev \
            -m "chore: synchronize dev and main [skip ci]"

          SYNC_SHA=$(git rev-parse HEAD)
          SYNC_TREE=$(git rev-parse "HEAD^{tree}")
          test "$SYNC_TREE" = "$MAIN_TREE"

          git push origin \
            "$SYNC_SHA:refs/heads/main" \
            "$SYNC_SHA:refs/heads/dev"

          echo "Synchronized dev and main at $SYNC_SHA"
