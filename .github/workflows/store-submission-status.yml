name: 01. Store - Check Status (Read-only)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/store-submission-status.yml
  workflow_dispatch:
    inputs:
      run_note:
        description: "READ-ONLY: shows the current SPLINED Partner Center submission state. Risk: no Store package, listing, or submission changes."
        required: false
        default: "Check status only"
        type: choice
        options:
          - "Check status only"

permissions:
  contents: read

jobs:
  status:
    name: Read Partner Center submission state
    runs-on: windows-latest
    steps:
      - name: Install pinned Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3

      - name: Authenticate and read SPLINED submission status
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @("AZURE_AD_APPLICATION_CLIENT_ID", "AZURE_AD_APPLICATION_SECRET", "AZURE_AD_TENANT_ID", "SELLER_ID")) {
            if ([String]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Microsoft Store credential is unavailable: $name"
            }
          }
          & msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          $application = ((& msstore apps get 9P8G4GMBBVBS) -join "`n") | ConvertFrom-Json
          $pendingId = [string]$application.pendingApplicationSubmission.id
          $publishedId = [string]$application.lastPublishedApplicationSubmission.id
          if ([String]::IsNullOrWhiteSpace($pendingId)) { $pendingId = "none" }
          if ([String]::IsNullOrWhiteSpace($publishedId)) { $publishedId = "none" }
          Write-Output "Pending submission ID: $pendingId"
          Write-Output "Last published submission ID: $publishedId"
          $status = ((& msstore submission status 9P8G4GMBBVBS) -join "`n").Trim()
          if ([String]::IsNullOrWhiteSpace($status)) { $status = "unavailable" }
          Write-Output "Submission status: $status"
