name: TEMP embedded candidate validation

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r python/requirements.txt
      - run: python -m py_compile python/splined_ranking_policy.py python/test_candidate_ranking_policy.py
      - working-directory: python
        run: python -m unittest -v test_candidate_ranking_policy.py
