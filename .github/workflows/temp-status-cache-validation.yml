name: TEMP status cache validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r python/requirements.txt
      - run: python -m py_compile python/splined_status_cache.py python/test_status_cache.py
      - working-directory: python
        run: python -m unittest -v test_status_cache.py
