name: TEMP status cache optimization validation
on:
  push:
    branches:
      - dev
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r python/requirements.txt
      - run: python -m py_compile python/splined_status_cache.py python/test_status_cache.py
      - working-directory: python
        run: python -m unittest -v test_status_cache.py
