name: Windows Store Package Validation

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "windows/package/**"
      - "windows/gui/**"
      - "windows/src/**"
      - "windows/Cargo.toml"
      - "windows/Cargo.lock"
      - ".github/workflows/windows-store-validation.yml"
      - ".github/workflows/release-next-patch.yml"

permissions:
  contents: read

concurrency:
  group: windows-store-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  WINDOWS_TARGET: "x86_64-pc-windows-msvc"

jobs:
  validate-store-package:
    name: Pack production Store MSIX and smoke-test development copy
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$WINDOWS_TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Restore Cargo dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-windows-store-v1-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-store-v1-${{ env.RUST_TOOLCHAIN }}-
            ${{ runner.os }}-splined-windows-dependencies-v2-${{ env.RUST_TOOLCHAIN }}-

      - name: Install pinned upstream WinAppCli
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $installRoot = Join-Path $env:RUNNER_TEMP "splined-winappcli"
          npm install --prefix $installRoot --no-save --no-audit --no-fund "@microsoft/winappcli@0.7.1"
          $commandDirectory = Join-Path $installRoot "node_modules\.bin"
          $commandDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $reportedVersion = (& (Join-Path $commandDirectory "winapp.cmd") --version) -join "`n"
          if ($reportedVersion -notmatch '0\.7\.1') {
            throw "The pinned WinAppCli installation did not report version 0.7.1."
          }

      - name: Build clean x64 WinForms and Rust DLL pair
        shell: pwsh
        env:
          SPLINED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "windows/target/$env:WINDOWS_TARGET/release"
          if (Test-Path -LiteralPath $releaseRoot) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }
          $env:SPLINED_BUILD_GUI = "1"
          cargo build --locked --release --manifest-path windows/Cargo.toml --target $env:WINDOWS_TARGET

      - name: Pack and read back production Store identity
        id: store-package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "windows/target/$env:WINDOWS_TARGET/release"
          $versionLine = Get-Content -LiteralPath windows/Cargo.toml | Where-Object { $_ -match '^version\s*=\s*"' } | Select-Object -First 1
          if ($versionLine -notmatch '"(\d+\.\d+\.\d+)"') {
            throw "Unable to read the Windows package version."
          }
          $expectedVersion = "$($Matches[1]).0"
          $storePackage = Join-Path $env:RUNNER_TEMP "SPLINED-x64-store-unsigned.msix"
          $result = & windows/package/Build-StorePackage.ps1 `
            -ExecutablePath "$releaseRoot/splined.exe" `
            -CoreDllPath "$releaseRoot/splined_core.dll" `
            -ManifestPath windows/package/Package.appxmanifest `
            -IconPath windows/gui/splined-app-icon.png `
            -LayoutRoot (Join-Path $env:RUNNER_TEMP "splined-msix-store-layout") `
            -UnpackedRoot (Join-Path $env:RUNNER_TEMP "splined-msix-store-unpacked") `
            -OutputPath $storePackage `
            -ExpectedVersion $expectedVersion
          $result | Format-List | Out-String | Write-Host
          "path=$storePackage" | Add-Content $env:GITHUB_OUTPUT
          "version=$expectedVersion" | Add-Content $env:GITHUB_OUTPUT

      - name: Development-sign, install, activate, and uninstall isolated QA package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseRoot = "windows/target/$env:WINDOWS_TARGET/release"
          & windows/package/Test-DevelopmentPackage.ps1 `
            -ExecutablePath "$releaseRoot/splined.exe" `
            -CoreDllPath "$releaseRoot/splined_core.dll" `
            -ManifestPath windows/package/Package.appxmanifest `
            -IconPath windows/gui/splined-app-icon.png `
            -LayoutRoot (Join-Path $env:RUNNER_TEMP "splined-msix-development-layout")

      - name: Upload Partner Center Store submission artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-windows-store-submission
          path: ${{ steps.store-package.outputs.path }}
          if-no-files-found: error

      - name: Report validated Store identity
        shell: pwsh
        run: |
          @"
          ## Microsoft Store package validation

          - Artifact: ``splined-windows-store-submission/SPLINED-x64-store-unsigned.msix``
          - Identity: ``Psycotix.SPLINED``
          - Publisher: ``CN=FE370EF6-D95D-4A6F-9AAB-2654E6DE00FE``
          - Publisher display name: ``Psycotix``
          - Display name: ``SPLINED``
          - PFN: ``Psycotix.SPLINED_8pvn5te36e43t``
          - Store ID: ``9P8G4GMBBVBS``
          - Version: ``${{ steps.store-package.outputs.version }}``
          - Architecture: ``x64``
          - Production signing: unsigned for Partner Center
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

