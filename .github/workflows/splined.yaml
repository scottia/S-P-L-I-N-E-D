name: SPLINED CI and Release

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing numeric release tag to build, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: splined-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate — ${{ matrix.name }}
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') == false)
      }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux / Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require committed Cargo.lock
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Cargo.lock ]; then
            echo "ERROR: Cargo.lock is required for SPLINED application builds."
            echo "Generate it with Cargo, review it, and commit it to version control."
            exit 1
          fi

      - name: Install stable Rust with rustfmt and clippy
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustup default stable

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test locked dependency graph
        run: cargo test --locked --all-targets --all-features

      - name: Clippy locked dependency graph
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build locked release
        run: cargo build --locked --release

      - name: Verify Cargo.lock was not modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- Cargo.lock

  validate-python-docker:
    name: Validate — Python / Docker
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') == false)
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Python and release metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          cargo = tomllib.loads(
              Path("Cargo.toml").read_text(encoding="utf-8-sig")
          )
          source = Path("python/splined.py").read_text(encoding="utf-8")

          version_match = re.search(
              r'^VERSION = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not version_match:
              raise SystemExit("VERSION declaration not found in python/splined.py")

          user_agent_match = re.search(
              r'^USER_AGENT = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not user_agent_match:
              raise SystemExit("USER_AGENT declaration not found in python/splined.py")

          cargo_version = cargo["package"]["version"]
          python_version = version_match.group(1)
          expected_user_agent = (
              f"SPLINED/{python_version} "
              "(https://github.com/scottia/S-P-L-I-N-E-D)"
          )

          if cargo_version != python_version:
              raise SystemExit(
                  "Rust/Python version mismatch: "
                  f"Cargo.toml={cargo_version}, Python={python_version}"
              )

          if user_agent_match.group(1) != expected_user_agent:
              raise SystemExit(
                  "Unexpected production USER_AGENT: "
                  f"{user_agent_match.group(1)!r}"
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SPLINED_VERSION={python_version}\n")

          print(f"Rust version:   {cargo_version}")
          print(f"Python version: {python_version}")
          print(f"User-Agent:     {expected_user_agent}")
          PY

          python3 -m py_compile python/splined.py

      - name: Build Docker validation image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --tag splined-ci:candidate \
            ./python

      - name: Verify Docker validation image
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL=$(docker run --rm splined-ci:candidate -V | tr -d '\r')
          EXPECTED="SPLINED $SPLINED_VERSION"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Docker candidate does not report the source version."
            exit 1
          fi
  release-preflight:
    name: Release — Preflight
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'workflow_dispatch'
      }}

    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve and verify release tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "ERROR: Release tag could not be determined."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Release tag must use numeric semantic versioning, for example 1.0.0."
            echo "Received: $TAG"
            exit 1
          fi

          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$TAG:refs/tags/$TAG"

          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "ERROR: Release tag $TAG does not point to a commit contained in main."
            echo "Tag commit: $TAG_COMMIT"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

          echo "Release tag:    $TAG"
          echo "Release commit: $TAG_COMMIT"

      - name: Verify committed release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          git checkout --detach "$RELEASE_COMMIT"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          expected = os.environ["RELEASE_TAG"]

          cargo = tomllib.loads(
              Path("Cargo.toml").read_text(encoding="utf-8-sig")
          )
          lock = tomllib.loads(
              Path("Cargo.lock").read_text(encoding="utf-8")
          )
          source = Path("python/splined.py").read_text(encoding="utf-8")

          cargo_version = cargo["package"]["version"]

          root_packages = [
              package
              for package in lock["package"]
              if package["name"] == "splined"
          ]
          if len(root_packages) != 1:
              raise SystemExit(
                  "Expected exactly one splined root package in Cargo.lock"
              )

          lock_version = root_packages[0]["version"]

          version_match = re.search(
              r'^VERSION = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not version_match:
              raise SystemExit("VERSION declaration not found in python/splined.py")

          python_version = version_match.group(1)

          user_agent_match = re.search(
              r'^USER_AGENT = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not user_agent_match:
              raise SystemExit("USER_AGENT declaration not found in python/splined.py")

          expected_user_agent = (
              f"SPLINED/{expected} "
              "(https://github.com/scottia/S-P-L-I-N-E-D)"
          )

          values = {
              "release tag": expected,
              "Cargo.toml": cargo_version,
              "Cargo.lock": lock_version,
              "Python": python_version,
          }

          for label, value in values.items():
              print(f"{label}: {value}")

          if not (
              cargo_version
              == lock_version
              == python_version
              == expected
          ):
              raise SystemExit(
                  "Committed release metadata does not match the release tag"
              )

          if user_agent_match.group(1) != expected_user_agent:
              raise SystemExit(
                  "Committed USER_AGENT does not match the release tag"
              )

          print(f"User-Agent: {expected_user_agent}")
          print("Committed release metadata verified.")
          PY

          git diff --exit-code
  build-release:
    name: Build Release — ${{ matrix.name }}
    needs:
      - release-preflight

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: splined-windows-x86_64
            source: target/release/splined.exe
            setup: setup-splined.exe
            readme: README-WINDOWS.txt
            archive: splined-windows-x86_64.zip

          - name: Linux / Ubuntu
            os: ubuntu-latest
            artifact: splined-linux-x86_64
            source: target/release/splined
            setup: setup-splined
            readme: README-LINUX.txt
            archive: splined-linux-x86_64.tar.gz

          - name: macOS
            os: macos-latest
            artifact: splined-macos
            source: target/release/splined
            setup: setup-splined
            readme: README-MACOS.txt
            archive: splined-macos.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Verify exact release commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.release-preflight.outputs.commit }}
        run: |
          set -euo pipefail

          ACTUAL_COMMIT=$(git rev-parse HEAD)
          echo "Expected commit: $EXPECTED_COMMIT"
          echo "Actual commit:   $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Checkout does not match the resolved release tag commit."
            exit 1
          fi

      - name: Require committed Cargo.lock
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Cargo.lock ]; then
            echo "ERROR: Cargo.lock is required for SPLINED release builds."
            exit 1
          fi

      - name: Install stable Rust with rustfmt and clippy
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustup default stable

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version


      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Recheck locked dependency graph
        run: cargo check --locked

      - name: Test tagged source with locked dependency graph
        run: cargo test --locked --all-targets --all-features

      - name: Clippy tagged source with locked dependency graph
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build tagged release with locked dependency graph
        run: cargo build --locked --release --verbose

      - name: Verify compiled release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -euo pipefail

          ACTUAL_VERSION=$("${{ matrix.source }}" --version | tr -d '\r')
          EXPECTED_VERSION="SPLINED $RELEASE_VERSION"

          echo "Expected: $EXPECTED_VERSION"
          echo "Actual:   $ACTUAL_VERSION"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Compiled SPLINED version does not match release tag."
            exit 1
          fi

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-package release-assets
          mkdir -p release-package release-assets

          if [ ! -f "${{ matrix.source }}" ]; then
            echo "ERROR: Expected release binary was not created: ${{ matrix.source }}"
            exit 1
          fi

          if [ ! -f "release/${{ matrix.readme }}" ]; then
            echo "ERROR: Platform release instructions were not found:"
            echo "release/${{ matrix.readme }}"
            exit 1
          fi

          cp "${{ matrix.source }}" "release-package/${{ matrix.setup }}"
          cp "release/${{ matrix.readme }}" "release-package/${{ matrix.readme }}"

          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "release-package/${{ matrix.setup }}"
          fi

          echo "Package contents:"
          ls -lah release-package

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "release-package/*" `
            -DestinationPath "release-assets/${{ matrix.archive }}" `
            -Force

          Write-Host "Windows archive:"
          Get-Item "release-assets/${{ matrix.archive }}"

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          tar \
            -C release-package \
            -czf "release-assets/${{ matrix.archive }}" \
            "${{ matrix.setup }}" \
            "${{ matrix.readme }}"

          echo "Archive:"
          ls -lh "release-assets/${{ matrix.archive }}"

          echo "Archive contents:"
          tar -tzf "release-assets/${{ matrix.archive }}"

      - name: Upload packaged build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/${{ matrix.archive }}
          if-no-files-found: error

  docker-release:
    name: Release — Docker
    needs:
      - release-preflight

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: scottia/splined
      RELEASE_VERSION: ${{ needs.release-preflight.outputs.tag }}

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Verify exact release commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.release-preflight.outputs.commit }}
        run: |
          set -euo pipefail

          ACTUAL_COMMIT=$(git rev-parse HEAD)

          echo "Expected commit: $EXPECTED_COMMIT"
          echo "Actual commit:   $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Docker checkout does not match the release tag commit."
            exit 1
          fi

      - name: Verify Python release metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          expected = os.environ["RELEASE_VERSION"]
          source = Path("python/splined.py").read_text(encoding="utf-8")

          version_match = re.search(
              r'^VERSION = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not version_match:
              raise SystemExit("VERSION declaration not found")

          actual = version_match.group(1)
          if actual != expected:
              raise SystemExit(
                  f"Python VERSION mismatch: expected={expected}, actual={actual}"
              )

          expected_user_agent = (
              f'SPLINED/{expected} '
              '(https://github.com/scottia/S-P-L-I-N-E-D)'
          )

          user_agent_match = re.search(
              r'^USER_AGENT = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not user_agent_match:
              raise SystemExit("USER_AGENT declaration not found")

          if user_agent_match.group(1) != expected_user_agent:
              raise SystemExit(
                  "Production USER_AGENT does not match release metadata"
              )

          print(f"Python version: {actual}")
          print(f"User-Agent: {expected_user_agent}")
          PY

          python3 -m py_compile python/splined.py

      - name: Build release image
        shell: bash
        run: |
          set -euo pipefail

          docker build --pull \
            --tag "$IMAGE_NAME:release-candidate" \
            ./python

      - name: Verify container version
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL=$(
            docker run --rm "$IMAGE_NAME:release-candidate" -V \
              | tr -d '\r'
          )
          EXPECTED="SPLINED $RELEASE_VERSION"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Docker release image version mismatch."
            exit 1
          fi

      - name: Log in to Docker Hub
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "ERROR: DOCKERHUB_TOKEN repository secret is not configured."
            exit 1
          fi

          printf '%s' "$DOCKERHUB_TOKEN" \
            | docker login \
                --username scottia \
                --password-stdin

      - name: Push numbered and latest tags
        shell: bash
        run: |
          set -euo pipefail

          docker tag \
            "$IMAGE_NAME:release-candidate" \
            "$IMAGE_NAME:$RELEASE_VERSION"

          docker tag \
            "$IMAGE_NAME:release-candidate" \
            "$IMAGE_NAME:latest"

          docker push "$IMAGE_NAME:$RELEASE_VERSION"
          docker push "$IMAGE_NAME:latest"

      - name: Verify published Docker digests
        shell: bash
        run: |
          set -euo pipefail

          VERSION_INFO=$(
            docker buildx imagetools inspect \
              "$IMAGE_NAME:$RELEASE_VERSION"
          )

          LATEST_INFO=$(
            docker buildx imagetools inspect \
              "$IMAGE_NAME:latest"
          )

          echo "$VERSION_INFO"
          echo
          echo "$LATEST_INFO"
          echo

          VERSION_DIGEST=$(
            printf '%s\n' "$VERSION_INFO" \
              | awk '/^Digest:/ {print $2; exit}'
          )

          LATEST_DIGEST=$(
            printf '%s\n' "$LATEST_INFO" \
              | awk '/^Digest:/ {print $2; exit}'
          )

          if [ -z "$VERSION_DIGEST" ] || [ -z "$LATEST_DIGEST" ]; then
            echo "ERROR: Could not resolve published Docker digest."
            exit 1
          fi

          if [ "$VERSION_DIGEST" != "$LATEST_DIGEST" ]; then
            echo "ERROR: Numbered and latest Docker tags differ."
            echo "Version digest: $VERSION_DIGEST"
            echo "Latest digest:  $LATEST_DIGEST"
            exit 1
          fi

          mkdir -p release-assets

          cat > release-assets/DOCKER_IMAGE.txt <<EOF
          S:P:L:I:N:E:D Docker release

          Image: $IMAGE_NAME
          Version tag: $IMAGE_NAME:$RELEASE_VERSION
          Latest tag: $IMAGE_NAME:latest
          Digest: $VERSION_DIGEST
          Immutable reference: $IMAGE_NAME@$VERSION_DIGEST
          EOF

          cat release-assets/DOCKER_IMAGE.txt

      - name: Upload Docker release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-docker-metadata
          path: release-assets/DOCKER_IMAGE.txt
          if-no-files-found: error

      - name: Log out of Docker Hub
        if: always()
        shell: bash
        run: docker logout || true
  publish:
    name: Publish — ${{ needs.release-preflight.outputs.tag }}
    needs:
      - release-preflight
      - build-release
      - docker-release

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all packaged builds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          pattern: splined-*
          merge-multiple: true

      - name: Verify release archives and create checksums
        shell: bash
        run: |
          set -euo pipefail

          test -f release-assets/splined-windows-x86_64.zip
          test -f release-assets/splined-linux-x86_64.tar.gz
          test -f release-assets/splined-macos.tar.gz
          test -f release-assets/DOCKER_IMAGE.txt

          (
            cd release-assets
            sha256sum \
              splined-windows-x86_64.zip \
              splined-linux-x86_64.tar.gz \
              splined-macos.tar.gz \
              > SHA256SUMS.txt
          )

          echo "Release archives:"
          ls -lh release-assets
          echo
          cat release-assets/SHA256SUMS.txt

      - name: Create GitHub Release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG"
          else
            echo "Creating GitHub Release: $RELEASE_TAG"
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "S:P:L:I:N:E:D $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Upload archives and checksums to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            release-assets/splined-windows-x86_64.zip \
            release-assets/splined-linux-x86_64.tar.gz \
            release-assets/splined-macos.tar.gz \
            release-assets/SHA256SUMS.txt \
            release-assets/DOCKER_IMAGE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Show published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
