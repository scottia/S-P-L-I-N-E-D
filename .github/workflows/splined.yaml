name: SPLINED CI and Release

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      platform:
        description: "Build platform"
        required: true
        default: "Windows"
        type: choice
        options:
          - "Windows"
          - "Ubuntu"
          - "macOS"
          - "All"

permissions:
  contents: read

concurrency:
  group: splined-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-ubuntu:
    name: Validate — Ubuntu quality gate
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') == false)
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require committed Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock || {
            echo "ERROR: Cargo.lock is required for SPLINED application builds."
            exit 1
          }

      - name: Install stable Rust with rustfmt and clippy
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustup default stable

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test locked dependency graph
        run: cargo test --locked

      - name: Clippy locked dependency graph
        run: cargo clippy --locked -- -D warnings

      - name: Verify Cargo.lock was not modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- Cargo.lock

  validate-windows:
    name: Validate — Windows compatibility
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') == false)
      }}
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require committed Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock || {
            echo "ERROR: Cargo.lock is required for SPLINED application builds."
            exit 1
          }

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable \
            --profile minimal \
            --no-self-update
          rustup default stable

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Check locked dependency graph
        run: cargo check --locked

      - name: Verify Cargo.lock was not modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- Cargo.lock

  validate-python-docker:
    name: Validate — Python / Docker
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') == false) ||
        (github.event_name == 'workflow_dispatch' && inputs.platform == 'All')
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Python and release metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          cargo = tomllib.loads(
              Path("Cargo.toml").read_text(encoding="utf-8-sig")
          )
          source = Path("python/splined.py").read_text(encoding="utf-8")

          version_match = re.search(
              r'^VERSION = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not version_match:
              raise SystemExit("VERSION declaration not found in python/splined.py")

          user_agent_match = re.search(
              r'^USER_AGENT = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not user_agent_match:
              raise SystemExit("USER_AGENT declaration not found in python/splined.py")

          cargo_version = cargo["package"]["version"]
          python_version = version_match.group(1)
          expected_user_agent = (
              f"SPLINED/{python_version} "
              "(https://github.com/scottia/S-P-L-I-N-E-D)"
          )

          if cargo_version != python_version:
              raise SystemExit(
                  "Rust/Python version mismatch: "
                  f"Cargo.toml={cargo_version}, Python={python_version}"
              )

          if user_agent_match.group(1) != expected_user_agent:
              raise SystemExit(
                  "Unexpected production USER_AGENT: "
                  f"{user_agent_match.group(1)!r}"
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SPLINED_VERSION={python_version}\n")

          print(f"Rust version:   {cargo_version}")
          print(f"Python version: {python_version}")
          print(f"User-Agent:     {expected_user_agent}")
          PY

          python3 -m py_compile python/splined.py

      - name: Build Docker validation image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --tag splined-ci:candidate \
            ./python

      - name: Verify Docker validation image
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL=$(docker run --rm splined-ci:candidate -V | tr -d '\r')
          EXPECTED="SPLINED $SPLINED_VERSION"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Docker candidate does not report the source version."
            exit 1
          fi

  manual-windows:
    name: Manual Build — Windows
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.platform == 'Windows' || inputs.platform == 'All')
      }}
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable \
            --profile minimal \
            --no-self-update
          rustup default stable

      - name: Check and build Windows
        run: |
          cargo check --locked
          cargo build --locked --release

      - name: Prepare Windows package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-package release-assets
          mkdir -p release-package release-assets
          cp target/release/splined.exe release-package/splined.exe
          cp release/README-WINDOWS.txt release-package/README-WINDOWS.txt

      - name: Create Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive `
            -Path "release-package/*" `
            -DestinationPath "release-assets/splined-windows-x86_64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-windows-x86_64-manual
          path: release-assets/splined-windows-x86_64.zip
          if-no-files-found: error

  manual-ubuntu:
    name: Manual Build — Ubuntu
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.platform == 'Ubuntu' || inputs.platform == 'All')
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable \
            --profile minimal \
            --no-self-update
          rustup default stable

      - name: Check and build Ubuntu
        run: |
          cargo check --locked
          cargo build --locked --release

      - name: Prepare Ubuntu package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-package release-assets
          mkdir -p release-package release-assets
          cp target/release/splined release-package/splined
          cp release/README-LINUX.txt release-package/README-LINUX.txt
          chmod +x release-package/splined
          tar \
            -czf release-assets/splined-linux-x86_64.tar.gz \
            -C release-package \
            splined \
            README-LINUX.txt

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-linux-x86_64-manual
          path: release-assets/splined-linux-x86_64.tar.gz
          if-no-files-found: error

  manual-macos:
    name: Manual Build — macOS
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.platform == 'macOS' || inputs.platform == 'All')
      }}
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable \
            --profile minimal \
            --no-self-update
          rustup default stable

      - name: Check and build macOS
        run: |
          cargo check --locked
          cargo build --locked --release

      - name: Prepare macOS package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-package release-assets
          mkdir -p release-package release-assets
          cp target/release/splined release-package/splined
          cp release/README-MACOS.txt release-package/README-MACOS.txt
          chmod +x release-package/splined
          tar \
            -czf release-assets/splined-macos.tar.gz \
            -C release-package \
            splined \
            README-MACOS.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-macos-manual
          path: release-assets/splined-macos.tar.gz
          if-no-files-found: error

  release-preflight:
    name: Release — Preflight
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve and verify release tag
        id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG="$REF_NAME"

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Release tag must use numeric semantic versioning, for example 1.0.0."
            echo "Received: $TAG"
            exit 1
          fi

          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$TAG:refs/tags/$TAG"

          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "ERROR: Release tag $TAG does not point to a commit contained in main."
            echo "Tag commit: $TAG_COMMIT"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

          echo "Release tag:    $TAG"
          echo "Release commit: $TAG_COMMIT"

      - name: Verify committed release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          git checkout --detach "$RELEASE_COMMIT"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          expected = os.environ["RELEASE_TAG"]

          cargo = tomllib.loads(
              Path("Cargo.toml").read_text(encoding="utf-8-sig")
          )
          lock = tomllib.loads(
              Path("Cargo.lock").read_text(encoding="utf-8")
          )
          source = Path("python/splined.py").read_text(encoding="utf-8")

          cargo_version = cargo["package"]["version"]

          root_packages = [
              package
              for package in lock["package"]
              if package["name"] == "splined"
          ]
          if len(root_packages) != 1:
              raise SystemExit(
                  "Expected exactly one splined root package in Cargo.lock"
              )

          lock_version = root_packages[0]["version"]

          version_match = re.search(
              r'^VERSION = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not version_match:
              raise SystemExit("VERSION declaration not found in python/splined.py")

          python_version = version_match.group(1)

          user_agent_match = re.search(
              r'^USER_AGENT = "([^"]+)"$',
              source,
              re.MULTILINE,
          )
          if not user_agent_match:
              raise SystemExit("USER_AGENT declaration not found in python/splined.py")

          expected_user_agent = (
              f"SPLINED/{expected} "
              "(https://github.com/scottia/S-P-L-I-N-E-D)"
          )

          values = {
              "release tag": expected,
              "Cargo.toml": cargo_version,
              "Cargo.lock": lock_version,
              "Python": python_version,
          }

          for label, value in values.items():
              print(f"{label}: {value}")

          if not (
              cargo_version
              == lock_version
              == python_version
              == expected
          ):
              raise SystemExit(
                  "Committed release metadata does not match the release tag"
              )

          if user_agent_match.group(1) != expected_user_agent:
              raise SystemExit(
                  "Committed USER_AGENT does not match the release tag"
              )

          print(f"User-Agent: {expected_user_agent}")
          print("Committed release metadata verified.")
          PY

          git diff --exit-code

  build-release-windows:
    name: Build Release — Windows
    needs:
      - release-preflight
    runs-on: windows-latest

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Verify exact release commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.release-preflight.outputs.commit }}
        run: |
          set -euo pipefail

          ACTUAL_COMMIT=$(git rev-parse HEAD)
          echo "Expected commit: $EXPECTED_COMMIT"
          echo "Actual commit:   $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Checkout does not match the resolved release tag commit."
            exit 1
          fi

      - name: Require committed Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock || {
            echo "ERROR: Cargo.lock is required for SPLINED release builds."
            exit 1
          }

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable \
            --profile minimal \
            --no-self-update
          rustup default stable

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Check tagged source with locked dependency graph
        run: cargo check --locked

      - name: Build tagged Windows release
        run: cargo build --locked --release

      - name: Verify compiled release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -euo pipefail

          ACTUAL_VERSION=$(target/release/splined.exe --version | tr -d '\r')
          EXPECTED_VERSION="SPLINED $RELEASE_VERSION"

          echo "Expected: $EXPECTED_VERSION"
          echo "Actual:   $ACTUAL_VERSION"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Compiled SPLINED version does not match release tag."
            exit 1
          fi

      - name: Prepare Windows release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-package release-assets
          mkdir -p release-package release-assets
          cp target/release/splined.exe release-package/splined.exe
          cp release/README-WINDOWS.txt release-package/README-WINDOWS.txt

      - name: Create Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "release-package/*" `
            -DestinationPath "release-assets/splined-windows-x86_64.zip" `
            -Force

          Get-Item "release-assets/splined-windows-x86_64.zip"

      - name: Upload packaged Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splined-windows-x86_64
          path: release-assets/splined-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish — ${{ needs.release-preflight.outputs.tag }}
    needs:
      - release-preflight
      - build-release-windows

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          pattern: splined-*
          merge-multiple: true

      - name: Verify Windows release artifact and create checksum
        shell: bash
        run: |
          set -euo pipefail

          test -f release-assets/splined-windows-x86_64.zip

          (
            cd release-assets
            sha256sum \
              splined-windows-x86_64.zip \
              > SHA256SUMS.txt
          )

          echo "Release artifacts:"
          ls -lh release-assets
          echo
          cat release-assets/SHA256SUMS.txt

      - name: Create GitHub Release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG"
          else
            echo "Creating GitHub Release: $RELEASE_TAG"
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "S:P:L:I:N:E:D $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Upload Windows archive and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            release-assets/splined-windows-x86_64.zip \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Show published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
