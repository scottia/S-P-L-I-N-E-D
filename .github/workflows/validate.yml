name: Validate supported runtimes
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  scope:
    name: Select relevant validation
    runs-on: ubuntu-latest
    outputs:
      webgui: ${{ steps.scope.outputs.webgui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check validation selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select checks for changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/validation_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
  policy-review:
    name: Canonical policy JSON — review gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Test both policy guards
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_protected_policies.py' -v
      - name: Block unreviewed policy JSON changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Execute the trusted target-branch guard after its first installation,
          # not a modified checker supplied by the proposed PR.
          if git cat-file -e "$BASE_SHA:.github/scripts/check_protected_policies.py" 2>/dev/null; then
            git show "$BASE_SHA:.github/scripts/check_protected_policies.py" > "$RUNNER_TEMP/check_protected_policies.py"
            python3 "$RUNNER_TEMP/check_protected_policies.py" "$BASE_SHA" "$HEAD_SHA"
          else
            # Bootstrap only: the target branch does not yet have a guard.
            python3 .github/scripts/check_protected_policies.py "$BASE_SHA" "$HEAD_SHA"
          fi

  webgui:
    needs: scope
    if: needs.scope.outputs.webgui == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splined_test
          POSTGRES_PASSWORD: splined_ci_only
          POSTGRES_DB: splined_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splined_test -d splined_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPLINED_TEST_DATABASE_URL: postgresql://splined_test:splined_ci_only@127.0.0.1:5432/splined_test
      PYTHONPATH: .:build/WEBGui:build/WEBGui/webgui/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: pip install -r build/WEBGui/webgui/requirements-test.txt
      - run: python -m unittest discover -s build/WEBGui/webgui/tests -v
      - run: node --check build/WEBGui/webgui/static/app.js && node --check build/WEBGui/webgui/static/operations.js
      - name: Build and start browser container
        run: |
          docker build --file build/WEBGui/Dockerfile --tag splined-webgui:test .
          docker run -d --name splined-webgui-test --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=splined_test -e PGPASSWORD=splined_ci_only \
            -e PGDATABASE=splined_test -e SPLINED_WEB_TOKEN=ci-browser-only splined-webgui:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/status > /tmp/splined-status.json; then break; fi
            sleep 1
          done
          python -c "import json; value=json.load(open('/tmp/splined-status.json')); assert value['database']=='PostgreSQL' and value['auth_required'] and value['database_ready']"
      - if: always()
        run: docker logs splined-webgui-test || true
  windows-advisory:
    name: Windows Rust/Slint — advisory
    needs: scope
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Report permanent PR policy exception
        env:
          TESTED_REVISION: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/windows_advisory.py
