name: Validate supported runtimes
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  scope:
    name: Select relevant validation
    runs-on: ubuntu-latest
    outputs:
      webgui: ${{ steps.scope.outputs.webgui }}
      linux: ${{ steps.scope.outputs.linux }}
      windows_advisory: ${{ steps.scope.outputs.windows_advisory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check validation selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select checks for changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/validation_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
  webgui:
    needs: scope
    if: needs.scope.outputs.webgui == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splined_test
          POSTGRES_PASSWORD: splined_ci_only
          POSTGRES_DB: splined_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splined_test -d splined_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPLINED_TEST_DATABASE_URL: postgresql://splined_test:splined_ci_only@127.0.0.1:5432/splined_test
      PYTHONPATH: .:webgui/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: pip install -r webgui/requirements-test.txt
      - run: python -m unittest discover -s webgui/tests -v
      - run: node --check webgui/static/app.js && node --check webgui/static/operations.js
      - name: Build and start browser container
        run: |
          docker build --file webgui/Dockerfile --tag splined-webgui:test .
          docker run -d --name splined-webgui-test --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=splined_test -e PGPASSWORD=splined_ci_only \
            -e PGDATABASE=splined_test -e SPLINED_WEB_TOKEN=ci-browser-only splined-webgui:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/status > /tmp/splined-status.json; then break; fi
            sleep 1
          done
          python -c "import json; value=json.load(open('/tmp/splined-status.json')); assert value['database']=='PostgreSQL' and value['auth_required'] and value['database_ready']"
      - if: always()
        run: docker logs splined-webgui-test || true
  native:
    name: native (ubuntu-latest)
    needs: scope
    if: needs.scope.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable test --locked
  windows-advisory:
    name: Windows Rust/Slint — advisory
    needs: scope
    runs-on: ${{ needs.scope.outputs.windows_advisory == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Report diagnostics not run for this change scope
        if: needs.scope.outputs.windows_advisory != 'true'
        env:
          TESTED_REVISION: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/windows_advisory.py --not-run
      - name: Run scoped advisory diagnostics
        if: needs.scope.outputs.windows_advisory == 'true'
        env:
          TESTED_REVISION: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/windows_advisory.py
