name: Validate supported runtimes
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
env:
  VALIDATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  VALIDATION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  promotion-provenance:
    name: Dev-to-main promotion — prior validation provenance
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the exact same-repository promotion
        env:
          ACTUAL_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          test "$ACTUAL_HEAD_REPOSITORY" = "$EXPECTED_REPOSITORY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
          fetch-depth: 0
      - name: Verify current branch heads and promotion tree
        env:
          BASE_SHA: ${{ env.VALIDATION_BASE_SHA }}
          HEAD_SHA: ${{ env.VALIDATION_HEAD_SHA }}
        run: |
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/dev:refs/remotes/origin/dev
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/dev)" = "$HEAD_SHA"
          MERGED_TREE=$(git merge-tree --write-tree "$BASE_SHA" "$HEAD_SHA")
          HEAD_TREE=$(git rev-parse "$HEAD_SHA^{tree}")
          test "$MERGED_TREE" = "$HEAD_TREE"
          {
            echo "### Exact dev-to-main promotion verified"
            echo
            echo "Source and Audio Integrity checks already passed before this commit entered dev."
            echo "Combining the current main base with the current dev head produces exactly the dev tree."
          } >> "$GITHUB_STEP_SUMMARY"
  audio-integrity-webgui:
    name: Audio integrity — WebGUI real artwork writer
    needs: scope
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'dev') && needs.scope.outputs.audio_webgui == 'true' }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:build/WEBGui:build/WEBGui/webgui/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Enforce actual MP3 artwork-only integrity and mutation rejection
        run: |
          python -m pip install -r build/WEBGui/webgui/requirements-test.txt
          python -m unittest discover -s build/WEBGui/webgui/tests -p test_splined_compilation_authority_policy.py -v
          python -m unittest discover -s build/WEBGui/webgui/tests -p test_audio_integrity.py -v
          python -m unittest discover -s build/WEBGui/webgui/tests -p test_comp_job_scope.py -v
          python -m unittest discover -s build/WEBGui/webgui/tests -p test_cross_format_cover_overwrite.py -v
  audio-integrity-windows:
    name: Audio integrity — Windows real artwork writer
    needs: scope
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'dev') && needs.scope.outputs.audio_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup target add x86_64-pc-windows-msvc --toolchain 1.99.0

      - name: Calculate normalized Windows dependency cache key
        id: windows-audio-cache-key
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content -Raw -LiteralPath build/Windows/Cargo.lock
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "splined-windows"\r?\n)version = "[^"]+"'
          $normalized = [regex]::Replace($lock, $pattern, '${1}version = "<release>"')
          if ($normalized -eq $lock) {
            throw "Unable to normalize the release-only Windows package version for the validation cache key."
          }
          $bytes = [Text.Encoding]::UTF8.GetBytes($normalized)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "hash=$hash" | Add-Content $env:GITHUB_OUTPUT

      - name: Restore Cargo registry and Git dependencies
        id: windows-audio-dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-splined-windows-dependencies-v2-1.99.0-${{ steps.windows-audio-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-dependencies-v2-1.99.0-

      - name: Restore compatible Windows test intermediates
        id: windows-audio-compiled-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/Windows/target/debug/deps
            !build/Windows/target/debug/deps/*.exe
            !build/Windows/target/debug/deps/*.pdb
            build/Windows/target/debug/build
            build/Windows/target/debug/.fingerprint
            build/Windows/target/debug/incremental
            build/Windows/target/x86_64-pc-windows-msvc/debug/deps
            !build/Windows/target/x86_64-pc-windows-msvc/debug/deps/*.exe
            !build/Windows/target/x86_64-pc-windows-msvc/debug/deps/*.pdb
            build/Windows/target/x86_64-pc-windows-msvc/debug/build
            build/Windows/target/x86_64-pc-windows-msvc/debug/.fingerprint
            build/Windows/target/x86_64-pc-windows-msvc/debug/incremental
          key: ${{ runner.os }}-splined-windows-audio-tests-v2-1.99.0-x86_64-pc-windows-msvc-${{ steps.windows-audio-cache-key.outputs.hash }}-${{ env.VALIDATION_HEAD_SHA }}
          restore-keys: |
            ${{ runner.os }}-splined-windows-audio-tests-v2-1.99.0-x86_64-pc-windows-msvc-${{ steps.windows-audio-cache-key.outputs.hash }}-

      - name: Compile once and run mandatory Rust/Lofty regressions
        shell: pwsh
        env:
          CARGO_INCREMENTAL: "1"
          CARGO_DEPENDENCY_CACHE_HIT: ${{ steps.windows-audio-dependency-cache.outputs.cache-hit }}
          COMPILED_CACHE_HIT: ${{ steps.windows-audio-compiled-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = "Stop"
          $overallStarted = Get-Date
          $compileStarted = Get-Date
          $messages = Join-Path $env:RUNNER_TEMP "splined-audio-integrity-cargo.jsonl"

          cargo +1.99.0 test `
            --locked `
            --manifest-path build/Windows/Cargo.toml `
            --lib `
            --bin splined `
            --target x86_64-pc-windows-msvc `
            --no-run `
            --message-format=json-render-diagnostics 2>&1 | Tee-Object -FilePath $messages
          if ($LASTEXITCODE -ne 0) {
            throw "Windows audio-integrity test compilation failed with exit code $LASTEXITCODE."
          }
          $compileSeconds = [math]::Round(((Get-Date) - $compileStarted).TotalSeconds, 2)

          $testExecutables = @(
            Get-Content -LiteralPath $messages | ForEach-Object {
              try {
                $message = $_ | ConvertFrom-Json -ErrorAction Stop
              } catch {
                $message = $null
              }
              if (
                $null -ne $message -and
                $message.reason -eq "compiler-artifact" -and
                $message.profile.test -eq $true -and
                $message.target.name -eq "splined_core" -and
                $message.executable
              ) {
                [string]$message.executable
              }
            }
          )
          if ($testExecutables.Count -ne 1 -or -not (Test-Path -LiteralPath $testExecutables[0] -PathType Leaf)) {
            throw "Expected exactly one compiled splined_core test executable; found $($testExecutables.Count)."
          }
          $applicationTests = @(
            Get-Content -LiteralPath $messages | ForEach-Object {
              try {
                $message = $_ | ConvertFrom-Json -ErrorAction Stop
              } catch {
                $message = $null
              }
              if ($message.reason -eq "compiler-artifact" -and $message.profile.test -eq $true -and
                  $message.target.name -eq "splined" -and $message.executable) {
                [string]$message.executable
              }
            }
          )
          if ($applicationTests.Count -ne 1 -or -not (Test-Path -LiteralPath $applicationTests[0] -PathType Leaf)) {
            throw "Expected exactly one compiled Windows application test executable."
          }

          $testStarted = Get-Date
          $testExecutable = $testExecutables[0]
          $filters = @(
            "artwork_integrity::tests",
            "embedded_artwork",
            "local_artwork",
            "art004",
            "snapshot_projects_cached_compilation_tracks_and_embedded_artwork_state"
          )
          foreach ($filter in $filters) {
            & $testExecutable $filter --nocapture
            if ($LASTEXITCODE -ne 0) {
              throw "Windows audio-integrity filter '$filter' failed with exit code $LASTEXITCODE."
            }
          }
          $applicationTest = "tests::artist_overview_cards_group_by_album_type_then_newest_year_with_separators"
          $availableTests = & $applicationTests[0] --list
          if ($LASTEXITCODE -ne 0 -or $availableTests -notcontains "${applicationTest}: test") {
            throw "Required Windows application regression is missing."
          }
          & $applicationTests[0] --exact $applicationTest --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "Required Windows application regression failed."
          }
          $testSeconds = [math]::Round(((Get-Date) - $testStarted).TotalSeconds, 2)
          $totalSeconds = [math]::Round(((Get-Date) - $overallStarted).TotalSeconds, 2)

          $summary = @"
          ### Windows audio-integrity validation timing

          - Cargo dependency cache exact hit: $env:CARGO_DEPENDENCY_CACHE_HIT
          - Compiled-intermediate cache exact hit: $env:COMPILED_CACHE_HIT
          - Cargo invocations: 1 (library and application test targets)
          - Mandatory writer and catalog filters executed: 5
          - Windows production card regression: passed
          - Compile seconds: $compileSeconds
          - Test seconds: $testSeconds
          - Total compile/test seconds: $totalSeconds
          "@
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY
  scope:
    name: Select relevant validation
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'dev' }}
    runs-on: ubuntu-latest
    outputs:
      webgui: ${{ steps.scope.outputs.webgui }}
      audio_webgui: ${{ steps.scope.outputs.audio_webgui }}
      audio_windows: ${{ steps.scope.outputs.audio_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
          fetch-depth: 0
      - name: Check validation selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select checks for changed files
        id: scope
        env:
          BASE_SHA: ${{ env.VALIDATION_BASE_SHA }}
          HEAD_SHA: ${{ env.VALIDATION_HEAD_SHA }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            git fetch origin dev
            BASE_SHA=$(git rev-parse origin/dev)
          fi
          python3 .github/scripts/validation_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
  policy-review:
    name: Canonical policy JSON — review gate
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
          fetch-depth: 0
      - name: Reject changed protected behavioural JSON
        env:
          BASE_SHA: ${{ env.VALIDATION_BASE_SHA }}
          HEAD_SHA: ${{ env.VALIDATION_HEAD_SHA }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            git fetch origin dev
            BASE_SHA=$(git rev-parse origin/dev)
          fi
          python3 .github/scripts/check_protected_policies.py "$BASE_SHA" "$HEAD_SHA"
      - name: Validate canonical policy, SQLite DDL and settings contracts
        env:
          PYTHONPATH: .:build/WEBGui:build/WEBGui/webgui/backend
        run: python3 .github/scripts/validate_release_policy_contracts.py
  webgui:
    needs: scope
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'dev') && needs.scope.outputs.webgui == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splined_test
          POSTGRES_PASSWORD: splined_ci_only
          POSTGRES_DB: splined_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splined_test -d splined_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPLINED_TEST_DATABASE_URL: postgresql://splined_test:splined_ci_only@127.0.0.1:5432/splined_test
      PYTHONPATH: .:build/WEBGui:build/WEBGui/webgui/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: pip install -r build/WEBGui/webgui/requirements-test.txt
      - run: python -m unittest discover -s build/WEBGui/webgui/tests -v
      - run: node --check build/WEBGui/webgui/static/app.js && node --check build/WEBGui/webgui/static/operations.js
      - name: Build and start browser container
        run: |
          docker build --file build/WEBGui/Dockerfile --tag splined-webgui:test .
          docker run -d --name splined-webgui-test --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=splined_test -e PGPASSWORD=splined_ci_only \
            -e PGDATABASE=splined_test -e SPLINED_WEB_TOKEN=ci-browser-only splined-webgui:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/status > /tmp/splined-status.json; then break; fi
            sleep 1
          done
          python -c "import json; value=json.load(open('/tmp/splined-status.json')); assert value['database']=='PostgreSQL' and value['auth_required'] and value['database_ready']"
      - if: always()
        run: docker logs splined-webgui-test || true
  windows-advisory:
    name: Windows Rust/Slint — advisory
    needs: scope
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'dev' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
      - name: Report permanent PR policy exception
        env:
          TESTED_REVISION: ${{ env.VALIDATION_HEAD_SHA }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/windows_advisory.py
