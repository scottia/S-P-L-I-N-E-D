name: 23. Python / WebGUI Build

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Workflow 21 run ID containing the approved release candidate."
        default: ""
        type: string
      compile_partial:
        description: "PARTIAL UPDATE (default). Choose exactly one compilation mode."
        default: true
        type: boolean
      compile_full:
        description: "FULL SOURCE."
        default: false
        type: boolean
      completion_build:
        description: "BUILD ONLY (default). Choose exactly one completion."
        default: true
        type: boolean
      completion_report_only:
        description: "BUILD ONLY, REPORT: audit without building or packaging."
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: splined-webgui-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-plan:
    name: Validate WebGUI workflow selections
    runs-on: ubuntu-latest
    outputs:
      candidate_run_id: ${{ steps.plan.outputs.candidate_run_id }}
      compile_mode: ${{ steps.plan.outputs.compile_mode }}
      report_only: ${{ steps.plan.outputs.report_only }}
      started_epoch: ${{ steps.plan.outputs.started_epoch }}
    steps:
      - name: Reject conflicting selections before artifact transfer
        id: plan
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          PARTIAL: ${{ inputs.compile_partial }}
          FULL: ${{ inputs.compile_full }}
          BUILD: ${{ inputs.completion_build }}
          REPORT: ${{ inputs.completion_report_only }}
        run: |
          set -euo pipefail
          STARTED_EPOCH=$(date +%s)
          if ! [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Release candidate run required::Enter the approved Workflow 21 run ID."
            exit 1
          fi
          compile_count=0
          if [ "$PARTIAL" = true ]; then compile_count=$((compile_count + 1)); mode="PARTIAL UPDATE"; fi
          if [ "$FULL" = true ]; then compile_count=$((compile_count + 1)); mode="FULL SOURCE"; fi
          if [ "$compile_count" -ne 1 ]; then
            echo "::error title=Select exactly one compilation mode::Compilation has $compile_count checked options."
            exit 1
          fi
          completion_count=0
          if [ "$BUILD" = true ]; then completion_count=$((completion_count + 1)); fi
          if [ "$REPORT" = true ]; then completion_count=$((completion_count + 1)); fi
          if [ "$completion_count" -ne 1 ]; then
            echo "::error title=Select exactly one completion::Completion has $completion_count checked options."
            exit 1
          fi
          {
            echo "candidate_run_id=$CANDIDATE_RUN_ID"
            echo "compile_mode=$mode"
            echo "report_only=$REPORT"
            echo "started_epoch=$STARTED_EPOCH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Workflow 23 selected plan"
            echo
            echo "- Candidate run: \`$CANDIDATE_RUN_ID\`"
            echo "- Compilation mode: \`$mode\`"
            echo "- Completion: \`$([ "$REPORT" = true ] && echo 'BUILD ONLY, REPORT' || echo 'BUILD ONLY')\`"
          } >> "$GITHUB_STEP_SUMMARY"

  audit-candidate:
    name: Audit approved WebGUI release candidate
    needs: resolve-plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.release_version }}
      commit: ${{ steps.candidate.outputs.candidate_commit }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download approved release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-release-candidate
          path: release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-plan.outputs.candidate_run_id }}
      - name: Verify immutable candidate contract
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_artifact_contract.py verify-candidate release-candidate \
            --expected-run-id "${{ needs.resolve-plan.outputs.candidate_run_id }}" \
            --github-output "$GITHUB_OUTPUT"
          git bundle verify release-candidate/release-source.bundle
          python3 - <<'PY'
          import json
          manifest = json.load(open("release-candidate/release-candidate.json", encoding="utf-8"))
          if manifest["target"] not in {"ALL", "WEBGUI"}:
              raise SystemExit("The approved candidate does not include the WebGUI target")
          PY
      - name: Report candidate and anticipated cache plan
        shell: bash
        run: |
          {
            echo "## Workflow 23 candidate audit"
            echo
            echo "- Candidate commit/version: \`${{ steps.candidate.outputs.candidate_commit }}\` / \`${{ steps.candidate.outputs.release_version }}\`"
            echo "- Requested mode: \`${{ needs.resolve-plan.outputs.compile_mode }}\`"
            echo "- Candidate bundle checksum/provenance: \`passed\`"
            echo "- Expected BuildKit behavior: \`${{ needs.resolve-plan.outputs.compile_mode == 'PARTIAL UPDATE' && 'restore compatible GitHub Actions cache layers' || 'ignore prior layers and perform a clean container build' }}\`"
            echo "- This audit reports anticipated reuse only; no image, archive or package was created."
          } >> "$GITHUB_STEP_SUMMARY"

  build-webgui:
    name: Validate and build WebGUI distributables
    needs: [resolve-plan, audit-candidate]
    if: ${{ needs.resolve-plan.outputs.report_only != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: splined_test
          POSTGRES_PASSWORD: splined_ci_only
          POSTGRES_DB: splined_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splined_test -d splined_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPLINED_TEST_DATABASE_URL: postgresql://splined_test:splined_ci_only@127.0.0.1:5432/splined_test
      PYTHONPATH: .:build/WEBGui:build/WEBGui/webgui/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download approved release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splined-release-candidate
          path: release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-plan.outputs.candidate_run_id }}
      - name: Verify and checkout exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_artifact_contract.py verify-candidate release-candidate \
            --expected-run-id "${{ needs.resolve-plan.outputs.candidate_run_id }}" \
            --github-output "$GITHUB_OUTPUT"
          git fetch release-candidate/release-source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "${{ needs.audit-candidate.outputs.commit }}"
          git checkout --detach FETCH_HEAD
          test "$(python3 .github/scripts/source_version.py current)" = "${{ needs.audit-candidate.outputs.version }}"
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install WebGUI test dependencies
        run: pip install -r build/WEBGui/webgui/requirements-test.txt
      - name: Validate Python, PostgreSQL and browser JavaScript
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          for test_path in build/WEBGui/webgui/tests/test_*.py; do
            test_name="$(basename "$test_path")"
            case "$test_name" in
              test_splined_compilation_authority_policy.py|test_audio_integrity.py|test_comp_job_scope.py|test_cross_format_cover_overwrite.py)
                continue
                ;;
            esac
            python -m unittest "$test_path" -v
          done
          node --check build/WEBGui/webgui/static/app.js
          node --check build/WEBGui/webgui/static/operations.js
          echo "seconds=$(($(date +%s) - started))" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test exact WebGUI image
        id: container
        shell: bash
        env:
          COMPILE_MODE: ${{ needs.resolve-plan.outputs.compile_mode }}
          RELEASE_VERSION: ${{ needs.audit-candidate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.audit-candidate.outputs.commit }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          builder="splined-workflow23-${GITHUB_RUN_ID}"
          docker buildx create --driver docker-container --name "$builder" --use
          cache_args=(--cache-to type=gha,mode=max,scope=splined-workflow23-webgui)
          if [ "$COMPILE_MODE" = "FULL SOURCE" ]; then
            cache_args+=(--no-cache)
          else
            cache_args+=(--cache-from type=gha,scope=splined-workflow23-webgui)
          fi
          set +e
          docker buildx build --progress=plain "${cache_args[@]}" --load \
            --build-arg SPLINED_BUILD_CHANNEL=release \
            --label "org.opencontainers.image.source=https://github.com/scottia/S-P-L-I-N-E-D" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --file build/WEBGui/Dockerfile --tag splined-webgui:release-test . 2>&1 | tee /tmp/splined-buildkit.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          cached_steps=$(grep -c ' CACHED$' /tmp/splined-buildkit.log || true)
          docker run -d --name splined-webgui-release-test --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=splined_test -e PGPASSWORD=splined_ci_only \
            -e PGDATABASE=splined_test -e SPLINED_WEB_TOKEN=ci-browser-only \
            splined-webgui:release-test
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/status > /tmp/splined-status.json; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs splined-webgui-release-test; exit 1; fi
          python - <<'PY'
          import json
          status = json.load(open('/tmp/splined-status.json', encoding='utf-8'))
          assert status['database'] == 'PostgreSQL'
          assert status['database_ready'] is True
          assert status['auth_required'] is True
          PY
          mkdir -p webgui-release/release-assets
          docker save splined-webgui:release-test | gzip -9 > webgui-release/release-assets/splined-webgui-container-image.tar.gz
          image_id=$(docker image inspect -f '{{.Id}}' splined-webgui:release-test)
          image_size=$(docker image inspect -f '{{.Size}}' splined-webgui:release-test)
          archive_size=$(stat -c %s webgui-release/release-assets/splined-webgui-container-image.tar.gz)
          {
            echo "seconds=$(($(date +%s) - started))"
            echo "cached_steps=$cached_steps"
            echo "image_id=$image_id"
            echo "image_size=$image_size"
            echo "archive_size=$archive_size"
          } >> "$GITHUB_OUTPUT"
      - name: Report container logs
        if: always()
        run: docker logs splined-webgui-release-test || true
      - name: Package Python / WebGUI release source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          mkdir -p webgui-release/release-package/build webgui-release/release-assets
          cp -R build/WEBGui webgui-release/release-package/build/
          cp -R schema docs webgui-release/release-package/
          cp .dockerignore webgui-release/release-package/
          cp README.md LICENSE PRIVACY.md SECURITY.md SUPPORT.md webgui-release/release-package/
          tar -czf webgui-release/release-assets/splined-webgui-python.tar.gz -C webgui-release/release-package .
          echo "seconds=$(($(date +%s) - started))" >> "$GITHUB_OUTPUT"
          echo "source_size=$(stat -c %s webgui-release/release-assets/splined-webgui-python.tar.gz)" >> "$GITHUB_OUTPUT"
          rm -rf webgui-release/release-package
      - name: Create checksummed WebGUI build provenance
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ needs.resolve-plan.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          mkdir -p webgui-release/candidate
          cp release-candidate/* webgui-release/candidate/
          python3 .github/scripts/release_artifact_contract.py create-build \
            --kind webgui \
            --root webgui-release \
            --candidate-root release-candidate \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --compile-mode "${{ needs.resolve-plan.outputs.compile_mode }}" \
            --validation python-postgresql-node \
            --validation container-health-database-smoke \
            --validation exact-smoke-tested-image-retained \
            --validation python-source-archive \
            --metric "validation_seconds=${{ steps.tests.outputs.seconds }}" \
            --metric "container_seconds=${{ steps.container.outputs.seconds }}" \
            --metric "cached_buildkit_steps=${{ steps.container.outputs.cached_steps }}" \
            --metric "image_uncompressed_bytes=${{ steps.container.outputs.image_size }}" \
            --metric "image_archive_bytes=${{ steps.container.outputs.archive_size }}" \
            --metric "source_archive_bytes=${{ steps.package.outputs.source_size }}" \
            --metric "packaging_seconds=${{ steps.package.outputs.seconds }}"
      - name: Upload complete validated WebGUI build
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splined-webgui-release
          path: webgui-release/
          if-no-files-found: error
          retention-days: 90
      - name: Report measured WebGUI results
        shell: bash
        run: |
          {
            echo "## Workflow 23 WebGUI build complete"
            echo
            echo "- Candidate commit/version: \`${{ needs.audit-candidate.outputs.commit }}\` / \`${{ needs.audit-candidate.outputs.version }}\`"
            echo "- Mode: \`${{ needs.resolve-plan.outputs.compile_mode }}\`"
            echo "- Python/PostgreSQL/Node validation: \`${{ steps.tests.outputs.seconds }} seconds\`"
            echo "- Container build and health smoke: \`${{ steps.container.outputs.seconds }} seconds\`"
            echo "- Measured cached BuildKit steps: \`${{ steps.container.outputs.cached_steps }}\`"
            echo "- Image ID: \`${{ steps.container.outputs.image_id }}\`"
            echo "- Image size / compressed transfer: \`${{ steps.container.outputs.image_size }} / ${{ steps.container.outputs.archive_size }} bytes\`"
            echo "- Source archive size: \`${{ steps.package.outputs.source_size }} bytes\`"
            echo "- Packaging duration: \`${{ steps.package.outputs.seconds }} seconds\`"
            echo "- Artifact ID: \`${{ steps.upload.outputs.artifact-id }}\`"
            echo "- GHCR publication: \`not performed\`"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: WebGUI workflow summary
    needs: [resolve-plan, audit-candidate, build-webgui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report stage results and recovery action
        shell: bash
        run: |
          {
            echo "## Workflow 23 stage results"
            echo
            echo "- Plan: \`${{ needs.resolve-plan.result }}\`"
            echo "- Candidate audit: \`${{ needs.audit-candidate.result }}\`"
            echo "- WebGUI validation/build/package: \`${{ needs.build-webgui.result }}\`"
            echo "- Next action after failure: correct the reported validation, Docker, health, or packaging error and rerun Workflow 23 with the same candidate."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce selected outcome
        shell: bash
        env:
          PLAN: ${{ needs.resolve-plan.result }}
          AUDIT: ${{ needs.audit-candidate.result }}
          BUILD: ${{ needs.build-webgui.result }}
          REPORT_ONLY: ${{ needs.resolve-plan.outputs.report_only }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          test "$AUDIT" = success
          if [ "$REPORT_ONLY" = true ]; then
            test "$BUILD" = skipped
            result="Report-only audit complete; no build or packaging ran."
          else
            test "$BUILD" = success
            result="Complete WebGUI source archive and exact smoke-tested image retained."
          fi
          {
            echo "## Workflow 23 complete"
            echo
            echo "$result"
            echo "- Total elapsed time: \`$(($(date +%s) - ${{ needs.resolve-plan.outputs.started_epoch }})) seconds\`"
            echo "GitHub Release and GHCR publication were not performed."
          } >> "$GITHUB_STEP_SUMMARY"
