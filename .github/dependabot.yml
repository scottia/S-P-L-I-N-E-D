version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      rust-production:
        dependency-type: production
      rust-development:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /windows
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      windows-rust-production:
        dependency-type: production
      windows-rust-development:
        dependency-type: development

  - package-ecosystem: pip
    directory: /python
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /python
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
