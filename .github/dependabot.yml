version: 2
updates:
  - package-ecosystem: cargo
    directory: /build/Windows
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      windows-rust-production:
        dependency-type: production
      windows-rust-development:
        dependency-type: development

  - package-ecosystem: pip
    directory: /build/WEBGui/webgui
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      webgui-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /build/WEBGui
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
