[package]
name = "splined-windows"
version = "3.0.0"
edition = "2024"
build = "build.rs"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/scottia/S-P-L-I-N-E-D"

[lib]
name = "splined"
path = "src/lib.rs"

[[bin]]
name = "splined-core"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25.1"
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["form", "json", "query", "rustls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.5"
unicode-normalization = "0.1.25"
unicode-casefold = "0.2.0"

[target.'cfg(windows)'.dependencies]
bytemuck = "1.24.0"
pollster = "1.0.1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WNet"] }
