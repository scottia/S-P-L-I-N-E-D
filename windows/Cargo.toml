[package]
name = "splined-windows"
version = "1.0.31"
edition = "2024"
build = "build.rs"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/scottia/S-P-L-I-N-E-D"

[lib]
name = "splined"
path = "src/lib.rs"

[[bin]]
name = "splined"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
hmac = "0.13.0"
lofty = "0.25.1"
rand = "0.10.2"
pbkdf2 = "0.13.0"
reqwest = { version = "0.13.5", features = ["form", "json", "query", "rustls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha2-legacy = { package = "sha2", version = "0.10.9" }
sha1 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.5"
unicode-normalization = "0.1.25"
unicode-casefold = "0.2.0"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
tauri-utils = "=2.10.1"

[dev-dependencies]
minisign-verify = "0.3.0"

[target.'cfg(windows)'.dependencies]
bytemuck = "1.24.0"
pollster = "1.0.1"
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-updater = "=2.13.2"
tauri-utils = "=2.10.1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WNet"] }
winreg = "0.56.0"
