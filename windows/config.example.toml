# S:P:L:I:N:E:D example configuration
# Copy to config/config.toml and adjust paths/settings for the installation.

config_version = 5
mode = "read"
verbosity = "info"

[scan]
scan_mode = true
library_scan = false
scan_mode_timeout = 24
cache_dir = "_cache"
scan_library_dir = ""

[library]
music_library = ""
ignored_subs = []

[samples]
sample_write = true

[credentials]
credential_dir = "credentials"

[splineai]
enabled = false
endpoint = ""

[output]
preserve_file = true
file_formats = ["jpeg", "png", "webp"]
file_name = "cover"
square = false
square_mode = "off"
square_round_to = 0
upscale_below_ideal = false
evaluate_final_image = true

[range]
min = 1200
ideal = 1800
max = 2400
ladder = 3600

[sources]
cover_sources = ["deezer", "itunes", "fanarttv", "lastfm", "coverartarchive", "discogs"]
exclude_cover_sources = []

# MusicBrainz supplies release/recording metadata rather than artwork. Its
# runtime options are stored non-destructively under options in
# credentials/musicbrainz.json. Source override activates those saved values;
# otherwise SPLINED uses 4 retries, 1.05 seconds minimum delay, and a 7 second
# recording timeout.
[source_policies.musicbrainz]
enabled = true
source_override = false

# Optional per-provider policy. With source_override = false, every saved value
# remains inactive and SPLINED uses the global [range] behavior unchanged.
[source_policies.discogs]
source_override = false
minimum_range_type = "LowerRange"
allow_below_minimum_fallback = false
primary_image_only = true
# minimum_short_side = 1500
# maximum_short_side = 3600
# minimum_width = 1500
# minimum_height = 1500

# Docker deployments normally use container paths instead of the relative
# portable defaults above, for example:
#
# [scan]
# cache_dir = "/_cache"
#
# [library]
# music_library = "/music"
#
# [credentials]
# credential_dir = "/credentials"
